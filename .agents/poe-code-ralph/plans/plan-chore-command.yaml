version: 1
project: chore-command
overview: |
  Maintenance tasks like fixing dependabot vulnerabilities, triaging issues, and
  updating dependencies are currently manual. This plan adds `poe-code chore <name>`
  — a pipeline that loads a prompt template, optionally runs a source command to
  discover work items, and spawns one agent per item.

  Architecture: prompt library → source → map(agent executor)

  ┌─────────────┐    ┌──────────┐    ┌──────────────┐
  │ Prompt       │    │ Source   │    │ Agent        │
  │ Library      │───▶│ Command  │───▶│ Executor     │
  │ (discovery)  │    │ (JSON[]) │    │ (per item)   │
  └─────────────┘    └──────────┘    └──────────────┘
  packages/chores/   sh -c "source"   src/sdk/chore.ts

  Two chore modes:
  - Simple (no source): single agent spawn with the full prompt body
  - Sourced (with source field): shell command returns JSON array, each item
    spawns its own agent with a mustache-rendered prompt

  Chore discovery merges two layers:
  1. Built-in: packages/chores/src/prompts/*.md (ships with poe-code)
  2. Project-local: <cwd>/.poe-code/chores/*.md (user-defined, overrides by name)

  State management is GitHub-native — no local state files. Sourced chores use
  platform state: agents add labels (poe-triaged), post reviews, or fix alerts
  that auto-close. Source commands filter already-processed items.

  Design decisions:
  - No gray-matter dependency: simple frontmatter parser promoted from existing
    test code (packages/agent-skill-config/src/templates/poe-generate.test.ts)
  - Mustache for prompt templating: already a project dependency
  - One agent per source item: atomic commits, isolated failures, easier reasoning
  - GitHub-native state over local state files: works across CI runners, idempotent
  - research command as primary pattern: closest analogue for agent/model resolution
  - Runtime .md loading via import.meta.url + readFile: follows poe-agent pattern
  - Default mode yolo (chores make changes), unlike research which defaults to read

goals:
  - "poe-code chore <name>: run named maintenance chore through configured agent"
  - "Pipeline architecture: prompt library → source → map(agent executor)"
  - "Sourced chores: frontmatter source field runs shell command, JSON output mapped to per-item agent spawns"
  - "Simple chores: single agent spawn with raw prompt body"
  - "Mustache templating for per-item prompt rendering"
  - "Chore discovery from built-in prompts and project-local .poe-code/chores/"
  - "Project-local chores override built-in chores by name"
  - "chore list subcommand with table output"
  - "chore enable <name>: create per-chore GitHub Actions workflow file (.github/workflows/chore-<name>.yml)"
  - "chore enable --copy: also copy prompt to .poe-code/chores/ for customization"
  - "chore disable <name>: delete the chore's workflow file"
  - "schedule frontmatter field drives per-job cron in generated workflow"
  - "CLI/SDK parity — same options exposed in both"
  - "GitHub-native state management (labels, reviews, alert auto-close)"
  - "5 built-in chores: update-dependencies, update-documentation, github-issue-check, github-pull-request-check, fix-vulnerabilities"
  - "GitHub Action compatible: poe-code chore <name> --yes --agent <agent>"

nonGoals:
  - Custom chore sources beyond shell commands
  - Parallel agent execution (sequential for now)
  - Chore scheduling or cron built into poe-code (use GitHub Actions)
  - State persistence infrastructure (state lives in GitHub)
  - Chore composition or chaining

qualityGates:
  - npm run test
  - npm run lint
  - npm run e2e:verbose

requirements:
  - id: REQ-001
    title: Frontmatter parsing
    description: |
      The system SHALL parse YAML frontmatter from markdown files delimited by
      --- markers. It SHALL extract key-value pairs including name, description,
      and optional source and schedule fields.
    scenarios:
      - name: Valid frontmatter with all fields
        when: "Markdown has --- delimited YAML with name, description, source fields"
        then: "Returns { name, description, source } and body after closing ---"
      - name: Missing end delimiter
        when: "Markdown has --- start but no closing ---"
        then: "Throws error with message about missing end delimiter"
      - name: Quoted values
        when: Frontmatter value is wrapped in single or double quotes
        then: Quotes are stripped from the parsed value
      - name: No source field
        when: Frontmatter has name and description but no source
        then: Returns source as undefined

  - id: REQ-002
    title: Chore discovery
    description: |
      The system SHALL discover chore definitions from two directories:
      built-in prompts and project-local .poe-code/chores/. Project-local
      chores SHALL override built-in chores with the same name.
    scenarios:
      - name: Built-in chores only
        when: No project-local chores directory exists
        then: Returns all built-in chores
      - name: Project-local override
        when: Project-local has chore with same name as built-in
        then: Project-local definition takes precedence
      - name: Mixed discovery
        when: Both directories have unique chores
        then: Returns merged list with all chores from both sources
      - name: Non-md files ignored
        when: Directory contains .txt or other non-.md files
        then: Only .md files are parsed and returned

  - id: REQ-003
    title: Simple chore execution
    description: |
      When a chore has no source field, the executor SHALL spawn a single
      agent with the full prompt body as the prompt text.
    scenarios:
      - name: Run simple chore
        when: Chore has no source field and agent is specified
        then: Single spawnSdk call with raw prompt, agent, model, and mode
      - name: Dry run simple chore
        when: --dry-run flag is set
        then: Logs what would execute without spawning

  - id: REQ-004
    title: Sourced chore execution
    description: |
      When a chore has a source field, the executor SHALL run the source
      shell command, parse JSON array output, render the prompt template
      per item using mustache, and spawn one agent per item sequentially.
    scenarios:
      - name: Run sourced chore with items
        when: Source command returns JSON array of 3 items
        then: 3 separate agent spawns, each with mustache-rendered prompt
      - name: Source returns empty array
        when: Source command returns []
        then: No agents spawned, chore completes successfully with zero-items message
      - name: Source command fails
        when: Source command exits non-zero
        then: Throws error with source command stderr
      - name: Source returns invalid JSON
        when: Source command stdout is not valid JSON
        then: Throws error about invalid source output

  - id: REQ-005
    title: CLI chore command
    description: |
      The CLI SHALL register a chore command accepting <name> argument and
      --agent, --model, --mode, -i, -C options. Agent and model SHALL be
      resolved interactively when not provided (unless --yes).
    scenarios:
      - name: Run chore with all options
        when: "poe-code chore fix-vulnerabilities --agent claude --model Claude-Sonnet-4.5"
        then: Loads chore, resolves agent/model from flags, executes
      - name: Run chore with --yes
        when: "poe-code chore update-deps --yes"
        then: Uses first configured agent and default model without prompting
      - name: Unknown chore name
        when: "poe-code chore nonexistent"
        then: Throws error listing available chore names
      - name: Interactive agent resolution
        when: "poe-code chore update-deps without --agent flag, TTY attached"
        then: Prompts user to select agent from spawn-capable services

  - id: REQ-006
    title: Chore list subcommand
    description: |
      The CLI SHALL provide a "chore list" subcommand that displays all
      discovered chores in a table with name and description columns.
    scenarios:
      - name: List built-in chores
        when: "poe-code chore list"
        then: Table with 5 built-in chores showing name and description
      - name: List includes project-local
        when: "poe-code chore list with .poe-code/chores/ containing custom.md"
        then: Table includes both built-in and custom chores

  - id: REQ-007
    title: Chore enable subcommand
    description: |
      The CLI SHALL provide a "chore enable <name>" subcommand that creates a
      dedicated GitHub Actions workflow file for the named chore. The schedule
      frontmatter field drives the cron expression. An optional --copy flag
      also copies the prompt to .poe-code/chores/ for customization.
    scenarios:
      - name: Enable creates per-chore workflow
        when: "poe-code chore enable fix-vulnerabilities"
        then: Creates .github/workflows/chore-fix-vulnerabilities.yml with schedule from frontmatter
      - name: Enable with --copy
        when: "poe-code chore enable fix-vulnerabilities --copy"
        then: Creates workflow AND copies fix-vulnerabilities.md to .poe-code/chores/
      - name: Enable without --copy
        when: "poe-code chore enable fix-vulnerabilities without --copy"
        then: Only creates workflow file, no .poe-code/chores/ directory created
      - name: Enable unknown chore
        when: "poe-code chore enable nonexistent"
        then: Throws error listing available chore names

  - id: REQ-008
    title: Chore disable subcommand
    description: |
      The CLI SHALL provide a "chore disable <name>" subcommand that deletes
      the GitHub Actions workflow file for the named chore.
    scenarios:
      - name: Disable deletes workflow
        when: "poe-code chore disable fix-vulnerabilities"
        then: Deletes .github/workflows/chore-fix-vulnerabilities.yml
      - name: Disable when not enabled
        when: "poe-code chore disable fix-vulnerabilities but workflow file does not exist"
        then: Warns that chore is not currently enabled

  - id: REQ-009
    title: SDK chore function
    description: |
      The SDK SHALL export a chore function with the same capabilities as
      the CLI command, accepting agent, model, mode, and cwd options.
    scenarios:
      - name: SDK simple chore
        when: SDK chore() called with name and agent
        then: Returns { events, result } matching spawn pattern
      - name: SDK sourced chore
        when: SDK chore() called for sourced chore
        then: Returns array of results, one per source item

stories:
  - id: US-001
    title: Create @poe-code/chores package with frontmatter parser
    status: open
    dependsOn: []
    description: |
      As a developer, I want a new @poe-code/chores workspace package with
      a frontmatter parser that extracts name, description, source, and body
      from markdown files, so chore prompts can be declaratively defined.
    acceptanceCriteria:
      - Package at packages/chores with @poe-code/chores name
      - "parseFrontmatter(md) returns Record<string, string> from --- delimited YAML"
      - "extractBody(md) returns markdown content after frontmatter"
      - Handles quoted values, comments, blank lines, duplicate key errors
      - Throws on missing start/end delimiter
      - Package builds with tsc, exports types
      - All tests pass (pure function tests, no mocking needed)

  - id: US-002
    title: Implement ChoreDefinition types and chore discovery
    status: open
    dependsOn:
      - US-001
    description: |
      As a developer, I want a discovery function that reads .md files from
      a directory, parses frontmatter, and returns ChoreDefinition objects,
      so chores are automatically discovered from the filesystem.
    acceptanceCriteria:
      - "ChoreDefinition type: { name, description, prompt, source?, schedule? }"
      - "discoverChores(dirs) reads .md files, parses frontmatter, returns ChoreDefinition[]"
      - "loadChore(name, dirs) returns single chore or throws with available names"
      - Ignores non-.md files
      - Tests mock node:fs/promises (vi.mock)

  - id: US-003
    title: Implement two-layer discovery (built-in + project-local)
    status: open
    dependsOn:
      - US-002
    description: |
      As a user, I want to define custom chores in .poe-code/chores/ that
      override built-in chores by name, so I can customize maintenance
      tasks for my project.
    acceptanceCriteria:
      - Discovery merges built-in (packages/chores/src/prompts/) and project-local (<cwd>/.poe-code/chores/)
      - Project-local chores override built-in when names match
      - Missing project-local directory is silently ignored
      - chore list shows merged results with source indicated

  - id: US-004
    title: Write 5 built-in chore prompt files
    status: open
    dependsOn:
      - US-001
    description: |
      As a user, I want built-in chores for common maintenance tasks
      shipped with poe-code, so I can run them out of the box.
    acceptanceCriteria:
      - "update-dependencies.md: simple chore, no source"
      - "update-documentation.md: simple chore, no source"
      - "github-issue-check.md: sourced chore, source uses gh issue list, prompt instructs adding poe-triaged label"
      - "github-pull-request-check.md: sourced chore, source uses gh pr list"
      - "fix-vulnerabilities.md: sourced chore, source uses gh api dependabot/alerts"
      - All prompts have valid frontmatter with name, description, and schedule
      - Sourced prompts use mustache template syntax for per-item rendering
      - Validation test reads all .md files and asserts valid frontmatter
      - build script copies prompts to dist (tsc && cp -r src/prompts dist/prompts)

  - id: US-005
    title: Implement SDK chore executor with source pipeline
    status: open
    dependsOn:
      - US-002
    description: |
      As a developer, I want an SDK function that orchestrates the
      source → map(spawn) pipeline, so both CLI and SDK can run chores
      with the same logic.
    acceptanceCriteria:
      - "Simple chores: single spawnSdk call with raw prompt"
      - "Sourced chores: runs source command via commandRunner('sh', ['-c', source])"
      - Parses source stdout as JSON array
      - Renders prompt template per item using mustache.render
      - Spawns one agent per item sequentially
      - Returns results array (one SpawnResult per item)
      - Empty source array completes successfully with no spawns
      - Source command failure throws with stderr
      - Invalid JSON from source throws descriptive error
      - Default mode is yolo (chores make changes)
      - Tests mock spawnSdk and commandRunner

  - id: US-006
    title: Implement CLI chore command with agent/model resolution
    status: open
    dependsOn:
      - US-003
      - US-005
    description: |
      As a user, I want to run poe-code chore <name> with the same
      agent/model options as spawn and research, so chore execution
      follows familiar patterns.
    acceptanceCriteria:
      - "registerChoreCommand(program, container) follows research command pattern"
      - "Options: --agent, --model, --mode, -i --interactive, -C --cwd"
      - Agent resolved interactively when not provided (unless --yes)
      - Model resolved interactively from agent's configurePrompts (unless --yes)
      - --yes accepts first configured agent and default model
      - Unknown chore name throws error with available names
      - Renders ACP stream from spawn events
      - Uses createExecutionResources for logger/context
      - Registered in src/cli/program.ts

  - id: US-007
    title: Implement chore list subcommand
    status: open
    dependsOn:
      - US-003
    description: |
      As a user, I want poe-code chore list to show a table of all
      available chores with their names and descriptions.
    acceptanceCriteria:
      - "chore list renders table using @poe-code/design-system renderTable"
      - Shows Name and Description columns
      - Includes both built-in and project-local chores
      - Screenshot verification via npm run screenshot-poe-code -- chore list

  - id: US-008
    title: Implement chore enable subcommand
    status: open
    dependsOn:
      - US-003
    description: |
      As a user, I want poe-code chore enable <name> to create a dedicated
      GitHub Actions workflow file for the named chore, so I can automate
      chore execution via CI.
    acceptanceCriteria:
      - Creates .github/workflows/chore-<name>.yml with schedule from frontmatter
      - Workflow template uses npx poe-code chore <name> --yes --agent claude
      - schedule frontmatter field drives cron expression
      - --copy flag also copies .md prompt to .poe-code/chores/ for customization
      - Unknown chore name throws error listing available names
      - Screenshot verification via npm run screenshot-poe-code -- chore enable --help

  - id: US-009
    title: Implement chore disable subcommand
    status: open
    dependsOn:
      - US-008
    description: |
      As a user, I want poe-code chore disable <name> to delete the workflow
      file for a chore, so I can stop automated execution.
    acceptanceCriteria:
      - Deletes .github/workflows/chore-<name>.yml
      - Warns if workflow file does not exist (chore not currently enabled)
      - Does not touch .poe-code/chores/ (user may still want custom prompt)

  - id: US-010
    title: Export SDK chore function and wire help text
    status: open
    dependsOn:
      - US-006
      - US-007
      - US-009
    description: |
      As an SDK user, I want chore() exported from poe-code so I can
      run chores programmatically with the same API as spawn.
    acceptanceCriteria:
      - chore function exported from src/index.ts
      - Help text updated in program.ts command matrix
      - Screenshot verification via npm run screenshot-poe-code -- chore --help
      - Screenshot verification via npm run screenshot-poe-code -- --help

  - id: US-011
    title: E2E validation
    status: open
    dependsOn:
      - US-010
    description: |
      As a developer, I want to verify the full chore flow end-to-end
      including discovery, source execution, and agent spawn.
    acceptanceCriteria:
      - E2E tests pass (npm run e2e:verbose)
      - "Spot test: npm run dev -- chore list shows all 5 chores"
      - "Spot test: npm run dev -- chore update-dependencies --dry-run shows prompt"
      - "Spot test: npm run dev -- chore enable fix-vulnerabilities creates workflow file"
      - "Spot test: npm run dev -- chore disable fix-vulnerabilities deletes workflow file"
      - All quality gates pass
