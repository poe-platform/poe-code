version: 1
project: ci-api-key-storage
overview: |
  The CLI currently stores API keys as plaintext JSON in ~/.poe-code/credentials.json.
  Any process or user with read access can see the key — it could be accidentally
  committed, leaked by a crash dump, or harvested by malware scanning home directories.

  This plan introduces a new `@poe-code/auth` workspace package that encapsulates all
  credential management: login, logout, API key retrieval, and encrypted storage.
  Packaging auth separately makes it easy to add OAuth or other auth methods later
  without touching the CLI/SDK core.

  The package implements a storage strategy with two backends:
  1. Default: AES-256-GCM encrypted file using Node.js built-in crypto (works everywhere)
  2. Opt-in: macOS Keychain via `security` CLI tool (POE_AUTH_BACKEND=keychain)

  Encrypted file is the default because it works on all platforms with zero
  surprises — no Keychain popups, no libsecret, no CI failures. Users who want
  OS-level keychain protection can opt in via POE_AUTH_BACKEND=keychain.

  Design decisions:
  - Encrypted file as default over keychain-first: encrypted file works everywhere
    with zero surprises. Keychain requires testing on each macOS version, can trigger
    popups, and fails in CI. Safer default = less support burden.
  - Keychain as opt-in via POE_AUTH_BACKEND=keychain: users who want real OS vault
    security can enable it. Env var only, no CLI flag.
  - New `@poe-code/auth` package over inline code: isolates auth concerns, makes
    OAuth extensibility natural, keeps CLI/SDK lean.
  - Shell-based keychain (`security` CLI) over native modules (keytar): keytar is
    deprecated, native modules break esbuild bundling, shell commands are zero-dep.
  - Machine-derived encryption key via scrypt: no passphrase prompts, tied to the
    machine (hostname + username), meaningless if file is copied elsewhere.
  - Service metadata (configured_services) stays in credentials.json: not sensitive,
    no need to encrypt. Only the API key moves to poe-auth storage.
  - File permissions 0600 on credentials.enc: defense-in-depth, owner-only access.
  - macOS Keychain popup warning: when keychain backend is active, first login may
    trigger a one-time OS approval dialog — warn the user before it happens.
  - Clear error on decryption failure: if hostname/username changes, show actionable
    message instead of silently returning null.

  Architecture:
    ┌─────────────────────────────────────────┐
    │  @poe-code/auth                         │
    │                                         │
    │  AuthStore (interface)                   │
    │    ├── EncryptedFileAuthStore (default)  │
    │    └── KeychainAuthStore (macOS opt-in)  │
    │                                         │
    │  createAuthStore({ backend, platform })  │
    │    → auto / keychain / file              │
    │                                         │
    │  Exports: getApiKey, setApiKey,          │
    │           deleteApiKey, createAuthStore   │
    └────────────┬────────────────────────────┘
                 │ consumed by
        ┌────────┴────────┐
        │                 │
   src/cli/           src/sdk/
   container.ts       credentials.ts
   (ApiKeyStore)      (getPoeApiKey)
goals:
  - Encrypt API keys at rest — not readable as plaintext in any file
  - Encrypted file as default backend (works everywhere, zero surprises)
  - Opt-in OS Keychain on macOS via POE_AUTH_BACKEND=keychain
  - POE_AUTH_BACKEND env var to select backend (file default, keychain opt-in)
  - New @poe-code/auth package to encapsulate all credential logic
  - Silent migration from plaintext credentials.json
  - Minimal UX changes — warn about Keychain popup, show which backend was used
  - CLI/SDK parity via shared package
  - Testable with dependency injection (no real keychain or filesystem in tests)
  - Extensible for future OAuth support
  - File permissions 0600 on encrypted credential files
  - auth status command for debugging auth issues
nonGoals:
  - HSM-grade or hardware-backed key storage
  - Protection against malware running as the same user with code execution
  - Windows Credential Manager or Linux Secret Service support (future work)
  - OAuth implementation (future — package structure supports it)
  - Encrypting service metadata (configured_services)
  - --backend CLI flag (env var only for backend selection)
qualityGates:
  - npm run test
  - npm run lint
  - npm run e2e:verbose
stories:
  - id: US-001
    title: Create @poe-code/auth package with AuthStore interface
    status: done
    dependsOn: []
    description: |
      As a developer, I want a new @poe-code/auth workspace package that
      defines the AuthStore interface and exports a factory function,
      so that auth concerns are isolated from the CLI/SDK.
    acceptanceCriteria:
      - Package at packages/auth with @poe-code/auth name
      - "AuthStore interface: getApiKey, setApiKey, deleteApiKey"
      - createAuthStore factory returns { store, backend } where backend is 'keychain' | 'file'
      - Package builds with tsc, exports types
      - Registered in root package.json workspaces
    startedAt: 2026-02-23T16:24:00.060Z
    completedAt: 2026-02-23T16:39:49.421Z
    updatedAt: 2026-02-23T16:39:49.421Z
  - id: US-002
    title: Implement EncryptedFileAuthStore
    status: done
    dependsOn:
      - US-001
    description: |
      As a developer, I want an encrypted file backend that stores
      API keys using AES-256-GCM with a machine-derived key, so that
      credentials are encrypted at rest on all platforms.
    acceptanceCriteria:
      - Encrypts API key with AES-256-GCM, random IV per write
      - Derives encryption key from hostname + username via scrypt
      - Stores to ~/.poe-code/credentials.enc (configurable path)
      - File permissions set to 0600 on write
      - getApiKey returns null on decryption failure (no throw)
      - deleteApiKey removes the encrypted file
      - Machine identity injectable for testing
      - Zero external dependencies — Node.js crypto only
      - All tests use injected deps (no real fs or os calls)
    startedAt: 2026-02-23T16:39:49.557Z
    completedAt: 2026-02-23T16:49:46.063Z
    updatedAt: 2026-02-23T16:49:46.063Z
  - id: US-003
    title: Implement KeychainAuthStore (macOS)
    status: done
    dependsOn:
      - US-001
    description: |
      As a macOS user, I want my API key stored in the OS Keychain
      via the security CLI, so I get real OS-level credential protection.
    acceptanceCriteria:
      - Uses security add-generic-password with service=poe-code, account=api-key
      - Uses security find-generic-password to read
      - Uses security delete-generic-password to delete
      - Returns null when keychain entry not found (no throw)
      - Command execution injectable for testing (no real shell calls)
      - Handles security CLI errors gracefully
    startedAt: 2026-02-23T16:49:46.252Z
    completedAt: 2026-02-23T16:58:34.267Z
    updatedAt: 2026-02-23T16:58:34.267Z
  - id: US-004
    title: Implement backend selection and POE_AUTH_BACKEND env var
    status: done
    dependsOn:
      - US-002
      - US-003
    description: |
      As a user, I want the default backend to be encrypted file
      (works everywhere), and opt into macOS Keychain via
      POE_AUTH_BACKEND=keychain when I want OS-level protection.
    acceptanceCriteria:
      - "Default (no env var): EncryptedFileAuthStore on all platforms"
      - POE_AUTH_BACKEND=file explicitly selects EncryptedFileAuthStore
      - POE_AUTH_BACKEND=keychain selects KeychainAuthStore on macOS
      - POE_AUTH_BACKEND=keychain on non-macOS throws a clear error
      - createAuthStore reads POE_AUTH_BACKEND from provided env/process.env
    startedAt: 2026-02-23T16:58:34.423Z
    completedAt: 2026-02-23T17:04:39.274Z
    updatedAt: 2026-02-23T17:04:39.274Z
  - id: US-005
    title: Implement silent migration from plaintext credentials.json
    status: open
    dependsOn:
      - US-002
      - US-003
    description: |
      As a user with existing plaintext credentials, I want my API key
      silently migrated to the new auth store on first access, so I
      don't need to re-login.
    acceptanceCriteria:
      - When auth store is empty, checks credentials.json for plaintext apiKey
      - If found, writes key to auth store and removes apiKey from credentials.json
      - configured_services preserved in credentials.json
      - Migration is transparent — no user-visible output on success
      - Migration failure logs a warning and returns the plaintext key anyway
      - Migration only runs once (subsequent reads hit auth store directly)
      - FileSystem injectable for testing with memfs
    updatedAt: 2026-02-23T17:31:48.947Z
  - id: US-006
    title: Wire @poe-code/auth into CLI container
    status: open
    dependsOn:
      - US-004
      - US-005
    description: |
      As a developer, I want the CLI container's apiKeyStore to use
      @poe-code/auth, so that login/logout commands use the new
      secure storage transparently.
    acceptanceCriteria:
      - apiKeyStore.read delegates to authStore.getApiKey
      - apiKeyStore.write delegates to authStore.setApiKey
      - Login command stores via auth package (no direct credentials.ts for API key)
      - Logout command calls authStore.deleteApiKey AND deleteCredentials
      - No changes to login/logout command signatures or UX
      - isolated-env.ts uses auth store for API key resolution
  - id: US-007
    title: Update SDK getPoeApiKey to use @poe-code/auth
    status: open
    dependsOn:
      - US-004
    description: |
      As an SDK user, I want getPoeApiKey() to read from the new
      auth store, so SDK consumers get the same secure storage as CLI.
    acceptanceCriteria:
      - getPoeApiKey reads from @poe-code/auth store
      - POE_API_KEY env var still takes priority
      - Falls through to error if neither env var nor store has a key
      - SDK container uses @poe-code/auth for apiKeyStore
    updatedAt: 2026-02-23T18:30:21.546Z
  - id: US-008
    title: Login UX — backend feedback and Keychain warning
    status: open
    dependsOn:
      - US-006
    description: |
      As a macOS user, I want to be warned about the Keychain access
      popup on first login, and told where my key was stored after
      login succeeds, so I understand what's happening.
    acceptanceCriteria:
      - "On macOS with keychain backend, warn before storing: 'macOS may prompt you to allow Keychain access for poe-code.'"
      - "After successful store in keychain, log: 'API key stored in macOS Keychain.'"
      - "After successful store in encrypted file, log: 'API key stored (encrypted).'"
      - "Decryption failure shows actionable message: 'Stored credentials could not be decrypted. Run poe-code login to re-authenticate.'"
  - id: US-009
    title: Implement poe-code auth status command
    status: open
    dependsOn:
      - US-006
    description: |
      As a user, I want "poe-code auth status" to show me whether I'm
      logged in, which storage backend is active, and whether my key
      is valid, so I can debug auth issues.
    acceptanceCriteria:
      - Shows logged-in state (yes/no)
      - Shows active backend (macOS Keychain / encrypted file)
      - Validates key by calling usage/current_balance endpoint
      - "If valid: shows current point balance"
      - "If invalid: shows that key validation failed with HTTP status"
      - "If not logged in: suggests 'poe-code login'"
      - Respects --dry-run flag
  - id: US-010
    title: E2E validation
    status: open
    dependsOn:
      - US-008
      - US-009
    description: |
      As a developer, I want to verify the full login/logout/spawn
      flow works end-to-end with encrypted storage, so that we don't
      ship regressions.
    acceptanceCriteria:
      - E2E tests pass with encrypted credential storage
      - Login stores key, spawn reads it, logout clears it
      - POE_AUTH_BACKEND=file works in E2E environment
      - Migration from plaintext credentials works in E2E
      - auth status command works in E2E
