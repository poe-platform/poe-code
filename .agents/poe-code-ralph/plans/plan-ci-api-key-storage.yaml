version: 1
project: ci-api-key-storage

overview: |
  The CLI currently stores API keys as plaintext JSON in ~/.poe-code/credentials.json.
  Any process or user with read access can see the key — it could be accidentally
  committed, leaked by a crash dump, or harvested by malware scanning home directories.

  This plan introduces a new `@poe-code/auth` workspace package that encapsulates all
  credential management: login, logout, API key retrieval, and encrypted storage.
  Packaging auth separately makes it easy to add OAuth or other auth methods later
  without touching the CLI/SDK core.

  The package implements a hybrid storage strategy (Option 4):
  1. macOS: OS Keychain via `security` CLI tool (no native modules)
  2. Fallback: AES-256-GCM encrypted file using Node.js built-in crypto
  3. POE_AUTH_BACKEND env var to force a specific backend (e.g. force encrypted
     file on macOS for CI runners)

  Design decisions:
  - New `@poe-code/auth` package over inline code: isolates auth concerns, makes
    OAuth extensibility natural, keeps CLI/SDK lean.
  - Shell-based keychain (`security` CLI) over native modules (keytar): keytar is
    deprecated, native modules break esbuild bundling, shell commands are zero-dep.
  - Hybrid with fallback over keychain-only: headless CI and Linux without
    libsecret need a working fallback. Encrypted file covers all environments.
  - POE_AUTH_BACKEND env var: lets users/CI force encrypted file even on macOS
    (e.g. `POE_AUTH_BACKEND=file`).
  - Machine-derived encryption key via scrypt: no passphrase prompts, tied to the
    machine (hostname + username), meaningless if file is copied elsewhere.
  - Service metadata (configured_services) stays in credentials.json: not sensitive,
    no need to encrypt. Only the API key moves to poe-auth storage.

  Architecture:
    ┌─────────────────────────────────────────┐
    │  @poe-code/auth                         │
    │                                         │
    │  AuthStore (interface)                   │
    │    ├── KeychainAuthStore (macOS)         │
    │    └── EncryptedFileAuthStore (fallback) │
    │                                         │
    │  createAuthStore({ backend, platform })  │
    │    → auto / keychain / file              │
    │                                         │
    │  Exports: getApiKey, setApiKey,          │
    │           deleteApiKey, createAuthStore   │
    └────────────┬────────────────────────────┘
                 │ consumed by
        ┌────────┴────────┐
        │                 │
   src/cli/           src/sdk/
   container.ts       credentials.ts
   (ApiKeyStore)      (getPoeApiKey)

goals:
  - Encrypt API keys at rest — not readable as plaintext in any file
  - Use OS Keychain on macOS via shell commands (zero native deps)
  - Encrypted file fallback for CI, headless, and unsupported platforms
  - POE_AUTH_BACKEND env var to force a specific backend
  - New @poe-code/auth package to encapsulate all credential logic
  - Silent migration from plaintext credentials.json
  - No UX changes — no prompts, no clicks, no passphrase
  - CLI/SDK parity via shared package
  - Testable with dependency injection (no real keychain or filesystem in tests)
  - Extensible for future OAuth support

nonGoals:
  - HSM-grade or hardware-backed key storage
  - Protection against malware running as the same user with code execution
  - Windows Credential Manager or Linux Secret Service support (future work)
  - OAuth implementation (future — package structure supports it)
  - Encrypting service metadata (configured_services)

qualityGates:
  - npm run test
  - npm run lint
  - npm run e2e:verbose

requirements:
  - name: AuthStore Interface
    description: |
      The @poe-code/auth package SHALL expose an AuthStore interface with
      getApiKey, setApiKey, and deleteApiKey methods. All methods are async.
    scenarios:
      - name: Interface contract
        when: A consumer imports AuthStore from @poe-code/auth
        then: |
          The interface exposes:
            getApiKey(): Promise<string | null>
            setApiKey(apiKey: string): Promise<void>
            deleteApiKey(): Promise<void>

  - name: KeychainAuthStore (macOS)
    description: |
      On macOS, the system SHALL store API keys in the OS Keychain using the
      `security` CLI tool. The service name SHALL be "poe-code" and the
      account name SHALL be "api-key".
    scenarios:
      - name: Store key in Keychain
        when: setApiKey is called on macOS
        then: |
          Executes: security add-generic-password -U -s "poe-code" -a "api-key" -w "<key>"
      - name: Read key from Keychain
        when: getApiKey is called on macOS
        then: |
          Executes: security find-generic-password -s "poe-code" -a "api-key" -w
          Returns the key value, or null if not found
      - name: Delete key from Keychain
        when: deleteApiKey is called on macOS
        then: |
          Executes: security delete-generic-password -s "poe-code" -a "api-key"
      - name: Keychain command failure
        when: The security CLI returns a non-zero exit code
        then: The method falls back to EncryptedFileAuthStore gracefully

  - name: EncryptedFileAuthStore (fallback)
    description: |
      The system SHALL provide an encrypted file backend using AES-256-GCM.
      The encryption key SHALL be derived from machine-specific data
      (os.hostname + os.userInfo().username) using scrypt with a fixed
      application salt. The encrypted key is stored in
      ~/.poe-code/credentials.enc.
    scenarios:
      - name: Write encrypts the API key
        when: setApiKey is called with an API key
        then: |
          The file contains base64-encoded (iv + ciphertext + authTag),
          not readable as plaintext
      - name: Read decrypts the API key
        when: getApiKey is called and the encrypted file exists
        then: The original plaintext API key is returned
      - name: Decryption failure returns null
        when: The encrypted file is corrupted or from a different machine
        then: getApiKey returns null (does not throw)

  - name: Backend Selection
    description: |
      createAuthStore SHALL select the backend based on:
      1. POE_AUTH_BACKEND env var (if set): "keychain" or "file"
      2. Platform auto-detection: keychain on macOS, file elsewhere
      When backend is "auto" (default), macOS uses keychain with file fallback.
    scenarios:
      - name: Auto-detect macOS
        when: Platform is darwin and POE_AUTH_BACKEND is not set
        then: KeychainAuthStore is used
      - name: Auto-detect Linux
        when: Platform is linux and POE_AUTH_BACKEND is not set
        then: EncryptedFileAuthStore is used
      - name: Force file on macOS
        when: Platform is darwin and POE_AUTH_BACKEND=file
        then: EncryptedFileAuthStore is used
      - name: Force keychain on macOS
        when: Platform is darwin and POE_AUTH_BACKEND=keychain
        then: KeychainAuthStore is used

  - name: Backward Compatible Migration
    description: |
      When getApiKey finds no key in the auth store, it SHALL check
      the legacy credentials.json for a plaintext apiKey field. If found,
      it SHALL migrate the key to the new store and remove the apiKey
      field from credentials.json (preserving configured_services).
    scenarios:
      - name: Migrate plaintext key
        when: Auth store is empty but credentials.json has a plaintext apiKey
        then: |
          Key is written to the new auth store.
          apiKey field is removed from credentials.json.
          configured_services is preserved.
      - name: No migration needed
        when: Auth store already has a key
        then: credentials.json is not read for API key purposes
      - name: No legacy file
        when: Auth store is empty and credentials.json has no apiKey
        then: getApiKey returns null

  - name: CLI Integration
    description: |
      The CLI container's apiKeyStore SHALL use @poe-code/auth's
      createAuthStore. Login writes via the auth store. Logout deletes
      from both the auth store and legacy credentials.json.
    scenarios:
      - name: Login stores via auth package
        when: User runs "poe-code login"
        then: API key is stored via @poe-code/auth (keychain or encrypted file)
      - name: Logout clears all stores
        when: User runs "poe-code logout"
        then: |
          Auth store key is deleted.
          credentials.json is deleted (same as current behavior).

  - name: SDK Integration
    description: |
      The SDK's getPoeApiKey() SHALL use @poe-code/auth to read
      credentials. POE_API_KEY env var still takes priority.
    scenarios:
      - name: SDK reads from auth store
        when: getPoeApiKey is called without POE_API_KEY set
        then: Reads from @poe-code/auth store (keychain or encrypted file)
      - name: Env var overrides auth store
        when: POE_API_KEY is set
        then: The environment variable value is used

  - name: Environment Variable Override
    description: |
      POE_API_KEY environment variable SHALL continue to take precedence
      over any stored credentials. No change in resolution priority.
    scenarios:
      - name: Env var overrides all stores
        when: POE_API_KEY is set and auth store has a key
        then: The environment variable value is used

stories:
  - id: US-001
    title: Create @poe-code/auth package with AuthStore interface
    status: open
    dependsOn: []
    description: |
      As a developer, I want a new @poe-code/auth workspace package that
      defines the AuthStore interface and exports a factory function,
      so that auth concerns are isolated from the CLI/SDK.
    acceptanceCriteria:
      - "Package at packages/auth with @poe-code/auth name"
      - "AuthStore interface: getApiKey, setApiKey, deleteApiKey"
      - "createAuthStore factory function with platform and backend options"
      - "Package builds with tsc, exports types"
      - "Registered in root package.json workspaces"

  - id: US-002
    title: Implement EncryptedFileAuthStore
    status: open
    dependsOn:
      - US-001
    description: |
      As a developer, I want an encrypted file backend that stores
      API keys using AES-256-GCM with a machine-derived key, so that
      credentials are encrypted at rest on all platforms.
    acceptanceCriteria:
      - "Encrypts API key with AES-256-GCM, random IV per write"
      - "Derives encryption key from hostname + username via scrypt"
      - "Stores to ~/.poe-code/credentials.enc (configurable path)"
      - "getApiKey returns null on decryption failure (no throw)"
      - "deleteApiKey removes the encrypted file"
      - "Machine identity injectable for testing"
      - "Zero external dependencies — Node.js crypto only"
      - "All tests use injected deps (no real fs or os calls)"

  - id: US-003
    title: Implement KeychainAuthStore (macOS)
    status: open
    dependsOn:
      - US-001
    description: |
      As a macOS user, I want my API key stored in the OS Keychain
      via the security CLI, so I get real OS-level credential protection.
    acceptanceCriteria:
      - "Uses security add-generic-password with service=poe-code, account=api-key"
      - "Uses security find-generic-password to read"
      - "Uses security delete-generic-password to delete"
      - "Returns null when keychain entry not found (no throw)"
      - "Command execution injectable for testing (no real shell calls)"
      - "Handles security CLI errors gracefully"

  - id: US-004
    title: Implement backend selection and POE_AUTH_BACKEND env var
    status: open
    dependsOn:
      - US-002
      - US-003
    description: |
      As a CI operator, I want to force the encrypted file backend
      via POE_AUTH_BACKEND=file, so that macOS CI runners don't
      prompt for Keychain access.
    acceptanceCriteria:
      - "POE_AUTH_BACKEND=file forces EncryptedFileAuthStore on any platform"
      - "POE_AUTH_BACKEND=keychain forces KeychainAuthStore (errors if not macOS)"
      - "Default (auto): keychain on macOS, file elsewhere"
      - "createAuthStore reads POE_AUTH_BACKEND from provided env/process.env"

  - id: US-005
    title: Implement silent migration from plaintext credentials.json
    status: open
    dependsOn:
      - US-002
      - US-003
    description: |
      As a user with existing plaintext credentials, I want my API key
      silently migrated to the new auth store on first access, so I
      don't need to re-login.
    acceptanceCriteria:
      - "When auth store is empty, checks credentials.json for plaintext apiKey"
      - "If found, writes key to auth store and removes apiKey from credentials.json"
      - "configured_services preserved in credentials.json"
      - "Migration is transparent — no user-visible output"
      - "Migration only runs once (subsequent reads hit auth store directly)"
      - "FileSystem injectable for testing with memfs"

  - id: US-006
    title: Wire @poe-code/auth into CLI container
    status: open
    dependsOn:
      - US-004
      - US-005
    description: |
      As a developer, I want the CLI container's apiKeyStore to use
      @poe-code/auth, so that login/logout commands use the new
      secure storage transparently.
    acceptanceCriteria:
      - "apiKeyStore.read delegates to authStore.getApiKey"
      - "apiKeyStore.write delegates to authStore.setApiKey"
      - "Login command stores via auth package (no direct credentials.ts for API key)"
      - "Logout command calls authStore.deleteApiKey AND deleteCredentials"
      - "No changes to login/logout command signatures or UX"
      - "isolated-env.ts uses auth store for API key resolution"

  - id: US-007
    title: Update SDK getPoeApiKey to use @poe-code/auth
    status: open
    dependsOn:
      - US-004
    description: |
      As an SDK user, I want getPoeApiKey() to read from the new
      auth store, so SDK consumers get the same secure storage as CLI.
    acceptanceCriteria:
      - "getPoeApiKey reads from @poe-code/auth store"
      - "POE_API_KEY env var still takes priority"
      - "Falls through to error if neither env var nor store has a key"
      - "SDK container uses @poe-code/auth for apiKeyStore"

  - id: US-008
    title: E2E validation
    status: open
    dependsOn:
      - US-006
      - US-007
    description: |
      As a developer, I want to verify the full login/logout/spawn
      flow works end-to-end with encrypted storage, so that we don't
      ship regressions.
    acceptanceCriteria:
      - "E2E tests pass with encrypted credential storage"
      - "Login stores key, spawn reads it, logout clears it"
      - "POE_AUTH_BACKEND=file works in E2E environment"
      - "Migration from plaintext credentials works in E2E"
