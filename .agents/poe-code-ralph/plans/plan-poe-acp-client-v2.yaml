version: 1
project: poe-acp-client-v2
overview: |
  Upgrade @poe-code/poe-acp-client from a session/update notification consumer
  into a fully ACP-compliant bidirectional client implementation.

  Reference: https://agentclientprotocol.com/protocol/schema

  v1 (plan-poe-agent-restoration) delivered:
    - ACP types for session/update notifications
    - JSON-RPC formatSessionUpdate / parseSessionUpdate helpers
    - Stream helpers (extract messages, usage, tool calls)
    - Run report generation
    - Legacy event mapper

  v2 delivers the complete bidirectional ACP transport:

    ┌──────────────┐  stdin/stdout (JSON-RPC 2.0)  ┌──────────────┐
    │   ACP Client │ ◄────────────────────────────► │   ACP Agent  │
    │  (poe-code)  │                                │ (subprocess) │
    └──────────────┘                                └──────────────┘

  Client → Agent requests:
    initialize, authenticate, session/new, session/load,
    session/prompt, session/set_mode, session/set_config_option,
    session/cancel (notification)

  Agent → Client requests:
    session/request_permission, fs/read_text_file, fs/write_text_file,
    terminal/create, terminal/output, terminal/wait_for_exit,
    terminal/kill, terminal/release

  Agent → Client notifications:
    session/update (types from v1, corrected for schema compliance)

  The transport is stdio-based JSON-RPC 2.0 with newline-delimited messages.
  Capability negotiation during initialize determines which client methods
  the agent may call. Multiple concurrent sessions on a single connection.

  COMPLIANCE FIXES — v1 types diverge from the ACP schema:
    - ToolKind: spec is (read | write | execute | other), v1 has
      non-spec values (edit, delete, move, search, think, fetch, switch_mode)
    - ToolCallStatus: missing "cancelled"
    - ToolCallLocation: uses "line" not "lineNumber"
    - ToolCallContent: spec union is (text | diff | image | resource_link
      | resource | terminal), v1 wraps ContentBlock in a "content" item
    - StopReason: not yet defined (spec: completed | cancelled | max_tokens)
    - SessionCapabilities: missing from types
    - RequestId: spec allows null | number | string

  The only current consumer of ToolKind is poe-agent, which uses only
  "execute" — so the ToolKind narrowing is safe.
goals:
  - Full compliance with ACP schema at agentclientprotocol.com
  - Bidirectional JSON-RPC 2.0 transport over stdin/stdout
  - Full ACP protocol lifecycle (initialize → authenticate → session → prompt)
  - Capability negotiation (client advertises fs, terminal support)
  - All agent methods (client → agent requests)
  - All client methods (agent → client requests)
  - Permission request/response flow
  - Extension method support (underscore-prefixed custom methods)
  - ACP error codes and structured error handling
nonGoals:
  - HTTP or SSE transport (stdio only for now)
  - Agent-side ACP implementation (lives in @poe-code/poe-agent)
  - UI rendering of session updates (consumer responsibility)
  - MCP server proxy through ACP
qualityGates:
  - npm run test
  - npm run lint
stories:
  - id: US-001
    title: Align v1 types with ACP schema and add protocol types
    status: done
    dependsOn: []
    description: |
      As a developer, I want all existing v1 types corrected to match
      the ACP schema, and all missing protocol types added, so the
      entire type surface is spec-compliant before building the transport.

      Schema alignment fixes for existing types:
        - ToolKind: change to (read | write | execute | other) per spec
        - ToolCallStatus: add "cancelled" to the union
        - ToolCallLocation: rename "line" → "lineNumber"
        - ToolCallContent: replace generic ToolCallContentItem with
          individual discriminants matching spec union:
            text     → { type: "text"; text: string; _meta? }
            diff     → { type: "diff"; path; newText; oldText?; _meta? }
            image    → { type: "image"; data; mimeType; _meta? }
            resource_link → { type: "resource_link"; uri; name; ... _meta? }
            resource → { type: "resource"; resource: Text|Blob; _meta? }
            terminal → { type: "terminal"; terminalId; _meta? }
        - Remove ToolCallContentItem, ToolCallDiffItem, ToolCallTerminalItem
          type aliases (replaced by the union members above)

      New protocol types to add:
        - ProtocolVersion (number, uint16 0-65535)
        - RequestId (null | number | string)
        - StopReason ("completed" | "cancelled" | "max_tokens")
        - Implementation { name, version, title?, _meta? }
        - AuthMethod { id, name, description?, _meta? }
        - ClientCapabilities { fs?, terminal?, _meta? }
        - FileSystemCapability { readTextFile?, writeTextFile?, _meta? }
        - AgentCapabilities { loadSession?, mcpCapabilities?, promptCapabilities?, sessionCapabilities?, _meta? }
        - McpCapabilities { http?, sse?, _meta? }
        - PromptCapabilities { image?, audio?, embeddedContext?, _meta? }
        - SessionCapabilities { _meta? }
        - SessionMode { id, name, description?, _meta? }
        - SessionModeState { availableModes, currentModeId, _meta? }
        - McpServer union: McpServerStdio | McpServerHttp | McpServerSse
        - HttpHeader { name, value, _meta? }
        - EnvVariable { name, value, _meta? }
        - PermissionOption { optionId, kind, name, _meta? }
        - PermissionOptionKind ("allow_once" | "allow_always" | "reject_once" | "reject_always")
        - RequestPermissionOutcome union: Cancelled | Selected
        - TerminalExitStatus { exitCode?, signal?, _meta? }
        - AcpErrorCode enum (-32700, -32600, -32601, -32602, -32603, -32000, -32002)
        - AcpError { code, message, data? }
        - All request/response pairs:
          InitializeRequest / InitializeResponse
          AuthenticateRequest / AuthenticateResponse
          NewSessionRequest / NewSessionResponse
          LoadSessionRequest / LoadSessionResponse
          PromptRequest / PromptResponse
          SetSessionModeRequest / SetSessionModeResponse
          SetSessionConfigOptionRequest / SetSessionConfigOptionResponse
          CancelNotification
          RequestPermissionRequest / RequestPermissionResponse
          ReadTextFileRequest / ReadTextFileResponse
          WriteTextFileRequest / WriteTextFileResponse
          CreateTerminalRequest / CreateTerminalResponse
          TerminalOutputRequest / TerminalOutputResponse
          WaitForTerminalExitRequest / WaitForTerminalExitResponse
          KillTerminalCommandRequest / KillTerminalCommandResponse
          ReleaseTerminalRequest / ReleaseTerminalResponse
        - ExtMethodRequest, ExtNotification
    acceptanceCriteria:
      - All types exported from package index
      - Types match ACP schema at agentclientprotocol.com exactly
      - ToolKind is (read | write | execute | other) only
      - ToolCallStatus includes "cancelled"
      - ToolCallLocation uses "lineNumber" not "line"
      - ToolCallContent union is (text | diff | image | resource_link | resource | terminal)
      - Compile-check file validates structural compatibility for all new types
      - Every type extends AcpExtensible (_meta support)
      - All downstream code updated (jsonrpc.ts validators, stream-helpers.ts mappers, run-report.ts)
      - All existing tests updated and passing
      - npm run test passes
      - npm run lint passes
    startedAt: 2026-02-24T18:52:33.277Z
    completedAt: 2026-02-24T19:13:53.493Z
    updatedAt: 2026-02-24T19:13:53.493Z
  - id: US-002
    title: JSON-RPC 2.0 message framing and dispatch
    status: done
    dependsOn:
      - US-001
    description: |
      As a developer, I want a generic JSON-RPC 2.0 message layer that
      handles framing (newline-delimited JSON), request/response correlation,
      and method dispatch — independent of ACP semantics.

      This is the low-level transport: read lines from a readable stream,
      parse JSON-RPC messages, route requests to handlers, correlate
      responses to pending requests by id, and write serialized messages
      to a writable stream.

      RequestId per spec: null | number | string. Each side (client/agent)
      maintains its own incrementing ID space.
    acceptanceCriteria:
      - Parse incoming newline-delimited JSON-RPC 2.0 messages
      - Distinguish request (has method + id), response (has id, no method), notification (has method, no id)
      - Request/response correlation via RequestId (null | number | string)
      - Pending request tracking with configurable timeout
      - Method dispatch to registered handlers (request handlers, notification handlers)
      - Serialize outgoing messages with newline delimiter
      - Error response construction using AcpError types from US-001
      - Unit tests for framing, correlation, dispatch, timeouts, malformed input, all RequestId variants
      - npm run test passes
    startedAt: 2026-02-24T19:13:56.989Z
    completedAt: 2026-02-24T19:27:30.963Z
    updatedAt: 2026-02-24T19:27:30.963Z
  - id: US-003
    title: ACP stdio transport (AcpTransport)
    status: done
    dependsOn:
      - US-002
    description: |
      As a developer, I want an AcpTransport class that manages a
      subprocess (the agent) communicating over stdin/stdout using the
      JSON-RPC framing from US-002.

      AcpTransport owns the child process lifecycle: spawn, wire stdin/
      stdout to the JSON-RPC layer, capture stderr for diagnostics,
      handle process exit, and teardown.
    acceptanceCriteria:
      - AcpTransport wraps a ChildProcess with JSON-RPC framing
      - sendRequest(method, params) returns typed response (Promise)
      - sendNotification(method, params) for fire-and-forget
      - onRequest(method, handler) registers agent→client request handlers
      - onNotification(method, handler) registers notification handlers
      - Graceful shutdown on process exit or dispose
      - Pending requests reject on transport close
      - stderr captured for diagnostics (not part of protocol)
      - Unit tests with mocked child process streams
      - npm run test passes
    startedAt: 2026-02-24T19:27:31.429Z
    completedAt: 2026-02-24T19:43:43.229Z
    updatedAt: 2026-02-24T19:43:43.229Z
  - id: US-004
    title: Protocol lifecycle — initialize and authenticate
    status: done
    dependsOn:
      - US-003
    description: |
      As a developer, I want the AcpClient to drive the protocol
      lifecycle: send initialize with protocolVersion, clientInfo, and
      clientCapabilities, negotiate protocol version, then authenticate
      if the agent requires it.

      Protocol state machine:
        Uninitialized → [initialize] → Initialized → [authenticate?] → Ready
    acceptanceCriteria:
      - initialize() sends InitializeRequest with protocolVersion, clientInfo, clientCapabilities
      - Negotiates protocol version (min of client and agent versions)
      - Stores agentCapabilities, agentInfo, authMethods from response
      - authenticate(methodId) sends AuthenticateRequest
      - State machine enforced (no session before initialize, no skip auth when required)
      - Unit tests for happy path, version negotiation, auth required, auth not required, state violations
      - npm run test passes
    startedAt: 2026-02-24T19:43:43.377Z
    completedAt: 2026-02-24T19:49:37.407Z
    updatedAt: 2026-02-24T19:49:37.407Z
  - id: US-005
    title: Session management — new, load, cancel
    status: done
    dependsOn:
      - US-004
    description: |
      As a developer, I want AcpClient session lifecycle methods:
      newSession, loadSession, and cancelSession.

      newSession sends session/new with cwd (absolute path) and
      mcpServers array, returns sessionId + config + modes.
      loadSession resumes an existing session (requires agent's
      loadSession capability). cancelSession sends the session/cancel
      notification. Multiple concurrent sessions supported.
    acceptanceCriteria:
      - newSession(cwd, mcpServers) returns sessionId, configOptions, modes
      - loadSession(sessionId, cwd, mcpServers) returns configOptions, modes
      - loadSession checks agent's loadSession capability, throws if absent
      - McpServer types validated against agent's mcpCapabilities (http, sse gated)
      - cancelSession(sessionId) sends CancelNotification
      - Multiple concurrent sessions on one connection
      - Unit tests for each method, capability checks, error paths
      - npm run test passes
    startedAt: 2026-02-24T19:49:37.548Z
    completedAt: 2026-02-24T19:53:37.298Z
    updatedAt: 2026-02-24T19:53:37.298Z
  - id: US-006
    title: Prompt turn with streaming session updates
    status: done
    dependsOn:
      - US-005
    description: |
      As a developer, I want prompt(sessionId, content) that sends
      session/prompt, collects session/update notifications during
      processing, and returns the PromptResponse with stopReason.

      Content is ContentBlock[] — text and resource_link always supported,
      image/audio/embeddedContext gated by agent's promptCapabilities.

      Returns an async iterable of SessionUpdate notifications, compatible
      with existing v1 stream helpers.
    acceptanceCriteria:
      - prompt(sessionId, content) sends PromptRequest
      - Content validated against agent's promptCapabilities
      - Returns stopReason and updates as AsyncIterable of SessionUpdate
      - session/update notifications routed by sessionId
      - Iterable completes when PromptResponse arrives
      - Works with v1 helpers (extractMessages, extractUsage, extractToolCallSummaries)
      - Handles all StopReason values (completed, cancelled, max_tokens)
      - Unit tests with interleaved updates and response, multi-session routing
      - npm run test passes
    startedAt: 2026-02-24T19:53:37.433Z
    completedAt: 2026-02-24T20:01:25.531Z
    updatedAt: 2026-02-24T20:01:25.531Z
  - id: US-007
    title: Session configuration — set_mode, set_config_option
    status: done
    dependsOn:
      - US-005
    description: |
      As a developer, I want methods to change session mode and config
      options between prompt turns.

      Per spec, configuration is mutable between turns, immutable within.
      setConfigOption returns the full updated configOptions array because
      changing one option may affect others.
    acceptanceCriteria:
      - setMode(sessionId, modeId) sends SetSessionModeRequest
      - setConfigOption(sessionId, configId, value) sends SetSessionConfigOptionRequest
      - setConfigOption returns full updated configOptions array
      - Unit tests for both methods
      - npm run test passes
    startedAt: 2026-02-24T20:01:25.737Z
    completedAt: 2026-02-24T20:05:43.834Z
    updatedAt: 2026-02-24T20:05:43.834Z
  - id: US-008
    title: Client-side handler — permission requests
    status: done
    dependsOn:
      - US-003
    description: |
      As a developer, I want the client to handle incoming
      session/request_permission requests from the agent by delegating
      to a user-provided callback.

      RequestPermissionRequest contains toolCall (ToolCallUpdate) and
      options (PermissionOption[]). Each option has optionId, name,
      and kind (allow_once | allow_always | reject_once | reject_always).

      Response is RequestPermissionOutcome:
        { outcome: "cancelled" } or { outcome: "selected", optionId }
    acceptanceCriteria:
      - Accepts permissionHandler callback in client options
      - session/request_permission routed to callback
      - Callback receives toolCall and options, returns outcome
      - Response sent as RequestPermissionResponse
      - Default handler returns cancelled outcome if no callback provided
      - Unit tests for all PermissionOptionKind values and cancel and missing handler
      - npm run test passes
    startedAt: 2026-02-24T20:05:44.135Z
    completedAt: 2026-02-24T20:10:52.551Z
    updatedAt: 2026-02-24T20:10:52.551Z
  - id: US-009
    title: Client-side handler — filesystem operations
    status: done
    dependsOn:
      - US-003
    description: |
      As a developer, I want the client to handle incoming fs/read_text_file
      and fs/write_text_file requests by delegating to user-provided callbacks.

      Only registered when client advertises corresponding fs capability.
      Paths must be absolute. Line numbers are 1-based.
    acceptanceCriteria:
      - Accepts fsHandler with readTextFile and writeTextFile callbacks
      - fs/read_text_file receives (sessionId, path, line?, limit?) and returns content
      - fs/write_text_file receives (sessionId, path, content) and returns empty response
      - Absolute path validation (rejects relative with invalid_params -32602)
      - Line numbers are 1-based
      - Handlers only registered for advertised capabilities
      - method_not_found (-32601) if capability not advertised
      - Unit tests with memfs
      - npm run test passes
    startedAt: 2026-02-24T20:10:52.737Z
    completedAt: 2026-02-24T20:16:24.379Z
    updatedAt: 2026-02-24T20:16:24.379Z
  - id: US-010
    title: Client-side handler — terminal operations
    status: done
    dependsOn:
      - US-003
    description: |
      As a developer, I want the client to handle all five terminal
      methods by delegating to user-provided callbacks. Only registered
      when client advertises terminal capability.

      Methods: terminal/create, terminal/output, terminal/wait_for_exit,
      terminal/kill, terminal/release.

      CreateTerminalRequest includes optional args, cwd, env (EnvVariable[]),
      outputByteLimit. Output truncation preserves character boundaries.
      TerminalExitStatus { exitCode?, signal? }.
    acceptanceCriteria:
      - Accepts terminalHandler with create, output, waitForExit, kill, release callbacks
      - terminal/create receives (sessionId, command, args?, cwd?, env?, outputByteLimit?) and returns terminalId
      - terminal/output returns (output, truncated, exitStatus?)
      - terminal/wait_for_exit returns (exitCode?, signal?)
      - terminal/kill returns empty response
      - terminal/release returns empty response
      - Only registered when terminal capability advertised
      - method_not_found (-32601) if not advertised
      - resource_not_found (-32002) for unknown terminalId
      - Unit tests with mocked terminal handler for all 5 methods
      - npm run test passes
    startedAt: 2026-02-24T20:16:24.554Z
    completedAt: 2026-02-24T20:23:38.530Z
    updatedAt: 2026-02-24T20:23:38.530Z
  - id: US-011
    title: ACP error codes and structured error handling
    status: done
    dependsOn:
      - US-002
    description: |
      As a developer, I want ACP error codes and structured error types
      so both sides communicate errors per the ACP spec.

      Error codes: -32700 parse, -32600 invalid request, -32601 method
      not found, -32602 invalid params, -32603 internal, -32000 auth
      required, -32002 resource not found. Plus arbitrary int32 custom.
    acceptanceCriteria:
      - AcpError class extending Error with code, message, data
      - Named constants for all 7 standard error codes
      - Automatic AcpError wrapping in JSON-RPC error responses
      - AcpError parsing from incoming error responses
      - isAcpError type guard
      - Unit tests for each error code, serialization, deserialization, custom codes
      - npm run test passes
    startedAt: 2026-02-24T20:23:38.733Z
    completedAt: 2026-02-24T20:33:11.728Z
    updatedAt: 2026-02-24T20:33:11.728Z
