  - id: US-013
    title: High-level AcpClient facade
    status: done
    dependsOn:
      - US-004
      - US-005
      - US-006
      - US-007
      - US-008
      - US-009
      - US-010
      - US-011
      - US-012
    description: |
      As a developer, I want a single AcpClient class composing transport,
      lifecycle, session, handlers, and extensions into a clean public API.

      Usage:
        const client = new AcpClient({ command, args, handlers });
        await client.initialize({ fs: { readTextFile: true } });
        const session = await client.newSession({ cwd });
        for await (const update of client.prompt(session.id, content)) { ... }
        await client.dispose();
    acceptanceCriteria:
      - Constructor accepts command, args, env, handler callbacks (permission, fs, terminal)
      - Spawns agent subprocess on construction
      - All protocol methods as typed async methods
      - Client handlers wired automatically based on advertised capabilities
      - Agent capabilities accessible after initialize
      - dispose() gracefully shuts down transport and kills subprocess
      - Re-exports all v1 utilities (stream helpers, run report, format/parse)
      - Integration test with mock agent subprocess exercising full lifecycle
      - npm run test passes
      - npm run lint passes
    startedAt: 2026-02-25T01:54:58.931Z
    completedAt: 2026-02-25T02:02:43.959Z
    updatedAt: 2026-02-25T02:02:43.959Z
