version: 1
project: poe-agent-mcp
overview: |
  Integrate tiny-mcp-client into poe-agent so the agent can discover and call
  MCP tools alongside its 5 built-in tools (read_file, edit_file, list_files,
  run_command, search_web). MCP tool names are namespaced as
  mcp__<server>__<tool> to avoid collisions.

  The integration adds: type definitions, pure conversion functions,
  McpToolExecutor class, agent-session wiring, in-process integration tests
  (scripted fetch + memfs + createTestPair), and a comprehensive HTTP proxy
  infrastructure in e2e-docker-test-runner for snapshot-based e2e testing.

  The HTTP proxy is the most important piece of the e2e story. It integrates
  into the useContainer lifecycle via a snapshotDir option — when provided,
  the proxy starts automatically, POE_BASE_URL is set on the container, and
  container.requests() / container.writeSnapshots() become available. Three
  modes: playback (deterministic replay from snapshots), record (forward +
  save), passthrough (forward only). All traffic is captured as JSONL.

  Custom vitest matchers (toHaveRequestBody, toHaveResponseBody,
  toContainRequest, toHaveToolInRequest, toHaveToolCall, toHaveToolResult)
  provide rich failure messages with full exchange context for debugging.
  A CapturedRequests exploration class wraps the raw JSONL with filtering,
  indexing, and structured data extraction methods.

  Architecture:
    Agent → http://localhost:3456/v1/chat/completions → proxy → [snapshot or upstream API]
                                                          |
                                                          └→ /tmp/proxy-capture.jsonl

goals:
  - Integrate tiny-mcp-client into poe-agent with MCP tool namespacing
  - Full TDD for all new code (~64 test cases total)
  - HTTP proxy infrastructure in e2e-docker-test-runner for deterministic e2e tests
  - Proxy integrated into useContainer lifecycle (convention over configuration)
  - Custom vitest matchers with rich failure messages for proxy assertions
  - CapturedRequests exploration API for debugging e2e tests
  - Docker e2e test validating full MCP integration end-to-end

nonGoals:
  - HTTP transport for MCP (stdio only in e2e, HTTP is supported but not tested e2e)
  - Dynamic tool refresh (tools/list_changed notification handling)
  - MCP resource or prompt support in poe-agent
  - Proxy authentication or TLS
  - Proxy WebSocket support

qualityGates:
  - npm run test
  - npm run lint

requirements:
  - id: R-001
    title: MCP tool name namespacing
    description: |
      MCP tools SHALL be namespaced as mcp__<serverName>__<toolName> to avoid
      collisions with built-in tools and tools from other MCP servers.
    scenarios:
      - name: Basic namespacing
        when: namespaceMcpToolName("my-server", "my-tool") is called
        then: Returns "mcp__my-server__my-tool"
      - name: Special characters preserved
        when: namespaceMcpToolName("server", "my-tool_v2.0") is called
        then: Returns "mcp__server__my-tool_v2.0"

  - id: R-002
    title: MCP tool to OpenAI format conversion
    description: |
      MCP tool definitions SHALL be converted to OpenAI function-calling format
      with namespaced names, preserving description, properties, and required fields.
    scenarios:
      - name: Full conversion with all fields
        when: mcpToolToOpenAiTool is called with server "s", tool { name, description, inputSchema with properties and required }
        then: Returns { type "function", function { name "mcp__s__<tool>", description, parameters { type "object", properties, required } } }
      - name: Missing description defaults to empty string
        when: MCP tool has no description field
        then: Converted tool has description ""
      - name: Missing properties defaults to empty object
        when: MCP tool inputSchema has no properties
        then: Converted tool has parameters.properties = {}
      - name: Missing required omitted
        when: MCP tool inputSchema has no required array
        then: Converted tool parameters has no required field

  - id: R-003
    title: callTool result to string conversion
    description: |
      MCP callTool results SHALL be converted to plain strings suitable for
      inclusion in OpenAI tool result messages.
    scenarios:
      - name: Single TextContent
        when: Result has content [{ type "text", text "hello" }]
        then: Returns "hello"
      - name: Single ImageContent
        when: Result has content [{ type "image", mimeType "image/png", data "..." }]
        then: 'Returns "[image: image/png]"'
      - name: Single AudioContent
        when: Result has content [{ type "audio", mimeType "audio/wav", data "..." }]
        then: 'Returns "[audio: audio/wav]"'
      - name: EmbeddedResource with text
        when: 'Result has content [{ type "resource", resource { uri "file:///x", text "content" } }]'
        then: 'Returns "content"'
      - name: EmbeddedResource with blob
        when: 'Result has content [{ type "resource", resource { uri "file:///x", blob "base64..." } }]'
        then: 'Returns "[blob: file:///x]"'
      - name: Multiple items joined with newline
        when: Result has content [{ type "text", text "line1" }, { type "text", text "line2" }]
        then: Returns "line1\nline2"
      - name: Mixed content types
        when: Result has content [{ type "text", text "some text" }, { type "image", mimeType "image/jpeg", data "..." }]
        then: 'Returns "some text\n[image: image/jpeg]"'
      - name: Empty content array
        when: Result has content []
        then: Returns ""
      - name: Error result throws
        when: Result has content [{ type "text", text "something broke" }] and isError true
        then: Throws Error with message "something broke"

  - id: R-004
    title: McpToolExecutor tool discovery
    description: |
      McpToolExecutor SHALL discover tools from connected MCP clients via
      listTools, handling pagination, and expose them in OpenAI format.
    scenarios:
      - name: Discover tools from single server
        when: addServer("test-server", client) is called on a server with caesar_cipher_encrypt and word_of_the_day
        then: getAvailableTools returns tools namespaced as mcp__test-server__caesar_cipher_encrypt and mcp__test-server__word_of_the_day
      - name: Server with zero tools
        when: addServer called on a server that returns { tools [] }
        then: getAvailableTools returns empty array for that server, no error
      - name: Paginated tool list
        when: Server returns { tools [tool1], nextCursor "page2" } then { tools [tool2] }
        then: Both tools are discovered
      - name: Duplicate tool names across servers
        when: Two servers both expose "encrypt"
        then: Namespaced as mcp__server-a__encrypt and mcp__server-b__encrypt, no collision
      - name: Multiple servers combined
        when: addServer("a", ...) then addServer("b", ...)
        then: getAvailableTools returns tools from both servers

  - id: R-005
    title: McpToolExecutor tool execution
    description: |
      McpToolExecutor SHALL route tool calls to the correct MCP client using the
      namespaced tool name, convert the result to string, and throw for unknown tools.
    scenarios:
      - name: Execute known tool
        when: executeTool("mcp__test-server__caesar_cipher_encrypt", { text "hello", shift 3 }) called
        then: Returns "khoor" (or the actual cipher result)
      - name: Execute word_of_the_day
        when: executeTool("mcp__test-server__word_of_the_day", {}) called
        then: Returns string containing "Bumfuzzle"
      - name: Unknown tool throws
        when: executeTool("unknown_tool", {}) called
        then: 'Throws Error "MCP tool not found: unknown_tool"'
      - name: Tool with special characters
        when: Tool named "my-tool_v2.0" is registered and executeTool("mcp__server__my-tool_v2.0", {}) called
        then: Correctly routes to the right client and original tool name
      - name: MCP tool returns error
        when: MCP callTool returns { content [...], isError true }
        then: executeTool throws Error with the text from the error content
      - name: MCP tool returns multiple content items
        when: MCP callTool returns { content [text1, text2] }
        then: executeTool returns "text1\ntext2"
      - name: MCP tool returns image content
        when: MCP callTool returns { content [{ type "image", mimeType "image/png" }] }
        then: 'executeTool returns "[image: image/png]"'
      - name: Empty result
        when: MCP callTool returns { content [] }
        then: executeTool returns ""
      - name: Interleaved calls to different servers
        when: executeTool("mcp__a__tool1") then executeTool("mcp__b__tool2")
        then: Both succeed, each routes to correct client

  - id: R-006
    title: McpToolExecutor lifecycle
    description: |
      McpToolExecutor SHALL properly manage client lifecycle including disposal.
    scenarios:
      - name: Dispose closes all clients
        when: dispose() called with 2 connected clients
        then: Both clients are closed (client.state === "closed")
      - name: Dispose with failing client
        when: dispose() called and one client throws during close
        then: Other client is still closed (Promise.allSettled)
      - name: Calling disposed executor
        when: executeTool called after dispose()
        then: Throws or underlying client is closed

  - id: R-007
    title: Agent session MCP wiring
    description: |
      createAgentSession SHALL accept mcpServers option, create McpToolExecutor,
      merge tool lists, create a routing ToolExecutor, and manage MCP lifecycle.
    scenarios:
      - name: No mcpServers — unchanged behavior
        when: createAgentSession called without mcpServers
        then: Behavior identical to current (only built-in tools)
      - name: With mcpServers — tools merged
        when: createAgentSession called with mcpServers config
        then: McpToolExecutor created, tools merged with built-in tools
      - name: Routing dispatches correctly
        when: LLM calls built-in tool "read_file" and MCP tool "mcp__s__t"
        then: read_file goes to DefaultToolExecutor, mcp__s__t goes to McpToolExecutor
      - name: dispose closes MCP
        when: session.dispose() called
        then: McpToolExecutor.dispose() is called
      - name: MCP connect failure cleanup
        when: Second MCP server fails to connect
        then: Already-connected servers are cleaned up before throwing

  - id: R-008
    title: MCP type exports
    description: |
      poe-agent SHALL export McpServerDefinition, McpStdioServerDefinition, and
      McpHttpServerDefinition types from its public API.
    scenarios:
      - name: Types importable
        when: Consumer imports { McpServerDefinition } from "@poe-code/poe-agent"
        then: Type is available

  - id: R-009
    title: Integration test — built-in file tools on memfs
    description: |
      In-process integration tests SHALL validate the full agent session loop
      using scripted fetch mock + memfs for built-in file operations.
    scenarios:
      - name: read_file returns file content to LLM
        when: LLM calls read_file("hello.txt") and memfs has that file
        then: Tool result message contains file content, LLM gets it in next request
      - name: edit_file creates file then read_file reads it back
        when: LLM calls edit_file(create) then read_file
        then: File exists in memfs, read returns created content
      - name: list_files shows directory contents
        when: LLM calls list_files(".") on memfs with a.txt, b.txt, sub/c.txt
        then: Tool result contains a.txt, b.txt, sub
      - name: edit_file str_replace modifies file
        when: LLM calls edit_file(str_replace) on existing file
        then: File content updated in memfs

  - id: R-010
    title: Integration test — MCP tools with scripted fetch
    description: |
      In-process integration tests SHALL validate MCP tool execution using
      createTestPair + createTestServer alongside scripted fetch.
    scenarios:
      - name: MCP tool only session
        when: LLM calls mcp__test-server__caesar_cipher_encrypt with scripted fetch
        then: Result fed back to LLM, final answer contains encrypted text
      - name: Built-in + MCP tools together
        when: LLM first calls read_file (memfs), then MCP tool
        then: Both tool results fed back, merged tool list in first API request
      - name: MCP tool schema in API request
        when: First fetch call is inspected
        then: Tool definition for mcp__test-server__caesar_cipher_encrypt includes correct properties and required
      - name: Unknown tool error propagation
        when: LLM calls "nonexistent_tool"
        then: Error message fed back as tool result message containing "Error"
      - name: MCP tool returns isError
        when: MCP tool returns error result
        then: 'Error fed back to LLM as "Error: ..." tool message, LLM recovers'
      - name: Parallel tool_calls in single response
        when: LLM response has tool_calls [read_file, mcp__test-server__word_of_the_day]
        then: Both executed, both results appear in next request messages
      - name: dispose closes MCP clients
        when: session.dispose() called after MCP session
        then: MCP client is in closed state
      - name: Session rejects after dispose
        when: session.sendMessage() called after dispose
        then: Throws "Agent session is already disposed."

  - id: R-011
    title: Proxy types
    description: |
      The proxy SHALL define ProxyRoute, ProxyConfig, and CapturedExchange types.
    scenarios:
      - name: ProxyRoute has required fields
        when: ProxyRoute is instantiated
        then: Has path (string), target (string), mode ("playback"|"passthrough"|"record"), optional snapshotDir
      - name: CapturedExchange has required fields
        when: CapturedExchange is parsed from JSONL
        then: Has timestamp, route, request { method, path, headers, body }, response { status, body }

  - id: R-012
    title: Proxy server — passthrough mode
    description: |
      In passthrough mode the proxy SHALL forward requests to the target URL
      and return the upstream response, capturing all traffic as JSONL.
    scenarios:
      - name: Forwards request to upstream
        when: POST /v1/chat/completions sent to proxy in passthrough mode
        then: Upstream dummy API receives the request and proxy returns its response
      - name: Preserves request headers
        when: Request includes Authorization and Content-Type headers
        then: Upstream receives those headers
      - name: Captures exchange in JSONL
        when: Request completes
        then: Capture file has one JSONL line with correct request body, response body, path, timestamp
      - name: No route match returns 502
        when: Request path does not match any route
        then: Returns 502 with body { error "No matching proxy route for <path>" }

  - id: R-013
    title: Proxy server — record mode
    description: |
      In record mode the proxy SHALL forward to upstream, save the response as
      a snapshot file, and capture the exchange.
    scenarios:
      - name: Forwards to upstream and saves snapshot
        when: POST /v1/chat/completions sent in record mode
        then: Upstream receives request, response saved as snapshot file
      - name: Snapshot file name matches generated key
        when: Snapshot is saved
        then: File name is <key>.json where key = SHA256({ model, messages }) truncated
      - name: Snapshot file contains request and response
        when: Snapshot file is read
        then: Contains { key, request, response, metadata { recordedAt } }
      - name: Idempotent recording
        when: Same request body sent twice
        then: Same snapshot file is overwritten (same key)

  - id: R-014
    title: Proxy server — playback mode
    description: |
      In playback mode the proxy SHALL serve responses from snapshot files
      without contacting the upstream API.
    scenarios:
      - name: Returns snapshot response
        when: Snapshot exists for the request body key
        then: Returns snapshot response without contacting upstream
      - name: Missing snapshot returns 404
        when: No snapshot exists for the computed key
        then: Returns 404 with body { error "Snapshot not found for key <key>" }
      - name: Still captures exchange in JSONL
        when: Playback response is served
        then: Capture file has the exchange logged
      - name: Key generation is deterministic
        when: Same { model, messages } sent twice
        then: Same key is computed both times

  - id: R-015
    title: Proxy capture file format
    description: |
      The proxy SHALL write one JSONL line per exchange with parsed JSON bodies.
    scenarios:
      - name: Multiple requests produce multiple lines
        when: 3 requests are sent through proxy
        then: Capture file has 3 JSONL lines
      - name: Each line is valid CapturedExchange JSON
        when: JSONL line is parsed
        then: Conforms to CapturedExchange interface
      - name: Timestamp is ISO 8601
        when: Exchange is captured
        then: timestamp field is ISO 8601 format
      - name: Request body is parsed JSON
        when: Exchange is read
        then: request.body is the parsed JSON object, not raw string
      - name: Response body is parsed JSON
        when: Exchange is read
        then: response.body is the parsed JSON object from upstream/snapshot

  - id: R-016
    title: Proxy route matching
    description: |
      The proxy SHALL match routes by path prefix, first match wins.
    scenarios:
      - name: First matching route wins
        when: Two routes overlap and request matches both
        then: First route in array is used
      - name: Prefix match
        when: Route path "/v1/chat" and request path "/v1/chat/completions"
        then: Route matches
      - name: Non-matching path
        when: Route path "/v1/chat/completions" and request path "/v1/models"
        then: Route does not match

  - id: R-017
    title: Proxy CLI entry point
    description: |
      A proxy-server CLI binary SHALL accept configuration via flags or JSON config file
      for use inside Docker containers.
    scenarios:
      - name: Start with inline flags
        when: "proxy-server --port 3456 --capture /tmp/capture.jsonl --route '/v1/chat/completions=playback:/tmp/snapshots'"
        then: Proxy starts on port 3456 with specified route
      - name: Start with config file
        when: proxy-server --config /tmp/proxy-config.json
        then: Proxy starts with config from file

  - id: R-018
    title: useContainer proxy integration
    description: |
      When snapshotDir is provided to useContainer, the proxy SHALL start
      automatically, POE_BASE_URL SHALL be set on the container, and
      container.requests() and container.writeSnapshots() SHALL be available.
    scenarios:
      - name: snapshotDir triggers proxy
        when: useContainer({ snapshotDir "e2e/fixtures/test" }) is called
        then: 'Proxy starts in container, POE_BASE_URL=http://localhost:3456 set'
      - name: No snapshotDir — no proxy
        when: useContainer({}) called without snapshotDir
        then: No proxy, no POE_BASE_URL override, existing behavior unchanged
      - name: Snapshot files copied into container
        when: snapshotDir has .json files on host
        then: Files copied to /tmp/proxy-snapshots/ in container
      - name: container.requests() returns CapturedRequests
        when: After test execution with snapshotDir
        then: container.requests() returns CapturedRequests wrapping /tmp/proxy-capture.jsonl
      - name: container.requests() without snapshotDir throws
        when: requests() called without snapshotDir configured
        then: Throws "requests() requires snapshotDir in useContainer options"
      - name: container.writeSnapshots() writes files
        when: writeSnapshots([{ key, response }]) called
        then: Snapshot files written to /tmp/proxy-snapshots/ in container
      - name: POE_BASE_URL flows through configure
        when: Container has POE_BASE_URL set and poe-code configure is run
        then: Agent config files point at proxy URL automatically

  - id: R-019
    title: CapturedRequests exploration API
    description: |
      CapturedRequests class SHALL provide methods to access, filter, and
      extract structured data from captured exchanges, with helpful error
      messages on out-of-bounds access.
    scenarios:
      - name: length property
        when: 3 exchanges captured
        then: requests.length === 3
      - name: at(index) returns exchange
        when: requests.at(0) called
        then: Returns first CapturedExchange
      - name: at(index) out of bounds throws with summary
        when: requests.at(2) called but only 1 exchange captured
        then: |
          Throws "No captured request at index 2. Only 1 request(s) captured:\n  [0] POST /v1/chat/completions → 200 ..."
      - name: all() returns array copy
        when: requests.all() called
        then: Returns copy of exchanges array
      - name: forRoute filters by path prefix
        when: requests.forRoute("/v1/chat/completions") called
        then: Returns new CapturedRequests with only matching exchanges
      - name: withToolCalls filters to tool_call responses
        when: requests.withToolCalls() called
        then: Returns only exchanges where response had tool_calls
      - name: withToolResults filters to tool result requests
        when: requests.withToolResults() called
        then: Returns only exchanges where request messages include role "tool"
      - name: toolNamesAt extracts tool names from request
        when: requests.toolNamesAt(0) called
        then: Returns array of tool function names from request body tools array
      - name: toolCallsAt extracts tool_calls from response
        when: requests.toolCallsAt(0) called
        then: Returns array of { name, arguments } from response tool_calls
      - name: messagesAt extracts messages from request
        when: requests.messagesAt(1) called
        then: Returns messages array from request body
      - name: toolResultAt finds tool result message
        when: requests.toolResultAt(1, "read_file") called
        then: Returns { content, tool_call_id } for matching tool message
      - name: toolResultAt returns undefined for missing tool
        when: requests.toolResultAt(1, "nonexistent") called
        then: Returns undefined
      - name: summary returns human-readable table
        when: requests.summary() called with 2 exchanges
        then: Returns multi-line string with index, method, path, status, model, messages count, tools count
      - name: debugAt returns full JSON
        when: requests.debugAt(0) called
        then: Returns JSON.stringify of the exchange with 2-space indent

  - id: R-020
    title: Proxy vitest matchers — toHaveRequestBody
    description: |
      toHaveRequestBody SHALL perform partial deep match on exchange request body
      with rich failure message showing diff and full exchange context.
    scenarios:
      - name: Passes on match
        when: Exchange has request body { model "test", messages [...] } and expected { model "test" }
        then: Assertion passes
      - name: Fails on mismatch with diff and context
        when: Exchange has model "Claude-Haiku-4.5" but expected "Claude-Sonnet-4.5"
        then: |
          Failure shows: "expected request body to match\n\nDiff:\n- Expected\n+ Received\n  Object {\n-   \"model\": \"Claude-Sonnet-4.5\",\n+   \"model\": \"Claude-Haiku-4.5\",\n  }\n\nFull exchange:\n  Route: /v1/chat/completions\n  POST /v1/chat/completions → 200\n  ..."

  - id: R-021
    title: Proxy vitest matchers — toHaveResponseBody
    description: |
      toHaveResponseBody SHALL perform partial deep match on exchange response body
      with rich failure message.
    scenarios:
      - name: Passes on match
        when: Response body matches expected partial
        then: Assertion passes
      - name: Fails with diff and context
        when: Response body does not match
        then: Failure shows diff and formatExchangeContext output

  - id: R-022
    title: Proxy vitest matchers — toContainRequest
    description: |
      toContainRequest SHALL find at least one exchange matching path, method,
      and/or bodyContaining criteria.
    scenarios:
      - name: Passes when match found
        when: Exchanges include one matching { path "/v1/chat/completions", method "POST" }
        then: Assertion passes
      - name: Fails with summary of all exchanges
        when: No exchange matches criteria
        then: |
          Failure shows: "expected at least one exchange matching {path: \"/v1/chat/completions\", body containing: {\"model\":\"Claude-Sonnet-4.5\"}}, but none found\n\nAll captured exchanges (2):\n  [0] POST /v1/chat/completions → 200 (model: Claude-Haiku-4.5, tools: 7)\n  [1] POST /v1/chat/completions → 200 (model: Claude-Haiku-4.5, tools: 7)"

  - id: R-023
    title: Proxy vitest matchers — toHaveToolInRequest
    description: |
      toHaveToolInRequest SHALL check that a request's tools array contains a
      tool with the given name.
    scenarios:
      - name: Passes when tool present
        when: Request tools include "mcp__test-server__word_of_the_day"
        then: Assertion passes
      - name: Fails with tool list and context
        when: Expected tool not in request
        then: |
          Failure shows: "expected request to contain tool \"mcp__test-server__word_of_the_day\"\n  Tools present: [read_file, edit_file, list_files, run_command, search_web]\n  Route: ..."

  - id: R-024
    title: Proxy vitest matchers — toHaveToolCall
    description: |
      toHaveToolCall SHALL check that a response contains a tool_call for the
      given tool name.
    scenarios:
      - name: Passes when tool_call present
        when: Response has tool_call for "mcp__test-server__word_of_the_day"
        then: Assertion passes
      - name: Fails with tool_call list and context
        when: Expected tool_call not in response
        then: |
          Failure shows: "expected response to have tool_call \"mcp__test-server__word_of_the_day\"\n  tool_calls present: [read_file]\n  Route: ..."

  - id: R-025
    title: Proxy vitest matchers — toHaveToolResult
    description: |
      toHaveToolResult SHALL check that a request's messages contain a tool result
      for the given tool name, optionally matching content.
    scenarios:
      - name: Passes when tool result present
        when: Request messages include role "tool" with name "mcp__test-server__word_of_the_day"
        then: Assertion passes
      - name: Passes with content string match
        when: Tool result content includes "Bumfuzzle"
        then: Assertion passes
      - name: Passes with content regex match
        when: Tool result content matches /bumfuzzle/i
        then: Assertion passes
      - name: Fails — tool name not found
        when: No tool message with expected name
        then: |
          Failure shows: "expected request to have tool result for \"mcp__test-server__word_of_the_day\", but no tool message with that name found\n\nTool messages in request:\n  - read_file: \"Hello from the file!\"\n\nFull exchange:\n  ..."
      - name: Fails — content mismatch
        when: Tool message exists but content does not match
        then: |
          Failure shows: "expected tool result for \"tool\" to match <matcher>\n  Actual content: \"actual content\"\n\nFull exchange:\n  ..."

  - id: R-026
    title: formatExchangeContext helper
    description: |
      formatExchangeContext SHALL produce a human-readable debug string from a
      CapturedExchange for use in assertion failure messages.
    scenarios:
      - name: Includes all key fields
        when: Exchange has route, method, path, status, model, messages, tools, tool_calls, content
        then: Output includes Route, method+path+status, Timestamp, model, message count with role previews, tool names, tool_calls, content preview
      - name: Content truncated at 100 chars
        when: Response content is longer than 100 characters
        then: Content preview is truncated with "..."
      - name: Message content truncated at 60 chars
        when: Message content is longer than 60 characters
        then: Message preview truncated with "..."

  - id: R-027
    title: Docker e2e test for poe-agent + MCP
    description: |
      A Docker e2e test SHALL validate the full MCP integration: agent discovers
      MCP tools, sends them to LLM, calls the tool, returns result.
    scenarios:
      - name: Full MCP e2e flow
        when: poe-code spawn with --mcp-config for test-server and prompt "What is the word of the day?"
        then: Exit code 0, stdout contains "bumfuzzle"
      - name: MCP tools in API request
        when: Proxy captures are examined
        then: First request includes mcp__test-server__word_of_the_day and mcp__test-server__caesar_cipher_encrypt in tools
      - name: Built-in tools also present
        when: Proxy captures are examined
        then: First request includes read_file in tools
      - name: Tool result fed back to LLM
        when: Second request is examined
