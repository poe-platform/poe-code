    acceptanceCriteria:
      - Computes key from request body, loads <snapshotDir>/<key>.json
      - Returns snapshot response without contacting upstream
      - Returns 404 { error "Snapshot not found for key <key>" } when missing
      - Still captures exchange in JSONL
      - Test — returns snapshot without upstream (dummy API not started)
      - Test — returns 404 with descriptive error on missing snapshot
      - Test — captures exchange even in playback
      - 'Test — deterministic key: same { model, messages } → same key'

