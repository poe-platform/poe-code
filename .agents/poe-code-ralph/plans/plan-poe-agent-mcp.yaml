      - 'Error message format: "No captured request at index N. Only M request(s) captured:\n  [0] POST ..."'
      - all() returns copy of exchanges array
      - forRoute(path) filters by path prefix, returns new CapturedRequests
      - withToolCalls() filters to exchanges where response has tool_calls
      - withToolResults() filters to exchanges where request has role "tool" messages
      - toolNamesAt(index) extracts tool function names from request tools array
      - toolCallsAt(index) extracts { name, arguments } from response tool_calls
      - messagesAt(index) extracts messages array from request body
      - toolResultAt(index, toolName) returns { content, tool_call_id } or undefined
      - summary() returns human-readable multi-line string with index, method, path, status, model, counts
      - debugAt(index) returns JSON.stringify with 2-space indent
      - Tests for every method and edge case (14+ tests)

