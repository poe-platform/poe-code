      - ProxyConfig has port, routes, captureFile
      - CapturedExchange has timestamp, route, request { method, path, headers, body }, response { status, body }
      - Types exported from the file

  # ── Step 7b: Proxy server ─────────────────────────────────────────────
  - id: US-027
    title: Implement proxy server passthrough mode with tests
    status: open
    dependsOn:
      - US-026
    description: |
      As a developer, I want the proxy server to forward requests to the target
      URL in passthrough mode and capture exchanges as JSONL.
    acceptanceCriteria:
      - node:http server (~120 lines) that matches routes by path prefix
      - Forwards request to route.target with original headers
      - Returns upstream response
      - Appends CapturedExchange to captureFile as JSONL line
      - Test with dummy upstream API — forwards correctly
      - Test — captures exchange with correct request body, response body, path, timestamp
      - Test — preserves Authorization and Content-Type headers
      - Test — returns 502 { error "No matching proxy route for <path>" } on no match

  - id: US-028
    title: Implement proxy server record mode with tests
    status: open
    dependsOn:
      - US-027
    description: |
      As a developer, I want the proxy server to forward to upstream AND save
      the response as a snapshot file in record mode.
    acceptanceCriteria:
      - Forwards to target, saves response as <snapshotDir>/<key>.json
      - Key generated via SHA256({ model, messages }) (reuse generateSnapshotKey algorithm)
      - Snapshot file contains { key, request, response, metadata { recordedAt } }
      - Test — forwards and saves snapshot
      - Test — snapshot file name matches generated key
      - Test — snapshot file contains request and response
      - Test — idempotent recording (same body → same key → overwrite)

  - id: US-029
    title: Implement proxy server playback mode with tests
    status: open
    dependsOn:
