  # ── Step 7e: CapturedRequests exploration API ─────────────────────────
  - id: US-036
    title: Implement CapturedRequests class with tests
    status: open
    dependsOn:
      - US-026
    description: |
      As a developer, I want a CapturedRequests wrapper class that provides
      methods to access, filter, and extract structured data from captured exchanges.
    acceptanceCriteria:
      - length property returns exchange count
      - at(index) returns CapturedExchange at index
