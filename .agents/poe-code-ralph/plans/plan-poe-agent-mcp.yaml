      - Fails — tool name not found — shows all tool messages and formatExchangeContext
      - Fails — content mismatch — shows actual content and formatExchangeContext
      - 'Failure message for missing tool: "expected request to have tool result for \"X\", but no tool message with that name found\n\nTool messages in request:\n  - read_file: \"content preview...\"\n\nFull exchange:\n  ..."'
      - 'Failure message for content mismatch: "expected tool result for \"X\" to match <matcher>\n  Actual content: \"actual\"\n\nFull exchange:\n  ..."'
      - Tool message content preview truncated at 80 chars
      - Type declaration added to vitest Assertion interface

