version: 1
project: poe-agent-restoration
overview: |
  Restore the Poe agent runtime as a standalone package @poe-code/poe-agent
  and build a companion @poe-code/poe-acp-client package for ACP stream
  normalization and run reporting.

  The original runtime was removed in commits cae64be and 3e97549.
  The recoverable baseline is 3e97549^. This restoration is deliberately
  scoped down from the original: no MCP, no worktrees, no async tasks,
  no interactive flows, no model strategy.

  The agent uses the Poe API for chat completions, provides built-in file
  and command tools, emits ACP-compliant session updates, and resolves
  its API key through @poe-code/auth.

  The system prompt is recovered from git history and bundled with the package.

  Entry point is `poe-code agent <prompt>`. The agent also integrates
  into the provider auto-discovery system for the spawn path.

  Execution order: poe-agent first, then poe-acp-client.
goals:
  - Restore a synchronous, ACP-compliant Poe agent runtime as @poe-code/poe-agent
  - Build a reusable ACP client/reporting package as @poe-code/poe-acp-client
  - Provide `poe-code agent <prompt>` CLI command as the primary entry point
  - Integrate through existing provider auto-discovery for spawn path
  - Use @poe-code/auth for API key resolution
  - Use @poe-code/agent-spawn ACP types as the event vocabulary
  - Full test coverage (TDD) for all new code
nonGoals:
  - MCP support (deferred)
  - Worktree spawning and agent registry (deferred)
  - Async/background task runtime (agent-task-registry, task-runner)
  - Interactive configure-agents UI
  - Model strategy system
  - Rolling out ACP to other existing agents/providers
qualityGates:
  - npm run test
  - npm run lint
