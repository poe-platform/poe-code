version: 1
project: tiny-mcp-client

overview: |
  Build a fully MCP-spec-compliant client package (protocol version 2025-03-26) at
  packages/tiny-mcp-client/. The client supports all MCP features: tools, resources,
  prompts, completions, logging, roots, sampling, cancellation, progress, and ping.
  Transports: stdio (child process) and Streamable HTTP (POST + SSE).

  Zero runtime dependencies — only Node.js built-ins. Test servers are created via
  @modelcontextprotocol/sdk (devDependency) so we can cross-check spec compliance
  end-to-end.

  Architecture: McpClient → JsonRpcMessageLayer → McpTransport (stdio | http).
  The JSON-RPC layer is adapted from poe-acp-client/src/jsonrpc-message-layer.ts.
  The transport interface is { readable, writable, closed, dispose() }.

goals:
  - "100% MCP spec compliance for protocol version 2025-03-26"
  - "Zero runtime dependencies"
  - "Full TDD — every feature has tests before or alongside implementation"
  - "Cross-validated against MCP SDK servers (not just our own tiny server)"
  - "Support stdio and Streamable HTTP transports"
  - "Clean, minimal API surface"

nonGoals:
  - "Backwards compatibility with 2024-11-05 HTTP+SSE transport"
  - "Elicitation support (added in 2025-06-18, not in 2025-03-26)"
  - "Custom transport plugins — users compose their own via McpTransport interface"
  - "CLI binary — this is a library package only"

qualityGates:
  - npm run test
  - npm run lint
  - npm run lint:types

requirements:
  - id: R-001
    title: JSON-RPC 2.0 message parsing
    description: >
      The client SHALL parse JSON-RPC 2.0 request, response, and notification messages
      from newline-delimited UTF-8 streams per the JSON-RPC 2.0 specification.
    scenarios:
      - name: Parse valid request
        when: 'A line contains {"jsonrpc":"2.0","id":1,"method":"ping"}'
        then: Parsed as request with id=1, method="ping"
      - name: Parse valid notification
        when: 'A line contains {"jsonrpc":"2.0","method":"notifications/initialized"}'
        then: Parsed as notification (no id)
      - name: Parse valid success response
        when: 'A line contains {"jsonrpc":"2.0","id":1,"result":{"tools":[]}}'
        then: Parsed as success response with id=1
      - name: Parse valid error response
        when: 'A line contains {"jsonrpc":"2.0","id":1,"error":{"code":-32601,"message":"Method not found"}}'
        then: Parsed as error response
      - name: Reject malformed JSON
        when: A line contains invalid JSON
        then: Returns parse error (-32700)
      - name: Reject non-object payload
        when: A line contains a JSON array or primitive
        then: Returns invalid request error (-32600)

  - id: R-002
    title: JSON-RPC request/response correlation
    description: >
      The client SHALL correlate outgoing requests with incoming responses using
      auto-incrementing integer IDs. IDs MUST NOT be null per MCP spec.
    scenarios:
      - name: Auto-increment IDs
        when: Two requests are sent sequentially
        then: First gets id=1, second gets id=2
      - name: Correlate response to request
        when: Response with id=1 arrives
        then: The promise for request id=1 resolves with the result
      - name: Reject on error response
        when: Error response with id=1 arrives
        then: The promise for request id=1 rejects with McpError

  - id: R-003
    title: JSON-RPC request timeouts
    description: >
      The client SHALL reject pending requests after a configurable timeout.
    scenarios:
      - name: Default timeout
        when: No response arrives within default timeout (30s)
        then: The request promise rejects with timeout error
      - name: Custom timeout
        when: Request sent with custom timeoutMs and no response arrives
        then: Rejects after the custom timeout

  - id: R-004
    title: MCP initialize handshake
    description: >
      The client SHALL perform the MCP initialize handshake: send initialize request,
      receive response, send initialized notification.
    scenarios:
      - name: Successful initialization
        when: connect() is called with a transport
        then: Sends initialize with protocolVersion, capabilities, clientInfo; receives InitializeResult; sends notifications/initialized
      - name: State transitions
        when: connect() progresses
        then: State goes disconnected → initializing → ready
      - name: Store server info
        when: Server responds with capabilities and serverInfo
        then: serverCapabilities, serverInfo, and instructions are stored

  - id: R-005
    title: Protocol version negotiation
    description: >
      The client SHALL send protocol version "2025-03-26" and handle version negotiation.
    scenarios:
      - name: Same version
        when: Server responds with "2025-03-26"
        then: Connection succeeds
      - name: Different version
        when: Server responds with unsupported version
        then: Connection fails with version mismatch error

  - id: R-006
    title: Capability negotiation
    description: >
      The client SHALL exchange capabilities during initialization and enforce
      capability gating on feature methods.
    scenarios:
      - name: Tools gated
        when: listTools() called but server has no tools capability
        then: Throws error "Server does not support tools"
      - name: Resources gated
        when: listResources() called but server has no resources capability
        then: Throws error "Server does not support resources"
      - name: Subscribe gated
        when: subscribe() called but resources.subscribe is not true
        then: Throws error "Server does not support resource subscriptions"

  - id: R-007
    title: Tools list
    description: >
      The client SHALL discover available tools via tools/list with cursor-based pagination.
    scenarios:
      - name: List all tools
        when: listTools() called
        then: "Returns { tools: Tool[], nextCursor?: string }"
      - name: Paginated list
        when: "listTools({ cursor }) called with cursor from previous response"
        then: Returns next page of tools

  - id: R-008
    title: Tools call
    description: >
      The client SHALL invoke tools via tools/call and return typed results.
    scenarios:
      - name: Successful call
        when: "callTool({ name, arguments }) called"
        then: "Returns { content: ContentItem[], isError?: boolean }"
      - name: Tool error
        when: "Tool returns isError: true"
        then: Result has isError=true with error content
      - name: Unknown tool
        when: "Tool name doesn't exist on server"
        then: Returns JSON-RPC error

  - id: R-009
    title: Tools changed notification
    description: >
      The client SHALL handle notifications/tools/list_changed.
    scenarios:
      - name: Notification received
        when: Server sends tools/list_changed notification
        then: onToolsChanged callback fires

  - id: R-010
    title: Resources list
    description: >
      The client SHALL discover available resources via resources/list with pagination.
    scenarios:
      - name: List resources
        when: listResources() called
        then: "Returns { resources: Resource[], nextCursor?: string }"
      - name: Resource has all fields
        when: Server returns resource with uri, name, description, mimeType, size
        then: All fields are present in returned Resource object

  - id: R-011
    title: Resources read
    description: >
      The client SHALL read resource contents via resources/read.
    scenarios:
      - name: Read text resource
        when: readResource(uri) called for text resource
        then: "Returns { contents: [{ uri, mimeType, text }] }"
      - name: Read binary resource
        when: readResource(uri) called for binary resource
        then: "Returns { contents: [{ uri, mimeType, blob }] }"
      - name: Resource not found
        when: readResource(uri) called for nonexistent URI
        then: Returns JSON-RPC error code -32002

  - id: R-012
    title: Resource templates
    description: >
      The client SHALL discover resource templates via resources/templates/list.
    scenarios:
      - name: List templates
        when: listResourceTemplates() called
        then: "Returns { resourceTemplates: ResourceTemplate[], nextCursor?: string }"

  - id: R-013
    title: Resource subscriptions
    description: >
      The client SHALL subscribe/unsubscribe to resource updates and receive notifications.
    scenarios:
      - name: Subscribe
        when: "subscribe(uri) called"
        then: "Sends resources/subscribe with uri"
      - name: Unsubscribe
        when: "unsubscribe(uri) called"
        then: "Sends resources/unsubscribe with uri"
      - name: Resource updated
        when: Server sends notifications/resources/updated with uri
        then: onResourceUpdated(uri) callback fires

  - id: R-014
    title: Prompts list
    description: >
      The client SHALL discover prompts via prompts/list with pagination.
    scenarios:
      - name: List prompts
        when: listPrompts() called
        then: "Returns { prompts: Prompt[], nextCursor?: string }"

  - id: R-015
    title: Prompts get
    description: >
      The client SHALL retrieve prompt content via prompts/get.
    scenarios:
      - name: Get prompt without arguments
        when: getPrompt("name") called
        then: "Returns { description?, messages: PromptMessage[] }"
      - name: Get prompt with arguments
        when: 'getPrompt("name", { code: "..." }) called'
        then: Returns expanded prompt with argument values substituted

  - id: R-016
    title: Completions
    description: >
      The client SHALL request argument completions via completion/complete.
    scenarios:
      - name: Complete prompt argument
        when: "complete with ref/prompt and argument name/value"
        then: "Returns { completion: { values, hasMore?, total? } }"
      - name: Complete resource argument
        when: "complete with ref/resource and argument name/value"
        then: Returns completion values

  - id: R-017
    title: Logging
    description: >
      The client SHALL set log level and receive log message notifications.
    scenarios:
      - name: Set level
        when: setLogLevel("info") called
        then: Sends logging/setLevel request with level
      - name: Receive log message
        when: Server sends notifications/message
        then: "onLog callback fires with { level, logger?, data }"

  - id: R-018
    title: Roots
    description: >
      The client SHALL respond to roots/list requests and send roots/list_changed notifications.
    scenarios:
      - name: Respond to roots/list
        when: Server sends roots/list request
        then: "Client responds with { roots } from onRootsList handler"
      - name: Send roots changed
        when: sendRootsChanged() called
        then: Sends notifications/roots/list_changed

  - id: R-019
    title: Sampling
    description: >
      The client SHALL handle server-initiated sampling/createMessage requests.
    scenarios:
      - name: Forward to handler
        when: Server sends sampling/createMessage
        then: onSamplingRequest handler receives params and result is returned
      - name: No handler
        when: Server sends sampling/createMessage but no handler registered
        then: Returns JSON-RPC error

  - id: R-020
    title: Cancellation
    description: >
      The client SHALL support cancelling in-flight requests via notifications/cancelled.
    scenarios:
      - name: Cancel outgoing request
        when: cancel(requestId, reason?) called
        then: Sends notifications/cancelled with requestId and optional reason
      - name: AbortSignal support
        when: callTool called with AbortSignal that aborts
        then: Cancellation notification sent and promise rejects
      - name: Cancel after completion
        when: cancel called for already-completed request
        then: Notification sent but no error (fire-and-forget)

  - id: R-021
    title: Progress
    description: >
      The client SHALL receive progress notifications and dispatch them.
    scenarios:
      - name: Receive progress
        when: Server sends notifications/progress with progressToken
        then: "onProgress callback fires with { progressToken, progress, total?, message? }"
      - name: Progress token in request
        when: callTool called with _meta.progressToken
        then: Token is included in the request params._meta

  - id: R-022
    title: Ping
    description: >
      The client SHALL send and respond to ping requests.
    scenarios:
      - name: Client ping
        when: ping() called
        then: Sends ping request and resolves on empty response
      - name: Server ping
        when: Server sends ping request
        then: Client responds with empty object

  - id: R-023
    title: Stdio transport
    description: >
      The client SHALL communicate with MCP servers over stdio by spawning a child process.
    scenarios:
      - name: Spawn process
        when: StdioTransport created with command and args
        then: Child process spawned with stdin/stdout/stderr piped
      - name: Readable/writable
        when: Transport created
        then: readable is child stdout, writable is child stdin
      - name: Dispose
        when: dispose() called
        then: stdin closed, process killed, closed promise resolves

  - id: R-024
    title: Streamable HTTP transport
    description: >
      The client SHALL communicate with MCP servers over Streamable HTTP with SSE.
    scenarios:
      - name: POST request
        when: JSON-RPC message written to transport
        then: HTTP POST sent to endpoint with Accept header listing application/json and text/event-stream
      - name: SSE response
        when: Server responds with text/event-stream
        then: SSE events parsed and JSON-RPC messages appear on readable
      - name: JSON response
        when: Server responds with application/json
        then: Single JSON-RPC message appears on readable
      - name: Session ID tracking
        when: Server returns Mcp-Session-Id in initialize response
        then: All subsequent requests include Mcp-Session-Id header
      - name: GET SSE stream
        when: Server supports server-initiated messages
        then: Client opens GET SSE stream for notifications
      - name: Session termination
        when: Client calls close()
        then: HTTP DELETE sent with session ID

  - id: R-025
    title: Batch message receiving
    description: >
      The client SHALL support receiving JSON-RPC batch messages (arrays).
    scenarios:
      - name: Receive batch
        when: Server sends JSON array of messages
        then: Each message in the array is processed individually

  - id: R-026
    title: Graceful shutdown
    description: >
      The client SHALL cleanly shut down on close().
    scenarios:
      - name: Close rejects pending
        when: close() called with pending requests
        then: All pending requests reject with close error
      - name: State transition
        when: close() called
        then: State transitions to closed
      - name: Stdio shutdown
        when: close() on stdio transport
        then: stdin closed, SIGTERM sent, SIGKILL after timeout

  - id: R-027
    title: Error handling
    description: >
      The client SHALL properly handle JSON-RPC errors, McpError, and transport errors.
    scenarios:
      - name: JSON-RPC error codes
        when: Server returns standard error code
        then: McpError thrown with correct code and message
      - name: Transport error
        when: Child process crashes
        then: All pending requests reject, state transitions to closed
      - name: Connection lost
        when: Transport closes unexpectedly
        then: Pending requests rejected, onClose callback fires

stories:
  # ═══════════════════════════════════════════
  # EPIC 1: Package Setup
  # ═══════════════════════════════════════════

  - id: US-001
    title: Create package.json with zero runtime deps
    status: open
    dependsOn: []
    description: >
      As a developer, I want the tiny-mcp-client package scaffolded with package.json,
      tsconfig.json, and correct workspace config so I can start development.
    acceptanceCriteria:
      - "package.json has name 'tiny-mcp-client', version '0.1.0', type 'module'"
      - "No runtime dependencies — only devDependencies"
      - "devDependencies include @modelcontextprotocol/sdk and tiny-stdio-mcp-server"
      - "tsconfig.json extends root, outDir dist, rootDir src, excludes *.test.ts"
      - "Package added to root workspaces in root package.json"
      - "npm install succeeds"

  - id: US-002
    title: Create index.ts entry point with placeholder exports
    status: open
    dependsOn: [US-001]
    description: >
      As a developer, I want the index.ts wired up so the package compiles.
    acceptanceCriteria:
      - "src/index.ts exists with placeholder comment"
      - "tsc compiles successfully"

  # ═══════════════════════════════════════════
  # EPIC 2: JSON-RPC Types & McpError
  # ═══════════════════════════════════════════

  - id: US-003
    title: Define JSON-RPC 2.0 base types
    status: open
    dependsOn: [US-002]
    description: >
      As a developer, I want JSON-RPC types so the message layer has type-safe structures.
    acceptanceCriteria:
      - "RequestId type is number | string (no null — MCP spec)"
      - "JsonRpcRequest with jsonrpc, id, method, optional params"
      - "JsonRpcNotification with jsonrpc, method, optional params (no id)"
      - "JsonRpcSuccessResponse with jsonrpc, id, result"
      - "JsonRpcErrorResponse with jsonrpc, id, error"
      - "JsonRpcResponse union of success | error"
      - "JsonRpcErrorObject with code, message, optional data"
      - "Types compile with strict mode"

  - id: US-004
    title: Implement McpError class
    status: open
    dependsOn: [US-003]
    description: >
      As a developer, I want an McpError class for structured error handling.
    acceptanceCriteria:
      - "McpError extends Error with code (number) and optional data"
      - "name property is 'McpError'"
      - "instanceof McpError works correctly"
      - "McpError without data does not have data property"
      - "Test: construct with code, message, data — verify all properties"
      - "Test: construct without data — verify data is undefined"
      - "Test: instanceof check passes"

  - id: US-005
    title: Define JSON-RPC error code constants
    status: open
    dependsOn: [US-003]
    description: >
      As a developer, I want standard JSON-RPC error codes as named exports.
    acceptanceCriteria:
      - "ERROR_PARSE = -32700"
      - "ERROR_INVALID_REQUEST = -32600"
      - "ERROR_METHOD_NOT_FOUND = -32601"
      - "ERROR_INVALID_PARAMS = -32602"
      - "ERROR_INTERNAL = -32603"
      - "Test: each constant has correct numeric value"

  # ═══════════════════════════════════════════
  # EPIC 3: JSON-RPC Message Parsing
  # ═══════════════════════════════════════════

  - id: US-006
    title: Implement parseJsonRpcMessage function
    status: open
    dependsOn: [US-004, US-005]
    description: >
      As a developer, I want a function that parses a JSON string into a typed
      JSON-RPC message (request, notification, response, or invalid).
    acceptanceCriteria:
      - "Returns discriminated union with type: request, notification, response, or invalid"
      - "Request: has method + id → type='request'"
      - "Notification: has method, no id → type='notification'"
      - "Response: has id + result or error, no method → type='response'"
      - "Invalid: returns error object with code and id"

  - id: US-007
    title: "Test parseJsonRpcMessage — valid messages"
    status: open
    dependsOn: [US-006]
    description: >
      As a developer, I want tests proving correct parsing of all valid message types.
    acceptanceCriteria:
      - "Test: parse request with numeric id"
      - "Test: parse request with string id"
      - "Test: parse request with params"
      - "Test: parse request without params"
      - "Test: parse notification with params"
      - "Test: parse notification without params"
      - "Test: parse success response"
      - "Test: parse error response with data"
      - "Test: parse error response without data"

  - id: US-008
    title: "Test parseJsonRpcMessage — invalid messages"
    status: open
    dependsOn: [US-006]
    description: >
      As a developer, I want tests proving correct rejection of invalid messages.
    acceptanceCriteria:
      - "Test: malformed JSON returns parse error (-32700)"
      - "Test: non-object (array) returns invalid request (-32600)"
      - "Test: non-object (string) returns invalid request (-32600)"
      - "Test: missing jsonrpc field returns invalid request"
      - "Test: wrong jsonrpc value returns invalid request"
      - "Test: non-string method returns invalid request"
      - "Test: response with both result and error returns invalid request"
      - "Test: response with neither result nor error returns invalid request"

  - id: US-009
    title: Implement serializeJsonRpcMessage function
    status: open
    dependsOn: [US-003]
    description: >
      As a developer, I want a function that serializes a JSON-RPC message to a
      newline-delimited string.
    acceptanceCriteria:
      - "Returns JSON.stringify(message) + '\\n'"
      - "Test: serialized output ends with newline"
      - "Test: round-trip parse(serialize(msg)) produces equivalent message"

  - id: US-010
    title: Implement readLines async generator
    status: open
    dependsOn: [US-002]
    description: >
      As a developer, I want an async generator that reads newline-delimited lines
      from a Readable stream, handling partial chunks and CR+LF.
    acceptanceCriteria:
      - "Yields complete lines from stream"
      - "Handles chunks that split across line boundaries"
      - "Handles CR+LF line endings (strips CR)"
      - "Yields remaining buffer content when stream closes"
      - "Test: single chunk with multiple lines"
      - "Test: line split across two chunks"
      - "Test: CR+LF line endings"
      - "Test: empty lines skipped or yielded correctly"

  # ═══════════════════════════════════════════
  # EPIC 4: JSON-RPC Message Layer
  # ═══════════════════════════════════════════

  - id: US-011
    title: Implement JsonRpcMessageLayer constructor
    status: open
    dependsOn: [US-006, US-009, US-010]
    description: >
      As a developer, I want a JsonRpcMessageLayer class that takes input/output
      streams and a timeout, starts consuming lines from input.
    acceptanceCriteria:
      - "Constructor takes input (Readable), output (Writable), and optional requestTimeoutMs"
      - "Starts consuming input lines immediately"
      - "Default requestTimeoutMs is 30000"
      - "Validates requestTimeoutMs is non-negative finite number"

  - id: US-012
    title: Implement sendRequest method
    status: open
    dependsOn: [US-011]
    description: >
      As a developer, I want sendRequest that writes a JSON-RPC request and returns
      a promise that resolves when the response arrives.
    acceptanceCriteria:
      - "Auto-increments integer request IDs starting at 1"
      - "Writes serialized request to output stream"
      - "Returns promise that resolves with result on success"
      - "Test: sendRequest writes request with id=1 to output"
      - "Test: second sendRequest gets id=2"

  - id: US-013
    title: Implement request/response correlation
    status: open
    dependsOn: [US-012]
    description: >
      As a developer, I want incoming responses to resolve the correct pending request.
    acceptanceCriteria:
      - "Success response resolves promise with result value"
      - "Error response rejects promise with McpError"
      - "McpError has correct code, message, and data from response"
      - "Test: send request, write response to input, promise resolves"
      - "Test: send request, write error response, promise rejects with McpError"
      - "Test: two concurrent requests, responses in reverse order, correct correlation"

  - id: US-014
    title: Implement request timeout
    status: open
    dependsOn: [US-012]
    description: >
      As a developer, I want requests to timeout after the configured duration.
    acceptanceCriteria:
      - "Promise rejects with timeout error after requestTimeoutMs"
      - "Timeout error message includes method name and timeout duration"
      - "Pending request count decrements on timeout"
      - "Test: send request, advance time past timeout, promise rejects"
      - "Test: per-request timeout override via options.timeoutMs"

  - id: US-015
    title: Implement sendNotification method
    status: open
    dependsOn: [US-011]
    description: >
      As a developer, I want sendNotification that writes a notification (no id, no response).
    acceptanceCriteria:
      - "Writes JSON-RPC notification without id field"
      - "Does not create pending request entry"
      - "Test: notification written to output has no id"
      - "Test: notification with params includes params"
      - "Test: notification without params omits params"

  - id: US-016
    title: Implement onRequest handler registration
    status: open
    dependsOn: [US-011]
    description: >
      As a developer, I want to register handlers for incoming requests and have
      responses sent automatically.
    acceptanceCriteria:
      - "onRequest(method, handler) registers handler for method"
      - "When request arrives, handler is called with (params, context)"
      - "Handler return value is sent as success response"
      - "Handler throw is sent as error response"
      - "Test: register handler, send request on input, verify response on output"
      - "Test: handler throws — error response written"

  - id: US-017
    title: Implement onNotification handler registration
    status: open
    dependsOn: [US-011]
    description: >
      As a developer, I want to register handlers for incoming notifications.
    acceptanceCriteria:
      - "onNotification(method, handler) registers handler"
      - "When notification arrives, handler called with (params, context)"
      - "No response sent for notifications"
      - "Missing handler for notification is silently ignored"
      - "Test: register handler, send notification on input, handler called"
      - "Test: notification for unregistered method — no error"

  - id: US-018
    title: Implement method-not-found for unregistered requests
    status: open
    dependsOn: [US-016]
    description: >
      As a developer, I want unregistered request methods to return method-not-found error.
    acceptanceCriteria:
      - "Request for unregistered method returns error code -32601"
      - "Error message includes the method name"
      - "Test: send request for unknown method, verify error response"

  - id: US-019
    title: Implement parse/invalid-request error responses
    status: open
    dependsOn: [US-011]
    description: >
      As a developer, I want malformed input lines to produce proper error responses.
    acceptanceCriteria:
      - "Malformed JSON → error response with code -32700 (parse error)"
      - "Invalid JSON-RPC structure → error response with code -32600"
      - "Error response id is extracted from the malformed message when possible"
      - "Test: write malformed JSON to input, verify parse error response"
      - "Test: write invalid JSON-RPC to input, verify invalid request response"

  - id: US-020
    title: Implement dispose method
    status: open
    dependsOn: [US-012]
    description: >
      As a developer, I want dispose() to reject all pending requests and stop processing.
    acceptanceCriteria:
      - "All pending requests rejected with provided error or default"
      - "Timeouts cleared for all pending requests"
      - "Subsequent sendRequest throws"
      - "Subsequent sendNotification throws"
      - "Idempotent — multiple dispose calls are safe"
      - "Test: dispose rejects all pending requests"
      - "Test: sendRequest after dispose throws"

  - id: US-021
    title: Input stream close triggers dispose
    status: open
    dependsOn: [US-020]
    description: >
      As a developer, I want the layer to auto-dispose when the input stream closes.
    acceptanceCriteria:
      - "When input stream ends, layer disposes automatically"
      - "All pending requests rejected with 'stream closed' error"
      - "Test: close input stream, verify pending requests rejected"

  - id: US-022
    title: "Test CR+LF and empty line handling in message layer"
    status: open
    dependsOn: [US-011]
    description: >
      As a developer, I want the layer to handle edge cases in line parsing.
    acceptanceCriteria:
      - "Test: CR+LF delimited messages are parsed correctly"
      - "Test: empty lines are ignored (not parsed as invalid)"
      - "Test: message split across multiple stream chunks works"

  # ═══════════════════════════════════════════
  # EPIC 5: Transport Interface
  # ═══════════════════════════════════════════

