version: 1
project: tokenfill
overview: |
  `tokenfill` is a zero-config library that generates text to an exact token count.
  Built for AI/LLM developers who need deterministic, reproducible text for testing
  prompts, benchmarking context windows, and evaluating token limits.

  It ships a built-in corpus of ~2M tokens of curated original articles on obscure
  scientific fields (archaeoastronomy, magnetohydrodynamics, biosemiotics, etc.) as
  separate markdown files. Articles are concatenated sequentially and truncated at
  the exact token boundary. The only configurable option is the tokenizer encoding.

  This is a standalone public npm package (`tokenfill`) — not part of poe-code.
  It lives at `packages/tokenfill/` in this monorepo for convenience but has its
  own identity, no @poe-code scope, and is published independently.
  It provides both a programmatic API (`tokenfill(tokenCount, options?)`) and a
  CLI (`tokenfill 2000`). Output is fully deterministic — same token count always
  produces the same text.
goals:
  - Zero-config text generation to exact token counts
  - Ship ~2M tokens of built-in corpus as markdown files
  - Provide both CLI and programmatic API with parity
  - Deterministic output — sequential concatenation with hard truncation
  - Configurable tokenizer encoding (default cl100k_base)
nonGoals:
  - Custom article loading or user-provided corpora
  - Selection strategies (random, bestFit, priority)
  - Article titles, separators, or formatting options
  - Seed/randomization options
  - File format loaders (JSON, JSONL, CSV)
  - README changes without explicit approval
qualityGates:
  - npm run test
  - npm run lint
requirements:
  - name: Exact token count generation
    description: |
      `tokenfill` SHALL generate text containing exactly the requested number of tokens
      as counted by the configured tokenizer. Articles are concatenated sequentially and
      the last article MUST be truncated at the exact token boundary.
    scenarios:
      - name: Exact match
        when: tokenfill(1000) is called
        then: result.actualTokens equals 1000
      - name: Small count
        when: tokenfill(1) is called
        then: result.actualTokens equals 1
      - name: Large count within corpus
        when: tokenfill(100000) is called
        then: result.actualTokens equals 100000
      - name: Count exceeds corpus
        when: Token count exceeds total corpus tokens
        then: An error is thrown indicating insufficient corpus size

  - name: Deterministic output
    description: |
      Given the same token count and tokenizer, `tokenfill` SHALL always return
      identical text. Articles are selected sequentially from the built-in corpus
      and concatenated in fixed order.
    scenarios:
      - name: Repeated calls produce same output
        when: tokenfill(2000) is called twice
        then: Both calls return identical text and actualTokens
      - name: Different counts produce different output
        when: tokenfill(1000) and tokenfill(2000) are called
        then: The 1000-token result is a prefix of the 2000-token result

  - name: Configurable tokenizer
    description: |
      `tokenfill` SHALL accept an optional tokenizer encoding name. When provided,
      token counting and truncation MUST use the specified encoding. Default is cl100k_base.
    scenarios:
      - name: Default tokenizer
        when: tokenfill(1000) is called without options
        then: cl100k_base encoding is used for token counting
      - name: Custom tokenizer
        when: "tokenfill(1000, { tokenizer: 'o200k_base' }) is called"
        then: o200k_base encoding is used and actualTokens reflects that encoding

  - name: CLI parity with API
    description: |
      The CLI SHALL expose the same functionality as the programmatic API.
      `tokenfill <count>` outputs text to stdout. `--json` outputs structured JSON.
      `--tokenizer` sets the encoding.
    scenarios:
      - name: Basic CLI usage
        when: tokenfill 2000 is run
        then: 2000 tokens of text are printed to stdout with stats on stderr
      - name: JSON output
        when: tokenfill 2000 --json is run
        then: JSON with text and actualTokens is printed to stdout
      - name: Custom tokenizer via CLI
        when: tokenfill 2000 --tokenizer o200k_base is run
        then: Output uses o200k_base encoding

  - name: Built-in corpus
    description: |
      The package SHALL ship a built-in corpus of ~2M tokens as separate markdown files
      covering obscure scientific fields. Each file is a standalone article.
    scenarios:
      - name: Corpus exists
        when: The package is installed
        then: Markdown article files are present in the package
      - name: Sufficient corpus size
        when: All articles are concatenated and tokenized
        then: Total token count is approximately 2M tokens
      - name: Article content
        when: Articles are inspected
        then: Each covers a distinct obscure scientific field
