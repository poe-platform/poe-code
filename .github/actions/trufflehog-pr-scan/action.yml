name: TruffleHog PR Scan
description: Run the TruffleHog PR scan helper.
inputs:
  command:
    description: Helper command to run.
    required: true
outputs:
  exit_code:
    description: TruffleHog process exit code.
    value: ${{ steps.helper.outputs.exit_code }}
  findings_count:
    description: Number of raw TruffleHog findings.
    value: ${{ steps.helper.outputs.findings_count }}
runs:
  using: composite
  steps:
    - name: Run helper
      id: helper
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../scripts/trufflehog-pr-scan.sh" "${{ inputs.command }}"
