name: PR Checks
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run codegen:plan-schemas
      - name: Check generated plan schemas are fresh
        run: |
          if [ -n "$(git status --porcelain -- docs/schemas/plans)" ]; then
            echo "Generated plan schemas are out of date. Run npm run codegen:plan-schemas."
            git status --short -- docs/schemas/plans
            git diff -- docs/schemas/plans
            exit 1
          fi
      - run: npm run build
      - run: npm run codegen:check:python-types
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --force
      - run: npm run smoke
