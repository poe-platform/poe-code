name: PR Checks
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run codegen:plan-schemas
      - name: Check generated plan schemas are fresh
        run: |
          if [ -n "$(git status --porcelain -- docs/schemas/plans)" ]; then
            echo "Generated plan schemas are out of date. Run npm run codegen:plan-schemas."
            git status --short -- docs/schemas/plans
            git diff -- docs/schemas/plans
            exit 1
          fi
      - run: npm run lint
      - run: npm run lint:mcp-sdk-deps --workspace @poe-code/github-workflows
      - run: npm run typecheck
      - name: Route Node22-only virtual-bash tests
        run: |
          echo "virtual-bash requires Node >=22; Node20 does not meet its test-discovery prerequisite."
          echo "Its complete test:unit suite runs in the separate virtual-bash-node22 job; no tests are waived."
      - run: npm test -- --concurrency=4 --exclude-workspace=virtual-bash
      - run: npm run smoke
  virtual-bash-node22:
    name: virtual-bash (Node22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build root public peer and workspace dependencies
        run: npm run build
      - name: Run the complete virtual-bash unit suite serially
        run: npm run test:unit --workspace virtual-bash -- --test-concurrency=1
  bun-public-imports:
    name: Packed public APIs (Bun 1.3.11 and Node22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Record exact runtime versions
        run: |-
          node --version
          bun --version
          bun --revision
      - run: npm ci
      - run: npm run build
      - name: Install packed artifact and test direct imports
        run: |-
          set -euo pipefail
          artifact="$(mktemp -d)"
          npm pack --ignore-scripts --pack-destination "$artifact"
          mkdir "$artifact/consumer"
          cp packages/safe-fs/tests/packed-runtime-smoke.mjs "$artifact/consumer/smoke.mjs"
          cd "$artifact/consumer"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$artifact"/*.tgz
          node smoke.mjs
          bun smoke.mjs
