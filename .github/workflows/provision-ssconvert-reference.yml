name: Provision Linux ssconvert reference
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Declared isolated activation profile (runtime parity remains
          separately qualified)
        required: true
        type: choice
        default: gnumeric-1.12.61-optional-none
        options:
          - gnumeric-1.12.61-optional-none
          - gnumeric-1.12.61-optional-perl-samples
          - gnumeric-1.12.61-optional-python-samples
          - gnumeric-1.12.61-optional-python-glossary
          - gnumeric-1.12.61-optional-gda
          - gnumeric-1.12.61-optional-gnomedb-ui
          - gnumeric-1.12.61-optional-sample-datasource
          - gnumeric-1.12.61-optional-excel-formats
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    container:
      image: debian@sha256:1808211ab6f37c6fc6a75368651697536f7bf47993f2797befa8908b1254979d
    defaults:
      run:
        shell: bash
    steps:
      - name: Install isolated native build tooling
        run: |
          mkdir -p /out
          export DEBIAN_FRONTEND=noninteractive
          apt-get update > /out/ssconvert-bootstrap.log 2>&1
          apt-get install -y --no-install-recommends \
            build-essential bison ca-certificates curl git pkg-config intltool itstool libxml2-utils gettext \
            libgtk-3-dev libgsf-1-dev libxml2-dev libxslt1-dev librsvg2-dev libglib2.0-dev libbz2-dev zlib1g-dev \
            pxlib-dev libglpk-dev liblpsolve55-dev glpk-utils lp-solve \
            meson ninja-build valac gobject-introspection libgirepository1.0-dev libsqlite3-dev libjson-glib-dev libgtksourceview-3.0-dev iso-codes \
            tzdata fontconfig fonts-dejavu-core fonts-dejavu-mono python3 python3-dev python-gi-dev python3-gi libperl-dev python3-yaml file \
            >> /out/ssconvert-bootstrap.log 2>&1
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build authenticated GOffice and Gnumeric sources
        run: |
          mkdir -p out/ssconvert-linux
          mv /out/ssconvert-bootstrap.log out/ssconvert-linux/bootstrap.log
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tarfile, urllib.request
          root = pathlib.Path('out/ssconvert-linux').resolve()
          reference = json.loads(pathlib.Path('docs/ssconvert/reference-profile.json').read_text())
          profile = next(item for item in json.loads(pathlib.Path('docs/ssconvert/optional-runtime-extension-coverage.json').read_text())['profiles'] if item['id'] == os.environ['SSCONVERT_REFERENCE_PROFILE'])
          env = dict(os.environ, **reference['build']['configureEnvironment'])
          dependencies_path = pathlib.Path('docs/ssconvert/linux-reference-dependencies.json')
          dependency_builds = [item for item in json.loads(dependencies_path.read_text())['dependencies'] if profile['id'] in item['profileIds']]
          for dependency in dependency_builds:
              source = dependency['source']
              archive = root / (dependency['id'] + '.tar.xz')
              urllib.request.urlretrieve(source['url'], archive)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == source['sha256']
              with tarfile.open(archive) as tar:
                  members = [member for member in tar.getmembers() if not any(member.name.startswith(prefix) for prefix in dependency.get('excludeArchivePaths', []))]
                  tar.extractall(root, members=members, filter='data')
              cwd = root / source['directory']
              for index, command in enumerate(dependency['commands']):
                  with (root / (dependency['id'] + '-' + str(index) + '.log')).open('wb') as log:
                      subprocess.run(command, cwd=cwd, env=env, stdout=log, stderr=subprocess.STDOUT, check=True)
              shutil.rmtree(cwd)
          (root / 'dependency-builds.json').write_text(json.dumps(dict(manifestSha256=hashlib.sha256(dependencies_path.read_bytes()).hexdigest(), selected=dependency_builds), indent=2) + '\n')
          for name, source, arguments in [
              ('goffice', reference['supplementarySource'], reference['build']['gofficeConfigure'][1:]),
              ('gnumeric', reference['source'], profile['configureArguments'])
          ]:
              archive = root / (name + '.tar.xz')
              urllib.request.urlretrieve(source['url'], archive)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == source['sha256']
              with tarfile.open(archive) as tar:
                  tar.extractall(root, filter='data')
              cwd = root / (name + '-' + source['version'])
              for stage, command in [('configure', ['./configure', *arguments]), ('make', ['make', '-j2']), ('install', ['make', 'install'])]:
                  with (root / (name + '-' + stage + '.log')).open('wb') as log:
                      subprocess.run(command, cwd=cwd, env=env, stdout=log, stderr=subprocess.STDOUT, check=True)
              shutil.rmtree(cwd)
          PY
      - name: Collect native identity and isolated base-profile captures
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, shlex, yaml
          root = pathlib.Path('out/ssconvert-linux')
          profile_path = pathlib.Path('docs/ssconvert/optional-runtime-extension-coverage.json')
          reference_path = pathlib.Path('docs/ssconvert/reference-profile.json')
          profile = next(item for item in json.loads(profile_path.read_text())['profiles'] if item['id'] == os.environ['SSCONVERT_REFERENCE_PROFILE'])
          env = dict(os.environ, **profile['env'])
          for key in ['HOME', 'XDG_CONFIG_HOME', 'XDG_DATA_HOME', 'XDG_CACHE_HOME']:
              pathlib.Path(env[key]).mkdir(parents=True, exist_ok=True)
          binary = pathlib.Path('/opt/ssconvert-reference/bin/ssconvert')
          activation_source = root / 'function-activation.c'
          activation_source.write_text("#include <gnumeric.h>\n#include <libgnumeric.h>\n#include <gnumeric-conf.h>\n#include <command-context-stderr.h>\n#include <gnm-plugin.h>\n#include <func.h>\n#include <goffice/goffice.h>\nint main(int argc, char const **argv) {\n  argv = gnm_pre_parse_init(argc, argv);\n  gnm_conf_set_persistence(FALSE);\n  gnm_init();\n  GOCmdContext *cc = gnm_cmd_context_stderr_new();\n  gnm_plugins_init(cc);\n  GOErrorInfo *errors = NULL;\n  go_plugin_db_activate_plugin_list(go_plugins_get_available_plugins(), &errors);\n  const gboolean activation_failed = errors != NULL;\n  if (errors) {\n    go_error_info_print(errors);\n    go_error_info_free(errors);\n  }\n  const gboolean plugins_only = argc > 1 && g_str_equal(argv[1], \"plugins\");\n  GPtrArray *functions = gnm_func_enumerate();\n  if (!plugins_only) g_print(\"name\\tflags\\tfixed\\tnodes\\thelpEntries\\tminimum\\tmaximum\\timplementationStatus\\n\");\n  for (guint i = 0; i < functions->len; i++) {\n    GnmFunc *fn = g_ptr_array_index(functions, i);\n    gnm_func_load_if_stub(fn);\n    int count = 0, minimum = 0, maximum = 0;\n    gnm_func_get_help(fn, &count);\n    gnm_func_count_args(fn, &minimum, &maximum);\n    if (!plugins_only) g_print(\"%s\\t%u\\t%d\\t%d\\t%d\\t%d\\t%d\\t%d\\n\",\n      gnm_func_get_name(fn, FALSE), (unsigned)gnm_func_get_flags(fn),\n      gnm_func_is_fixargs(fn), gnm_func_is_varargs(fn), count, minimum, maximum,\n      gnm_func_get_impl_status(fn));\n  }\n  if (plugins_only) {\n    g_print(\"id\\tactive\\tloaded\\n\");\n    for (GSList *item = go_plugins_get_available_plugins(); item; item = item->next) {\n      GOPlugin *plugin = item->data;\n      g_print(\"%s\\t%d\\t%d\\n\", go_plugin_get_id(plugin),\n        go_plugin_is_active(plugin), go_plugin_is_loaded(plugin));\n    }\n  }\n  g_ptr_array_free(functions, TRUE);\n  g_object_unref(cc);\n  gnm_shutdown();\n  gnm_pre_parse_shutdown();\n  return activation_failed ? 1 : 0;\n}\n")
          activation_binary = root / 'function-activation'
          flags = shlex.split(subprocess.check_output(['pkg-config', '--cflags', '--libs', 'libspreadsheet-1.12'], env=env, text=True))
          with (root / 'function-activation-compile.log').open('wb') as log:
              subprocess.run(['cc', str(activation_source), '-o', str(activation_binary), *flags], env=env, stdout=log, stderr=subprocess.STDOUT, check=True)
          metadata = []
          def capture(label, command, capture_env=None, expected_exit_codes=(0,)):
              result = subprocess.run(command, env=env if capture_env is None else capture_env, capture_output=True, timeout=120)
              (root / (label + '.stdout')).write_bytes(result.stdout)
              (root / (label + '.stderr')).write_bytes(result.stderr)
              metadata.append(dict(label=label, expectedExitCodes=list(expected_exit_codes), argv=command, exitCode=result.returncode, stdoutHex=result.stdout.hex(), stderrHex=result.stderr.hex(), supplementalEnvironment={} if capture_env is None else {key: capture_env[key] for key in ['TZ', 'LD_PRELOAD'] if key in capture_env}))
              if result.returncode not in expected_exit_codes:
                  raise RuntimeError('Native capture failed: ' + label)
          for label, command in [
              ('uname', ['uname', '-a']), ('system', ['cat', '/etc/os-release']),
              ('compiler', ['gcc', '--version']),
              ('packages', ['dpkg-query', '-W', '-f=${Package}\t${Version}\n']),
              ('libraries', ['ldd', str(binary)]),
              ('versions', ['pkg-config', '--modversion', 'libgoffice-0.10', 'glib-2.0', 'gtk+-3.0', 'libgsf-1', 'pango', 'cairo']),
              ('native-version', [str(binary), '--version']),
              ('functions', [str(activation_binary.resolve())]),
              ('plugins', [str(activation_binary.resolve()), 'plugins']),
              ('importers', [str(binary), '--list-importers']),
              ('exporters', [str(binary), '--list-exporters'])
          ]:
              capture(label, command, expected_exit_codes=(0, 1) if label in ['functions', 'plugins'] else (0,))
          libraries = []
          for word in (root / 'libraries.stdout').read_text().split():
              if word.startswith('/'):
                  path = pathlib.Path(word).resolve()
                  if path.is_file():
                      libraries.append(dict(path=str(path), sha256=hashlib.sha256(path.read_bytes()).hexdigest()))
          modules = []
          for index, module in enumerate(sorted(pathlib.Path('/opt/ssconvert-reference').rglob('*.so'))):
              label = 'module-libraries-' + str(index)
              capture(label, ['ldd', str(module)])
              dependencies = []
              for word in (root / (label + '.stdout')).read_text().split():
                  if word.startswith('/'):
                      path = pathlib.Path(word).resolve()
                      if path.is_file():
                          dependencies.append(dict(path=str(path), sha256=hashlib.sha256(path.read_bytes()).hexdigest()))
              modules.append(dict(path=str(module), resolvedPath=str(module.resolve()), sha256=hashlib.sha256(module.read_bytes()).hexdigest(), linkedLibraries=dependencies))
          font_paths = subprocess.check_output(['fc-list', '--format', '%{file}\n'], env=env, text=True)
          fonts = []
          (root / 'fonts').mkdir()
          for name in sorted(set(font_paths.splitlines())):
              path = pathlib.Path(name)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              shutil.copyfile(path, root / 'fonts' / (digest + path.suffix))
              fonts.append(dict(path=name, bytes=path.stat().st_size, sha256=digest))
          source = json.loads(pathlib.Path('docs/ssconvert/byte-search-wildcard-native-results.json').read_text())
          input_path = root / 'search-wildcards.gnumeric'
          input_path.write_bytes(bytes.fromhex(source['inputHex']))
          capture('search-wildcards', [str(binary), '--recalc', '-T', 'Gnumeric_stf:stf_csv', str(input_path), 'fd://1'])
          language_fixture_path = pathlib.Path('docs/ssconvert/linux-language-native-probes.json')
          language_inputs = []
          for fixture in json.loads(language_fixture_path.read_text())['inputs']:
              if fixture['profileId'] != profile['id']:
                  continue
              path = root / (fixture['label'] + '.gnumeric')
              path.write_bytes(bytes.fromhex(fixture['inputHex']))
              assert hashlib.sha256(path.read_bytes()).hexdigest() == fixture['inputSha256']
              capture(fixture['label'], [str(binary), '--recalc', '-T', 'Gnumeric_stf:stf_csv', str(path), 'fd://1'])
              language_inputs.append(dict(label=fixture['label'], inputSha256=fixture['inputSha256'], caseCount=fixture['caseCount'], logicalFields=fixture['logicalFields']))
          clock_control = None
          control = json.loads(language_fixture_path.read_text())['frozenDateControl']
          if control['profileId'] == profile['id']:
              assert type(control['clockUnixSeconds']) is int and -(1 << 63) < control['clockUnixSeconds'] < (1 << 63)
              hook_source = root / 'frozen-time.c'
              hook_binary = root / 'frozen-time.so'
              hook_source.write_text("#include <time.h>\ntime_t time(time_t *target) {\n  const time_t frozen = 1709166600;\n  if (target) *target = frozen;\n  return frozen;\n}\n".replace('1709166600', str(control['clockUnixSeconds'])))
              with (root / 'frozen-time-compile.log').open('wb') as log:
                  subprocess.run(['cc', '-shared', '-fPIC', str(hook_source), '-o', str(hook_binary)], env=env, stdout=log, stderr=subprocess.STDOUT, check=True)
              path = root / 'frozen-date.gnumeric'
              path.write_bytes(bytes.fromhex(control['inputHex']))
              assert hashlib.sha256(path.read_bytes()).hexdigest() == control['inputSha256']
              zones = []
              for index, zone in enumerate(control['supplementalEnvironments']):
                  zone_file = pathlib.Path('/usr/share/zoneinfo') / zone['timezone']
                  zones.append(dict(timezone=zone['timezone'], fileSha256=hashlib.sha256(zone_file.read_bytes()).hexdigest()))
                  capture('frozen-date-' + str(index), [str(binary), '--recalc', '-T', 'Gnumeric_stf:stf_csv', str(path), 'fd://1'], dict(env, TZ=zone['timezone'], LD_PRELOAD=str(hook_binary.resolve())))
              clock_control = dict(clockUnixSeconds=control['clockUnixSeconds'], inputSha256=control['inputSha256'], hookSourceSha256=hashlib.sha256(hook_source.read_bytes()).hexdigest(), hookBinarySha256=hashlib.sha256(hook_binary.read_bytes()).hexdigest(), timezoneFiles=zones, policy=control['policy'])
          service_path = pathlib.Path('docs/ssconvert/linux-optional-service-native-probes.json')
          service_inputs = []
          for fixture in json.loads(service_path.read_text())['inputs']:
              if fixture['profileId'] != profile['id']:
                  continue
              path = root / fixture['filename']
              path.write_bytes(bytes.fromhex(fixture['inputHex']))
              assert hashlib.sha256(path.read_bytes()).hexdigest() == fixture['inputSha256']
              for probe in fixture['captures']:
                  argv = [value.replace('{input}', str(path)).replace('{root}', str(root)) for value in probe['argv']]
                  capture(probe['label'], [str(binary), *argv], expected_exit_codes=probe['expectedExitCodes'])
              outputs = []
              for output in sorted(root.glob('*')):
                  if output.suffix in ['.xls', '.xlsx', '.po']:
                      outputs.append(dict(name=output.name, bytes=output.stat().st_size, sha256=hashlib.sha256(output.read_bytes()).hexdigest()))
              service_inputs.append(dict(id=fixture['id'], inputSha256=fixture['inputSha256'], scope=fixture['scope'], generatedOutputs=outputs))
          workflow = pathlib.Path('.github/workflows/provision-ssconvert-reference.yml')
          source_revision = subprocess.check_output(['git', '-c', 'safe.directory=' + str(pathlib.Path.cwd()), 'rev-parse', 'HEAD'], text=True).strip()
          assert source_revision == os.environ['GITHUB_SHA']
          identity = dict(
              status='native-activation-collected-product-parity-unqualified',
              activationComplete=all(item['exitCode'] == 0 for item in metadata if item['label'] in ['functions', 'plugins']),
              sourceRevision=source_revision,
              image=yaml.safe_load(workflow.read_text())['jobs']['native']['container']['image'],
              profileId=profile['id'], environment=profile['env'],
              serviceFixtureSha256=hashlib.sha256(service_path.read_bytes()).hexdigest(), serviceInputs=service_inputs,
              dependencyBuilds=json.loads((root / 'dependency-builds.json').read_text()),
              languageFixtureSha256=hashlib.sha256(language_fixture_path.read_bytes()).hexdigest(), languageInputs=language_inputs, frozenDateControl=clock_control,
              referenceProfileSha256=hashlib.sha256(reference_path.read_bytes()).hexdigest(),
              optionalProfileSha256=hashlib.sha256(profile_path.read_bytes()).hexdigest(),
              binarySha256=hashlib.sha256(binary.read_bytes()).hexdigest(),
              activationCollectorSourceSha256=hashlib.sha256(activation_source.read_bytes()).hexdigest(),
              activationCollectorBinarySha256=hashlib.sha256(activation_binary.read_bytes()).hexdigest(),
              inputSha256=hashlib.sha256(input_path.read_bytes()).hexdigest(),
              linkedLibraries=libraries, installedModules=modules, fonts=fonts, captures=metadata)
          (root / 'identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
      - name: Package installed reference with executable modes and symlinks
        if: ${{ always() }}
        run: >
          if [ -d /opt/ssconvert-reference ]; then
            mkdir -p out/ssconvert-linux
            tar -czf out/ssconvert-linux/reference-prefix.tar.gz -C /opt ssconvert-reference
            sha256sum out/ssconvert-linux/reference-prefix.tar.gz > out/ssconvert-linux/reference-prefix.tar.gz.sha256
          fi
      - name: Retain native oracle and credential-free receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ssconvert-linux-${{ github.sha }}-${{ github.run_id }}
          path: |
            out/ssconvert-linux
            /out/ssconvert-bootstrap.log
          if-no-files-found: error
          retention-days: 7
    env:
      SSCONVERT_REFERENCE_PROFILE: ${{ inputs.profile }}
