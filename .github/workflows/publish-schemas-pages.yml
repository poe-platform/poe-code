name: Publish Schemas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - run: npm clean-install
      - run: npm run build
      - run: npm run build:site --workspace toolcraft-landing-page
      - run: npm run build:site --workspace packages/safe-bash-playground
      - name: Stage Pages artifact
        run: |
          rm -rf "$RUNNER_TEMP/pages"
          mkdir -p "$RUNNER_TEMP/pages/schemas"
          cp -R docs/schemas/. "$RUNNER_TEMP/pages/schemas"
          mkdir -p "$RUNNER_TEMP/pages/toolcraft-landing-page"
          cp -R packages/toolcraft-landing-page/dist-site/. "$RUNNER_TEMP/pages/toolcraft-landing-page"
          mkdir -p "$RUNNER_TEMP/pages/safe-bash"
          cp -R packages/safe-bash-playground/dist/site/. "$RUNNER_TEMP/pages/safe-bash"
          touch "$RUNNER_TEMP/pages/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
