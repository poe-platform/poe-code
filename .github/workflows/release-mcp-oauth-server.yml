name: Release mcp-oauth-server
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/mcp-oauth-server/**'
      - '.github/workflows/release-mcp-oauth-server.yml'
concurrency:
  group: release-mcp-oauth-server
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Install dependencies
        run: npm clean-install
      - name: Build package
        run: npx turbo build --filter=mcp-oauth-server
      - name: Auto-bump patch version from npm
        working-directory: packages/mcp-oauth-server
        run: |
          REMOTE=$(npm view mcp-oauth-server version 2>/dev/null || echo "0.0.99")
          npm version --no-git-tag-version "$REMOTE" --allow-same-version
          npm version --no-git-tag-version patch
      - name: Publish
        working-directory: packages/mcp-oauth-server
        run: npm publish --provenance --access public
