name: Release poe-oauth
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/poe-oauth/**'
concurrency:
  group: release-poe-oauth
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Install dependencies
        run: npm clean-install
      - name: Build
        run: npm run build --workspace poe-oauth
      - name: Auto-bump patch version from npm
        working-directory: packages/poe-oauth
        run: |
          REMOTE=$(npm view poe-oauth version 2>/dev/null || echo "0.0.0")
          npm version --no-git-tag-version --allow-same-version "$REMOTE"
          npm version --no-git-tag-version patch
      - name: Publish
        working-directory: packages/poe-oauth
        run: npm publish --provenance --access public
