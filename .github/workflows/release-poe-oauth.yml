name: Release poe-oauth
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/poe-oauth/**'
concurrency:
  group: release-poe-oauth
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Prepare Bun for publishing
        run: bun upgrade
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build --workspace poe-oauth
      - name: Auto-bump patch version from registry
        working-directory: packages/poe-oauth
        run: |
          REMOTE=$(bun info poe-oauth version 2>/dev/null || echo "0.0.0")
          bun pm version "$REMOTE"
          bun pm version patch
      - name: Publish
        working-directory: packages/poe-oauth
        run: bun publish --access public
