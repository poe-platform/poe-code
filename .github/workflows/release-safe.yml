name: Release scoped safe packages
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "packages/safe-js/**"
      - "packages/safe-bash/**"
      - "packages/safe-fs/**"
      - "scripts/package-safe*"
      - "scripts/fixtures/safe-packages-*"
      - "scripts/bundle*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-safe.yml"
      - packages/safe-bash/scripts/build-optional*
      - scripts/safe-bash-optional-*
concurrency:
  group: release-safe
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies and trusted-publishing npm
        run: |
          npm ci
          npm install --global npm@^11.5.1
          node --version
          npm --version
          bun --revision
      - name: Compute the next shared version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import semver from "semver";
          const versions = [];
          for (const name of ["safe-fs", "safe-js", "safe-bash"]) {
            const fullName = `@poe-platform/${name}`;
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(fullName)}/latest`, {
              signal: AbortSignal.timeout(30_000), redirect: "error",
            });
            if (response.status === 404) {
              await response.body?.cancel();
              throw new Error(`${fullName}: registry HTTP 404; external package/bootstrap setup remains required. Absence does not establish publishing permission.`);
            }
            if (!response.ok) {
              await response.body?.cancel();
              throw new Error(`${fullName}: registry HTTP ${response.status}; not a missing-package fallback`);
            }
            const chunks = [];
            let size = 0;
            for await (const chunk of response.body) {
              size += chunk.byteLength;
              if (size > 1_048_576) throw new Error(`${fullName}: registry metadata exceeds 1 MiB`);
              chunks.push(chunk);
            }
            const metadata = JSON.parse(Buffer.concat(chunks).toString("utf8"));
            if (metadata.name !== fullName || !semver.valid(metadata.version)) throw new Error(`${fullName}: invalid registry metadata`);
            versions.push(metadata.version);
          }
          const next = semver.inc(versions.sort(semver.rcompare)[0], "patch");
          appendFileSync(process.env.GITHUB_OUTPUT, `next=${next}\n`);
          NODE
      - run: npm run build
      - run: npx vitest run scripts/package-safe.test.ts scripts/root-optional-package.test.ts scripts/safe-bash-optional-build.test.ts scripts/safe-bash-optional-lifecycle.test.ts
      - run: npm run lint:packages
      - name: Prepare scoped artifacts
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: node scripts/package-safe.mjs --out-dir "$RUNNER_TEMP/safe-npm" --version "$VERSION"
      - name: Verify installed tarballs
        shell: bash
        run: |
          set -euo pipefail
          TARBALLS=$(mktemp -d)
          npm pack "$RUNNER_TEMP/safe-npm/safe-fs" --ignore-scripts --pack-destination "$TARBALLS"
          npm pack "$RUNNER_TEMP/safe-npm/safe-js" --ignore-scripts --pack-destination "$TARBALLS"
          npm pack "$RUNNER_TEMP/safe-npm/safe-bash" --ignore-scripts --pack-destination "$TARBALLS"
          OPTIONAL_CONSUMER=$(mktemp -d)
          cp scripts/fixtures/safe-packages-mixed-entry-runtime.mjs scripts/fixtures/safe-packages-optional.mjs scripts/fixtures/safe-packages-optional-no-yaml.mjs scripts/fixtures/safe-packages-optional-types.mts scripts/fixtures/safe-packages-opt-in.mjs scripts/fixtures/safe-packages-opt-in.d.mts "$OPTIONAL_CONSUMER/"
          cd "$OPTIONAL_CONSUMER"
          npm init --yes
          npm install --ignore-scripts --omit=optional --no-audit --no-fund "$TARBALLS"/poe-platform-safe-fs-*.tgz "$TARBALLS"/poe-platform-safe-bash-[0-9]*.tgz
          node safe-packages-optional-no-yaml.mjs
          bun safe-packages-optional-no-yaml.mjs
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --module NodeNext --moduleResolution NodeNext --target ES2023 --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" --types node safe-packages-optional-types.mts
          npm install --ignore-scripts --no-audit --no-fund --save-exact yaml@2.9.0
          SECOND_CONSUMER=$(mktemp -d)
          cd "$SECOND_CONSUMER"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund --save-exact "$TARBALLS"/poe-platform-safe-fs-*.tgz "$TARBALLS"/poe-platform-safe-bash-[0-9]*.tgz yaml@2.9.0
          cd "$OPTIONAL_CONSUMER"
          node safe-packages-optional.mjs "$SECOND_CONSUMER"
          bun safe-packages-optional.mjs "$SECOND_CONSUMER"
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --module NodeNext --moduleResolution NodeNext --target ES2023 --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" --types node safe-packages-optional-types.mts
          CONSUMER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE"/scripts/fixtures/safe-packages-* "$CONSUMER/"
          cd "$CONSUMER"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$TARBALLS"/poe-platform-safe-fs-*.tgz "$TARBALLS"/poe-platform-safe-js-*.tgz "$TARBALLS"/poe-platform-safe-bash-[0-9]*.tgz
          node safe-packages-smoke.mjs
          bun safe-packages-smoke.mjs
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 safe-packages-types.mts
          "$GITHUB_WORKSPACE/node_modules/.bin/esbuild" safe-packages-browser.mjs --bundle --platform=browser --format=esm --outfile=browser.mjs
          node browser.mjs
          npm install --ignore-scripts --no-audit --no-fund poe-code@14.0.4
          node safe-packages-legacy.mjs
          FS_ONLY=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/scripts/fixtures/safe-packages-fs-only.mjs" "$FS_ONLY/"
          cd "$FS_ONLY"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$TARBALLS"/poe-platform-safe-fs-*.tgz
          node safe-packages-fs-only.mjs
          bun safe-packages-fs-only.mjs
      - name: Publish SafeFS with provenance
        run: npm publish "$RUNNER_TEMP/safe-npm/safe-fs" --provenance --access public
      - name: Publish SafeJS with provenance
        run: npm publish "$RUNNER_TEMP/safe-npm/safe-js" --provenance --access public
      - name: Publish Safe Bash with provenance
        run: npm publish "$RUNNER_TEMP/safe-npm/safe-bash" --provenance --access public
  verify-publication:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the published versions
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for PACKAGE in safe-fs safe-js safe-bash; do
            VERIFIED=false
            for ATTEMPT in {1..180}; do
              if ACTUAL=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --header "Cache-Control: no-cache" "https://registry.npmjs.org/@poe-platform%2F$PACKAGE/$VERSION") &&
                node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(JSON.parse(process.argv[1]).version, process.argv[2]);' "$ACTUAL" "$VERSION"; then
                VERIFIED=true
                break
              fi
              if [ "$ATTEMPT" -lt 180 ]; then sleep 10; fi
            done
            if [ "$VERIFIED" != true ]; then
              echo "Registry verification failed for @poe-platform/$PACKAGE@$VERSION" >&2
              exit 1
            fi
          done
          printf 'Published and registry-verified safe-fs, safe-js and safe-bash (including explicit command imports) at %s\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
