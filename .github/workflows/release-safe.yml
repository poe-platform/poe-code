name: Release scoped safe packages
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/safe-bash/**"
      - "packages/safe-fs/**"
      - "packages/safe-js/**"
      - "packages/safe-bash-contracts/**"
      - "packages/safe-bash-csv-engine/**"
      - "packages/safe-bash-command-*/**"
      - "packages/safe-playwright/**"
      - "packages/safe-playwright-cloudflare/**"
      - "packages/package-lint/**"
      - "scripts/package-safe.mjs"
      - "scripts/fixtures/safe-packages-*"
      - "scripts/verify-safe-publication.mjs"
      - "scripts/verify-safe-cloudflare.mjs"
      - "scripts/build-workspaces.mjs"
      - "scripts/check-cache.mjs"
      - ".github/workflows/release-safe.yml"
concurrency:
  queue: max
  group: release-safe
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
env:
  POE_CHECK_CACHE_DIR: .turbo/ci-cache/checks-v1
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.next }}
      published: ${{ steps.queue-check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Check release queue position and publication state
        id: queue-check
        shell: bash
        run: |
          set -euo pipefail
          git fetch --filter=blob:none origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit $GITHUB_SHA is not an ancestor of origin/main." >&2
            exit 1
          fi
          publication_ref=refs/heads/safe-publication
          remote_head=$(git ls-remote --heads origin "$publication_ref" | cut -f1)
          if [ -n "$remote_head" ]; then
            git fetch --filter=blob:none origin "$publication_ref"
            if [ "$remote_head" = "$GITHUB_SHA" ] || git merge-base --is-ancestor "$GITHUB_SHA" "$remote_head"; then
              echo "::notice::Safe-bash publication already completed at or beyond $GITHUB_SHA ($remote_head); skipping."
              echo "Safe-bash publication already completed at or beyond $GITHUB_SHA ($remote_head); skipping." >> "$GITHUB_STEP_SUMMARY"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            changed_later=$(git diff --name-only "$GITHUB_SHA" origin/main -- \
              packages/safe-bash packages/safe-fs packages/safe-js \
              packages/safe-bash-contracts packages/safe-bash-csv-engine \
              packages/safe-playwright packages/safe-playwright-cloudflare \
              scripts/package-safe.mjs scripts/fixtures/safe-packages-* scripts/verify-safe-publication.mjs scripts/verify-safe-cloudflare.mjs scripts/build-workspaces.mjs scripts/check-cache.mjs \
              .github/workflows/release-safe.yml || true)
            changed_cmds=$(git diff --name-only "$GITHUB_SHA" origin/main | grep -E "^packages/safe-bash-command-" || true)
            if [ -n "$changed_later" ] || [ -n "$changed_cmds" ]; then
              echo "::notice::Queued safe-bash push $GITHUB_SHA superseded by newer safe-bash commit on origin/main ($(git rev-parse --short origin/main)); coalescing into newer queued release."
              echo "Queued safe-bash push $GITHUB_SHA superseded by newer safe-bash commit on origin/main; coalescing into newer queued release." >> "$GITHUB_STEP_SUMMARY"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Restore check cache
        if: steps.queue-check.outputs.publish == 'true'
        uses: actions/cache@v4
        with:
          path: .turbo/ci-cache
          key: safe-release-checks-v2-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            safe-release-checks-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            ${{ runner.os }}-${{ runner.arch }}-build-v1-${{ hashFiles('package-lock.json') }}-
            safe-release-checks-v2-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-node@v4
        if: steps.queue-check.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: steps.queue-check.outputs.publish == 'true'
      - name: Install dependencies and trusted-publishing npm
        if: steps.queue-check.outputs.publish == 'true'
        run: |
          npm ci
          npm install --global npm@^11.5.1
          node --version
          npm --version
          bun --revision
      - name: Compute the next shared version
        if: steps.queue-check.outputs.publish == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import semver from "semver";
          const versions = [];
          for (const name of ["safe-fs", "safe-js", "safe-bash"]) {
            const fullName = `@poe-platform/${name}`;
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(fullName)}/latest`, {
              signal: AbortSignal.timeout(30_000), redirect: "error",
            });
            if (response.status === 404) {
              await response.body?.cancel();
              throw new Error(`${fullName}: registry HTTP 404; external package/bootstrap setup remains required. Absence does not establish publishing permission.`);
            }
            if (!response.ok) {
              await response.body?.cancel();
              throw new Error(`${fullName}: registry HTTP ${response.status}; not a missing-package fallback`);
            }
            const chunks = [];
            let size = 0;
            for await (const chunk of response.body) {
              size += chunk.byteLength;
              if (size > 1_048_576) throw new Error(`${fullName}: registry metadata exceeds 1 MiB`);
              chunks.push(chunk);
            }
            const metadata = JSON.parse(Buffer.concat(chunks).toString("utf8"));
            if (metadata.name !== fullName || !semver.valid(metadata.version)) throw new Error(`${fullName}: invalid registry metadata`);
            versions.push(metadata.version);
          }
          const next = semver.inc(versions.sort(semver.rcompare)[0], "patch");
          appendFileSync(process.env.GITHUB_OUTPUT, `next=${next}\n`);
          NODE
      - run: npm run build
        if: steps.queue-check.outputs.publish == 'true'
      - name: Verify Cloudflare Worker transport and resource lifecycle
        if: steps.queue-check.outputs.publish == 'true'
        run: npm run test:workers --workspace=@poe-code/safe-playwright-cloudflare
      - run: npx vitest run scripts/package-debug-maps.test.ts
          scripts/package-safe.test.ts scripts/root-optional-package.test.ts
          scripts/safe-bash-optional-build.test.ts
          scripts/safe-bash-optional-lifecycle.test.ts
          scripts/verify-safe-publication.test.ts
          scripts/safe-command-publication.test.ts
          scripts/bundle-safe-bash-private.test.ts
        if: steps.queue-check.outputs.publish == 'true'
      - run: npm run lint:packages
        if: steps.queue-check.outputs.publish == 'true'
      - name: Prepare scoped artifacts
        if: steps.queue-check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: node scripts/package-safe.mjs --out-dir "$RUNNER_TEMP/safe-npm" --version
          "$VERSION"
      - name: Verify installed tarballs
        if: steps.queue-check.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TARBALLS=$(mktemp -d)
          npm pack "$RUNNER_TEMP/safe-npm/safe-fs" --ignore-scripts --pack-destination "$TARBALLS"
          npm pack "$RUNNER_TEMP/safe-npm/safe-js" --ignore-scripts --pack-destination "$TARBALLS"
          npm pack "$RUNNER_TEMP/safe-npm/safe-bash" --ignore-scripts --pack-destination "$TARBALLS"
          OPTIONAL_CONSUMER=$(mktemp -d)
          cp scripts/fixtures/safe-packages-mixed-entry-runtime.mjs scripts/fixtures/safe-packages-optional.mjs scripts/fixtures/safe-packages-optional-no-yaml.mjs scripts/fixtures/safe-packages-optional-types.mts scripts/fixtures/safe-packages-opt-in.mjs scripts/fixtures/safe-packages-opt-in.d.mts "$OPTIONAL_CONSUMER/"
          cd "$OPTIONAL_CONSUMER"
          npm init --yes
          npm install --ignore-scripts --omit=optional --no-audit --no-fund "$TARBALLS"/poe-platform-safe-fs-*.tgz "$TARBALLS"/poe-platform-safe-bash-[0-9]*.tgz
          node safe-packages-optional-no-yaml.mjs
          bun safe-packages-optional-no-yaml.mjs
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --module NodeNext --moduleResolution NodeNext --target ES2023 --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" --types node safe-packages-optional-types.mts
          npm install --ignore-scripts --no-audit --no-fund --save-exact yaml@2.9.0
          SECOND_CONSUMER=$(mktemp -d)
          cd "$SECOND_CONSUMER"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund --save-exact "$TARBALLS"/poe-platform-safe-fs-*.tgz "$TARBALLS"/poe-platform-safe-bash-[0-9]*.tgz yaml@2.9.0
          cd "$OPTIONAL_CONSUMER"
          node safe-packages-optional.mjs "$SECOND_CONSUMER"
          bun safe-packages-optional.mjs "$SECOND_CONSUMER"
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --module NodeNext --moduleResolution NodeNext --target ES2023 --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" --types node safe-packages-optional-types.mts
          CONSUMER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE"/scripts/fixtures/safe-packages-* "$CONSUMER/"
          cd "$CONSUMER"
          npm init --yes
          npm install --workspaces=false --ignore-scripts --no-audit --no-fund "$TARBALLS"/poe-platform-safe-fs-*.tgz "$TARBALLS"/poe-platform-safe-js-*.tgz "$TARBALLS"/poe-platform-safe-bash-[0-9]*.tgz
          NODE_EXECUTABLE=$(command -v node)
          env -i PATH= HOME="$CONSUMER" "$NODE_EXECUTABLE" safe-packages-publication-boundary.mjs
          env -i PATH= HOME="$CONSUMER" "$NODE_EXECUTABLE" safe-packages-registration.mjs
          env -i PATH= HOME="$CONSUMER" "$NODE_EXECUTABLE" safe-packages-fold.mjs
          env -i PATH= HOME="$CONSUMER" "$NODE_EXECUTABLE" safe-packages-diff3.mjs
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --module NodeNext --moduleResolution NodeNext --target ES2023 --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" --types node safe-packages-private-command-types.mts safe-packages-registration-types.mts safe-packages-fold-types.mts safe-packages-diff3-types.mts
          for PROFILE in browser workerd; do
            "$GITHUB_WORKSPACE/node_modules/.bin/esbuild" safe-packages-publication-boundary.mjs --bundle --platform=browser --conditions="$PROFILE" --loader:.wasm=copy --format=cjs --outfile=private-realm.cjs
            env -i PATH= HOME="$CONSUMER" "$NODE_EXECUTABLE" --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { createContext, runInContext } from "node:vm";
          const loadWasm = specifier => {
            if (typeof specifier !== "string" || !specifier.startsWith("./") || specifier.slice(2).includes("/") || !specifier.endsWith(".wasm")) throw new Error("Unexpected runtime import: " + String(specifier));
            return new WebAssembly.Module(readFileSync(specifier));
          };
          const realm = createContext({ TextEncoder, TextDecoder, atob, btoa, Uint8Array, ArrayBuffer, TypeError, TransformStream, ReadableStream, WritableStream, AbortController, AbortSignal, setTimeout, clearTimeout, queueMicrotask, crypto: globalThis.crypto, performance, loadWasm });
          await runInContext(`(async (require) => { const module = { exports: {} }; ${readFileSync("private-realm.cjs", "utf8")}; await module.exports.verification; })(loadWasm)`, realm);
          NODE
          done
          node safe-packages-smoke.mjs
          bun safe-packages-smoke.mjs
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 safe-packages-types.mts
          "$GITHUB_WORKSPACE/node_modules/.bin/esbuild" safe-packages-browser.mjs --bundle --platform=browser --format=esm --outfile=browser.mjs
          node browser.mjs
          npm install --ignore-scripts --no-audit --no-fund poe-code@14.0.4
          node safe-packages-legacy.mjs
          FS_ONLY=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/scripts/fixtures/safe-packages-fs-only.mjs" "$FS_ONLY/"
          cd "$FS_ONLY"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$TARBALLS"/poe-platform-safe-fs-*.tgz
          node safe-packages-fs-only.mjs
          bun safe-packages-fs-only.mjs
          CLOUDFLARE_CONSUMER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/scripts/fixtures/safe-packages-cloudflare-types.mts" "$CLOUDFLARE_CONSUMER/"
          cd "$CLOUDFLARE_CONSUMER"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund --save-exact "$TARBALLS"/poe-platform-safe-fs-*.tgz "$TARBALLS"/poe-platform-safe-bash-[0-9]*.tgz @cloudflare/playwright@1.3.6 @cloudflare/workers-types@4.20260415.1
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --strict --skipLibCheck --exactOptionalPropertyTypes --noUncheckedIndexedAccess --module ESNext --moduleResolution Bundler --target ES2024 --types node,@cloudflare/workers-types safe-packages-cloudflare-types.mts
          cd "$GITHUB_WORKSPACE"
          node scripts/verify-safe-cloudflare.mjs "$CLOUDFLARE_CONSUMER"
      - name: Publish SafeFS with provenance
        if: steps.queue-check.outputs.publish == 'true'
        run: npm publish "$RUNNER_TEMP/safe-npm/safe-fs" --provenance --access public
      - name: Publish SafeJS with provenance
        if: steps.queue-check.outputs.publish == 'true'
        run: npm publish "$RUNNER_TEMP/safe-npm/safe-js" --provenance --access public
      - name: Publish Safe Bash with provenance
        if: steps.queue-check.outputs.publish == 'true'
        run: npm publish "$RUNNER_TEMP/safe-npm/safe-bash" --provenance --access public
      - name: Record safe-publication ref
        if: steps.queue-check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin "$GITHUB_SHA:refs/heads/safe-publication" --force-with-lease || true
  verify-publication:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the published versions
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          SOURCE: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-safe-publication.mjs --cloudflare --version "$VERSION" --source "$SOURCE" --source-ref "$SOURCE_REF"
          printf 'Public archives downloaded and SHA-512 verified; provenance source matched; fresh npm resolution/install and Node imports (including explicit commands) passed for safe-fs, safe-js and safe-bash at %s from %s\n' "$VERSION" "$SOURCE" >> "$GITHUB_STEP_SUMMARY"
