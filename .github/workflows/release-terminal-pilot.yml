name: Release @poe-code/terminal-pilot
on:
  push:
    branches:
      - main
    paths:
      - 'packages/terminal-pilot/**'
concurrency:
  group: release-terminal-pilot
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Install dependencies
        run: npm clean-install
      - name: Build workspace dependency
        working-directory: packages/tiny-stdio-mcp-server
        run: npm run build
      - name: Build
        working-directory: packages/terminal-pilot
        run: npm run build
      - name: Auto-bump patch version from npm
        working-directory: packages/terminal-pilot
        run: |
          REMOTE=$(npm view terminal-pilot version 2>/dev/null || echo "0.0.0")
          npm version --no-git-tag-version --allow-same-version "$REMOTE"
          npm version --no-git-tag-version patch
      - name: Publish
        working-directory: packages/terminal-pilot
        run: npm publish --provenance --access public
