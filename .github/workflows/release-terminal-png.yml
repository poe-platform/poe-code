name: Release terminal-png + terminal-png-mcp
on:
  push:
    branches:
      - main
    paths:
      - 'packages/terminal-png/**'
      - 'packages/terminal-png-mcp/**'
concurrency:
  group: release-terminal-png
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Install dependencies
        run: npm clean-install
      - name: Build tiny-stdio-mcp-server
        working-directory: packages/tiny-stdio-mcp-server
        run: npm run build
      - name: Build terminal-png
        working-directory: packages/terminal-png
        run: npm run build
      - name: Build terminal-png-mcp
        working-directory: packages/terminal-png-mcp
        run: npm run build
      - name: Compute next version
        id: version
        run: |
          REMOTE=$(npm view terminal-png version 2>/dev/null || echo "0.0.0")
          cd packages/terminal-png
          npm version --no-git-tag-version --allow-same-version "${REMOTE}"
          npm version --no-git-tag-version patch
          NEXT=$(node -e "console.log(require('./package.json').version)")
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
      - name: Set terminal-png-mcp version
        working-directory: packages/terminal-png-mcp
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.version.outputs.next }}"
      - name: Publish terminal-png
        working-directory: packages/terminal-png
        run: npm publish --provenance --access public
      - name: Publish terminal-png-mcp
        working-directory: packages/terminal-png-mcp
        run: npm publish --provenance --access public
