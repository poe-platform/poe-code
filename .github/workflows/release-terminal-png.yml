name: Release terminal-png + terminal-png-mcp
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/terminal-png/**"
      - "packages/terminal-png-mcp/**"
concurrency:
  group: release-terminal-png
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Install dependencies
        run: npm clean-install
      - name: Build tiny-stdio-mcp-server
        working-directory: packages/tiny-stdio-mcp-server
        run: npm run build
      - name: Build terminal-png
        working-directory: packages/terminal-png
        run: npm run build
      - name: Build terminal-png-mcp
        working-directory: packages/terminal-png-mcp
        run: npm run build
      - name: Compute next version
        id: version
        run: |
          REMOTE=$(npm view terminal-png version 2>/dev/null || echo "0.0.0")
          NEXT=$(node -e "const semver = require('semver'); const next = semver.inc(process.argv[1], 'patch'); if (!next) process.exit(1); console.log(next);" "${REMOTE}")
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
      - name: Prepare lockstep package versions
        uses: ./.github/actions/prepare-lockstep-release
        with:
          version: ${{ steps.version.outputs.next }}
          packages: '["packages/terminal-png", "packages/terminal-png-mcp"]'
      - name: Publish terminal-png
        working-directory: packages/terminal-png
        run: npm publish --provenance --access public
      - name: Publish terminal-png-mcp
        working-directory: packages/terminal-png-mcp
        run: npm publish --provenance --access public
