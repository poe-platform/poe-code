name: Release Tesseract
on:
  push:
    branches: [main]
    paths:
      - packages/tesseract-rust/**
      - .github/workflows/release-tesseract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-tesseract
  queue: single
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tesseract-rust/bindings
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace=@poe-platform/tesseract
      - run: npm run test:unit --workspace=@poe-platform/tesseract
      - run: node packages/tesseract-rust/scripts/package.mjs native
      - uses: actions/upload-artifact@v4
        with:
          name: tesseract-${{ matrix.platform }}
          path: out/tesseract-release/${{ matrix.platform }}
      - if: matrix.platform == 'linux-x64'
        run: node packages/tesseract-rust/scripts/package.mjs js
      - if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-js
          path: out/tesseract-release/js
  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: tesseract-*
          path: out/tesseract-release
      - name: Publish native packages, then bindings and CLIs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 js; do
            directory="out/tesseract-release/tesseract-$platform"
            package=$(node -p "const p=require('./$directory/package.json'); p.name+'@'+p.version")
            if npm view "$package" version >/dev/null 2>&1; then
              echo "$package is already published"
            else
              npm publish "./$directory" --provenance --access public
            fi
          done
      - name: Verify fresh public install and both CLIs
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/tesseract-rust/package.json').version")
          mkdir -p out/tesseract-consumer
          cd out/tesseract-consumer
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "@poe-platform/tesseract@$version"
          npx --no-install tesseract ../../packages/tesseract-rust/tests/fixtures/english.png stdout > text.txt
          grep -q 'HELLO WORLD' text.txt
          npx --no-install ocrmypdf ../../packages/tesseract-rust/tests/fixtures/scanned.pdf searchable.pdf --sidecar pdf.txt
          grep -q 'HELLO WORLD' pdf.txt
          printf 'Published and verified @poe-platform/tesseract@%s from %s\n' "$version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
