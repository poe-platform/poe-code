name: Release tiny-stdio-mcp-test-server
on:
  push:
    branches:
      - main
    paths:
      - 'packages/tiny-stdio-mcp-test-server/**'
      - '.github/workflows/release-tiny-mcp-test.yml'
concurrency:
  group: release-tiny-mcp-test
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Check release tree admission
        id: release-admission
        uses: ./.github/actions/release-tree-admission
        with:
          paths: |
            packages/tiny-stdio-mcp-test-server
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Install dependencies
        run: npm clean-install
      - name: Build toolcraft-schema dependency
        run: npm run build --workspace toolcraft-schema
      - name: Build tiny-stdio-mcp-server dependency
        run: npm run build --workspace tiny-stdio-mcp-server
      - name: Build
        working-directory: packages/tiny-stdio-mcp-test-server
        run: npm run build
      - name: Auto-bump patch version from npm
        working-directory: packages/tiny-stdio-mcp-test-server
        run: |
          REMOTE=$(npm view tiny-stdio-mcp-test-server version 2>/dev/null || echo "0.0.0")
          npm version --no-git-tag-version "$REMOTE" --allow-same-version
          npm version --no-git-tag-version patch
      - name: Publish
        working-directory: packages/tiny-stdio-mcp-test-server
        run: npm publish --provenance --access public
        if: steps.release-admission.outputs.publish == 'true'
