name: Release tiny-stdio-mcp-test-server
on:
  push:
    branches:
      - main
    paths:
      - 'packages/tiny-stdio-mcp-test-server/**'
concurrency:
  group: release-tiny-mcp-test
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Prepare Bun for publishing
        run: bun upgrade
      - name: Install dependencies
        working-directory: packages/tiny-stdio-mcp-test-server
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        working-directory: packages/tiny-stdio-mcp-test-server
        run: bun run build
      - name: Auto-bump patch version from registry
        working-directory: packages/tiny-stdio-mcp-test-server
        run: |
          REMOTE=$(bun info tiny-stdio-mcp-test-server version 2>/dev/null || echo "0.0.0")
          bun pm version "$REMOTE"
          bun pm version patch
      - name: Publish
        working-directory: packages/tiny-stdio-mcp-test-server
        run: bun publish --access public
