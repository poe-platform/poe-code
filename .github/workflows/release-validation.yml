name: Release validation
on:
  workflow_call:
    outputs:
      archive-sha256:
        description: Digest of the same-run build archive
        value: ${{ jobs.build.outputs.archive-sha256 }}
      superseded:
        description: Whether this push was superseded by a newer commit on origin/main
        value: ${{ jobs.build.outputs.superseded }}
    inputs:
      build_only:
        type: boolean
        default: false
      cold_cache:
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
      superseded: ${{ steps.post-build-queue-check.outputs.superseded || steps.queue-check.outputs.superseded }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
      - name: Check release queue position
        id: queue-check
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            git fetch origin main --depth=1
            remote_main=$(git rev-parse origin/main)
            if [ "$remote_main" != "$GITHUB_SHA" ]; then
              echo "::notice::Queued validation $GITHUB_SHA superseded by newer commit on origin/main ($remote_main); coalescing into newer queued release."
              echo "Queued validation $GITHUB_SHA superseded by newer commit on origin/main ($remote_main); coalescing into newer queued release." >> "$GITHUB_STEP_SUMMARY"
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7.0.0
        if: steps.queue-check.outputs.superseded != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm clean-install
        if: steps.queue-check.outputs.superseded != 'true'
      - name: Restore workspace build cache
        id: build-cache
        if: steps.queue-check.outputs.superseded != 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .turbo/ci-cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-v1-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-build-v1-${{ hashFiles('package-lock.json') }}-
      - name: Build workspace and CLI outputs
        if: steps.queue-check.outputs.superseded != 'true'
        env:
          POE_CHECK_CACHE_DIR: .turbo/ci-cache/checks-v1
        run: npm run build
      - name: Save workspace build cache
        if: always() && steps.queue-check.outputs.superseded != 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .turbo/ci-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Re-check release queue position after build
        if: steps.queue-check.outputs.superseded != 'true'
        id: post-build-queue-check
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            git fetch origin main --depth=1
            remote_main=$(git rev-parse origin/main)
            if [ "$remote_main" != "$GITHUB_SHA" ]; then
              echo "::notice::Validation $GITHUB_SHA superseded during build by newer commit on origin/main ($remote_main); saving build cache and coalescing into newer queued release."
              echo "Validation $GITHUB_SHA superseded during build by newer commit on origin/main ($remote_main); saving build cache and coalescing into newer queued release." >> "$GITHUB_STEP_SUMMARY"
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
      - name: Archive fresh build outputs
        if: steps.queue-check.outputs.superseded != 'true' && steps.post-build-queue-check.outputs.superseded != 'true'
        id: archive
        run: |
          extra=(); [ -f packages/safe-bash-command-git/src/wasm.generated.ts ] && extra+=(packages/safe-bash-command-git/src/wasm.generated.ts); tar -cf "$RUNNER_TEMP/build.tar" dist packages/*/dist packages/safe-js/src/intl-data/dist "${extra[@]}"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/build.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        if: steps.queue-check.outputs.superseded != 'true' && steps.post-build-queue-check.outputs.superseded != 'true'
        with:
          name: build-${{ github.sha }}
          path: ${{ runner.temp }}/build.tar
          compression-level: 6
          retention-days: 1
  checks:
    if: ${{ !inputs.build_only && needs.build.outputs.superseded != 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm clean-install
      - name: Download freshly verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "build-$GITHUB_SHA" --dir "$RUNNER_TEMP/poe-build"
      - name: Restore freshly verified build
        env:
          BUILD_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          printf '%s  %s\n' "$BUILD_SHA256" "$RUNNER_TEMP/poe-build/build.tar" | sha256sum --check --status
          tar -xf "$RUNNER_TEMP/poe-build/build.tar"
      - name: Smoke-test freshly built packed CLI
        run: npm run smoke -- --prebuilt
      - run: npm run lint:packages
  audit:
    if: ${{ !inputs.build_only && needs.build.outputs.superseded != 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm clean-install
      - run: npm audit signatures
      - name: Run required lint stress tests
        run: npm run test:stress:lint
        timeout-minutes: 7
  unit:
    if: ${{ !inputs.build_only && needs.build.outputs.superseded != 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TURBO_TELEMETRY_DISABLED: "1"
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm clean-install
      - name: Download freshly verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "build-$GITHUB_SHA" --dir "$RUNNER_TEMP/poe-build"
      - name: Restore freshly verified build
        env:
          BUILD_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          printf '%s  %s\n' "$BUILD_SHA256" "$RUNNER_TEMP/poe-build/build.tar" | sha256sum --check --status
          tar -xf "$RUNNER_TEMP/poe-build/build.tar"
          npm --workspace=safe-bash-contracts run build
      - name: Install Zsh for native completion tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          test -x /bin/zsh
      - name: Identify cache runtime
        run: node -e 'console.log("POE_CI_RUNTIME=" + JSON.stringify({versions:process.versions,platform:process.platform,arch:process.arch,image:process.env.ImageOS,imageVersion:process.env.ImageVersion}))' >> "$GITHUB_ENV"
      - name: Restore eligible unit task cache
        id: unit-fresh-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .turbo/ci-cache
          key: ${{ runner.os }}-${{ runner.arch }}-unit-fresh-v1-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-unit-fresh-v1-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-${{ runner.arch }}-unit-v1-${{ hashFiles('package-lock.json') }}-
      - name: Run fresh unit and native checks
        env:
          POE_CHECK_CACHE_DIR: .turbo/ci-cache/checks-v1
          TURBO_FORCE: ${{ inputs.cold_cache && 'true' || 'false' }}
        run: npm run test:ci:fresh
      - name: Save eligible unit task cache
        if: always() && steps.unit-fresh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .turbo/ci-cache
          key: ${{ steps.unit-fresh-cache.outputs.cache-primary-key }}
  unit-cached:
    if: ${{ !inputs.build_only && needs.build.outputs.superseded != 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TURBO_TELEMETRY_DISABLED: "1"
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm clean-install
      - name: Download freshly verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "build-$GITHUB_SHA" --dir "$RUNNER_TEMP/poe-build"
      - name: Restore freshly verified build
        env:
          BUILD_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          printf '%s  %s\n' "$BUILD_SHA256" "$RUNNER_TEMP/poe-build/build.tar" | sha256sum --check --status
          tar -xf "$RUNNER_TEMP/poe-build/build.tar"
          npm --workspace=safe-bash-contracts run build
      - name: Identify cache runtime
        run: node -e 'console.log("POE_CI_RUNTIME=" + JSON.stringify({versions:process.versions,platform:process.platform,arch:process.arch,image:process.env.ImageOS,imageVersion:process.env.ImageVersion}))' >> "$GITHUB_ENV"
      - name: Restore eligible unit task cache
        id: unit-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .turbo/ci-cache
          key: ${{ runner.os }}-${{ runner.arch }}-unit-v1-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-unit-v1-${{ hashFiles('package-lock.json') }}-
      - name: Run cache-eligible unit checks
        env:
          POE_CHECK_CACHE_DIR: .turbo/ci-cache/checks-v1
          TURBO_FORCE: ${{ inputs.cold_cache && 'true' || 'false' }}
        run: npm exec -- turbo run test:ci:cached --filter=// --cache-dir=.turbo/ci-cache --cache=local:rw --output-logs=new-only --summarize
      - name: Save eligible unit task cache
        if: always() && steps.unit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .turbo/ci-cache
          key: ${{ steps.unit-cache.outputs.cache-primary-key }}
  bash:
    if: ${{ !inputs.build_only && needs.build.outputs.superseded != 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      SAFE_BASH_TEST_SHARD: ${{ matrix.shard }}/4
      SAFE_BASH_TEST_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm clean-install
      - name: Download freshly verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "build-$GITHUB_SHA" --dir "$RUNNER_TEMP/poe-build"
      - name: Restore freshly verified build
        env:
          BUILD_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          printf '%s  %s\n' "$BUILD_SHA256" "$RUNNER_TEMP/poe-build/build.tar" | sha256sum --check --status
          tar -xf "$RUNNER_TEMP/poe-build/build.tar"
          npm --workspace=safe-bash-contracts run build
      - uses: ./.github/actions/setup-bash-oracle
      - name: Identify cache runtime
        run: node -e 'console.log("POE_CI_RUNTIME=" + JSON.stringify({versions:process.versions,platform:process.platform,arch:process.arch,image:process.env.ImageOS,imageVersion:process.env.ImageVersion}))' >> "$GITHUB_ENV"
      - name: Restore Bash shard cache
        id: bash-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .turbo/ci-cache
          key: ${{ runner.os }}-${{ runner.arch }}-bash-shard-${{ matrix.shard }}-v1-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bash-shard-${{ matrix.shard }}-v1-${{ hashFiles('package-lock.json') }}-
      - name: Run balanced Bash shard
        env:
          POE_CHECK_CACHE_DIR: .turbo/ci-cache/checks-v1
          TURBO_FORCE: ${{ inputs.cold_cache && 'true' || 'false' }}
        run: node scripts/run-ci-bash-shard.mjs
      - name: Save Bash shard cache
        if: always() && steps.bash-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .turbo/ci-cache
          key: ${{ steps.bash-cache.outputs.cache-primary-key }}
