name: Release
# Note: workflow_dispatch is needed because pushes made with GitHub App tokens
# don't trigger other workflows (to prevent infinite loops). Workflows like
# bump-version uses `gh workflow run` to trigger this.
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm clean-install
      - run: npm run build
      - run: npm audit signatures
      - run: npm run lint:packages
      - run: npx turbo run test:unit --concurrency=4 --force
      - run: npm run smoke
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.POE_CODE_AGENT_APP_ID }}
          private-key: ${{ secrets.POE_CODE_AGENT_PRIVATE_KEY }}
      - name: Release Stable
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HUSKY: "0"
        run: npx semantic-release
