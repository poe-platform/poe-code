name: Release
# Note: workflow_dispatch is needed because pushes made with GitHub App tokens
# don't trigger other workflows (to prevent infinite loops). Workflows like
# bump-version uses `gh workflow run` to trigger this.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      qualification:
        description: Explicit native qualification; none runs the normal release
        type: choice
        required: true
        default: none
        options:
          - none
          - darwin-native-metadata
          - darwin-gnu-build
          - linux-native-diagnostic
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release-stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm clean-install
      - run: npm run build
      - run: npm audit signatures
      - run: npm run lint:packages
      - name: Provision virtual-bash native test inputs
        id: virtual_bash_inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node_bin="$(command -v node)"
          [[ "$RUNNER_TEMP" = /* && "$node_bin" = /* ]]
          node_dir="$(dirname "$node_bin")"
          "$node_bin" --input-type=module <<'LINUX_GIT_IDENTITY'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { lstatSync, readFileSync, realpathSync, statSync } from "node:fs";
          import { arch, platform, release } from "node:os";
          assert.equal(platform(), "linux");
          function execute(args) {
            const result = spawnSync("/usr/bin/git", args, {
              encoding: "utf8", shell: false, timeout: 5000, maxBuffer: 65536,
              env: { PATH: "/usr/bin:/bin", LC_ALL: "C", LANG: "C" }
            });
            assert.ifError(result.error);
            assert.equal(result.signal, null);
            assert.equal(result.status, 0, result.stderr);
            return result.stdout.trim();
          }
          const path = "/usr/bin/git";
          const canonicalPath = realpathSync(path);
          const before = statSync(canonicalPath, { bigint: true });
          assert(before.isFile() && before.size > 0n && before.size <= 33554432n);
          const sha256 = createHash("sha256").update(readFileSync(canonicalPath)).digest("hex");
          const after = statSync(canonicalPath, { bigint: true });
          for (const field of ["dev", "ino", "mode", "size", "mtimeNs", "ctimeNs"])
            assert.equal(after[field], before[field], "Git changed during observation");
          const gitCorePath = execute(["--exec-path"]);
          assert(gitCorePath.startsWith("/") && !gitCorePath.includes("\n") && !gitCorePath.includes("\r"));
          const gitCoreCanonicalPath = realpathSync(gitCorePath);
          assert(statSync(gitCoreCanonicalPath).isDirectory());
          console.log("LINUX_GIT_IDENTITY " + JSON.stringify({
            status: "OBSERVED_UNREVIEWED", sourceSha: execute(["rev-parse", "HEAD"]),
            triggeringSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion,
            host: { platform: platform(), arch: arch(), release: release() },
            path, canonicalPath, regularFile: true, symbolicLink: lstatSync(path).isSymbolicLink(),
            size: Number(before.size), mode: Number(before.mode), sha256, version: execute(["--version"]),
            gitCore: { path: gitCorePath, canonicalPath: gitCoreCanonicalPath,
              symbolicLink: lstatSync(gitCorePath).isSymbolicLink(), directory: true }
          }));
          LINUX_GIT_IDENTITY
          job_root="$(mktemp -d "${RUNNER_TEMP:?}/virtual-bash-inputs.XXXXXX")"
          printf 'root=%s\n' "$job_root" >> "$GITHUB_OUTPUT"
          mkdir -m 700 "$job_root/home" "$job_root/tmp" "$job_root/sources"
          env -i PATH="$node_dir:/usr/bin:/bin" HOME="$job_root/home" TMPDIR="$job_root/tmp" LC_ALL=C LANG=C TZ=UTC \
            "$node_bin" packages/safe-bash/scripts/provision-test-inputs.mjs \
            --parent "$job_root/sources" --source-mode gzip --stage-metadata
          env -i PATH="$node_dir:/usr/bin:/bin" HOME="$job_root/home" TMPDIR="$job_root/tmp" LC_ALL=C LANG=C TZ=UTC \
            "$node_bin" packages/safe-bash/scripts/provision-test-rg.mjs --destination "$job_root/rg"
          env -i PATH="$node_dir:/usr/bin:/bin" HOME="$job_root/home" TMPDIR="$job_root/tmp" LC_ALL=C LANG=C TZ=UTC \
            "$node_bin" packages/safe-bash/scripts/provision-test-native-oracles.mjs \
            --parent "$job_root" --destination "$GITHUB_WORKSPACE/packages/safe-bash/tmp/native-gnu"
          printf 'rg=%s\n' "$job_root/rg/bin/rg" >> "$GITHUB_OUTPUT"
      - name: Retain failed Linux native build inputs
        if: ${{ failure() && steps.virtual_bash_inputs.outcome == 'failure' && steps.virtual_bash_inputs.outputs.root != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-build-failure-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ steps.virtual_bash_inputs.outputs.root }}/native-build/failure.json
            ${{ steps.virtual_bash_inputs.outputs.root }}/native-build/logs/*.json
            ${{ steps.virtual_bash_inputs.outputs.root }}/native-build/logs/*.log
            ${{ steps.virtual_bash_inputs.outputs.root }}/native-build/sources/patch-2.8/config.log
            ${{ steps.virtual_bash_inputs.outputs.root }}/native-build/sources/patch-2.8/config.status
            ${{ steps.virtual_bash_inputs.outputs.root }}/native-build/sources/patch-2.8/src/patch
      - run: npm test -- --concurrency=1
        env:
          SAFE_BASH_TEST_RG: ${{ steps.virtual_bash_inputs.outputs.rg }}
          SAFE_BASH_NATIVE_LANE: linux
      - run: npm run smoke
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.POE_CODE_AGENT_APP_ID }}
          private-key: ${{ secrets.POE_CODE_AGENT_PRIVATE_KEY }}
      - name: Release Stable
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HUSKY: "0"
        run: npx semantic-release
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.qualification != 'darwin-native-metadata' && inputs.qualification != 'darwin-gnu-build' && inputs.qualification != 'linux-native-diagnostic') }}
    needs:
      - native-darwin
  darwin-native-metadata:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification == 'darwin-native-metadata' }}
    runs-on: macos-26
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Collect unreviewed hosted Darwin native identities
        shell: bash
        run: |
          node --input-type=module <<'DARWIN_NATIVE_METADATA'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { lstatSync, readFileSync, realpathSync, statSync } from "node:fs";
          import { arch, platform, release } from "node:os";

          for (const [name, expected] of Object.entries({
            GITHUB_REPOSITORY: "poe-platform/poe-code",
            GITHUB_REF: "refs/heads/main",
            GITHUB_EVENT_NAME: "workflow_dispatch",
            RUNNER_ENVIRONMENT: "github-hosted",
            RUNNER_OS: "macOS",
            RUNNER_ARCH: "ARM64"
          })) assert.equal(process.env[name], expected, `Unexpected ${name}`);
          assert.equal(platform(), "darwin");
          assert.equal(arch(), "arm64");

          function execute(executable, args) {
            const result = spawnSync(executable, args, {
              encoding: "utf8",
              shell: false,
              timeout: 5000,
              killSignal: "SIGKILL",
              maxBuffer: 65536,
              env: { PATH: "/usr/bin:/bin:/usr/sbin:/sbin", LANG: "C", LC_ALL: "C" }
            });
            return {
              executable, args, status: result.status, signal: result.signal,
              error: result.error?.message ?? null,
              stdout: result.stdout ?? "", stderr: result.stderr ?? ""
            };
          }

          function executableIdentity(executable, historicalSha256 = null) {
            const canonicalPath = realpathSync(executable);
            const entry = lstatSync(executable);
            const before = statSync(canonicalPath, { bigint: true });
            assert(before.isFile() && before.size > 0n && before.size <= 33554432n);
            const sha256 = createHash("sha256").update(readFileSync(canonicalPath)).digest("hex");
            const after = statSync(canonicalPath, { bigint: true });
            for (const field of ["dev", "ino", "mode", "size", "mtimeNs", "ctimeNs"])
              assert.equal(after[field], before[field], `Changed executable ${canonicalPath}`);
            return {
              path: executable, canonicalPath, symbolicLink: entry.isSymbolicLink(),
              size: Number(before.size), mode: Number(before.mode), sha256,
              historicalSha256,
              comparison: historicalSha256 === null ? "NO_HISTORICAL_PIN" :
                sha256 === historicalSha256 ? "MATCHES_HISTORICAL_PIN" : "DIFFERS_FROM_HISTORICAL_PIN",
              file: execute("/usr/bin/file", [canonicalPath]),
              version: execute(canonicalPath, ["--version"])
            };
          }

          const applePins = [
            ["/usr/bin/diff", "214a0d91e39424b15e1e3540edf6b33ee3dd2bbccb0c6dd3a9571dae754edede"],
            ["/usr/bin/patch", "ca8aaa5fa4bd9dfaf4b3be251b18372f25f07483946e7d06b505e5a5fb0a6a84"],
            ["/usr/bin/bsdtar", "bdccb76a715fbebc4915a1a1b1de0e7050ad842ebb730c47935b3a22c13e3af9"]
          ];
          const apple = applePins.map(([executable, historicalSha256]) => ({
            ...executableIdentity(executable, historicalSha256),
            codeSignature: execute("/usr/bin/codesign", ["--display", "--verbose=4", executable]),
            codeSignatureVerification: execute("/usr/bin/codesign", ["--verify", "--strict", "--verbose=2", executable])
          }));
          const gitResolution = execute("/usr/bin/xcrun", ["--find", "git"]);
          assert(!gitResolution.error && !gitResolution.signal && gitResolution.status === 0);
          const gitPath = gitResolution.stdout.trim();
          assert(gitPath.startsWith("/") && !gitPath.includes("\n") && !gitPath.includes("\r"));
          const gitEntry = lstatSync(gitPath);
          assert(gitEntry.isFile() && !gitEntry.isSymbolicLink() && (gitEntry.mode & 0o111) !== 0);
          const gitIdentity = executableIdentity(gitPath,
            "10f9c1df894525ae4c7454258febab6d3d25071062b42cb48dbb1842cdffd2a9");
          const gitExecPath = execute(gitIdentity.canonicalPath, ["--exec-path"]);
          assert(!gitExecPath.error && !gitExecPath.signal && gitExecPath.status === 0);
          const gitCorePath = gitExecPath.stdout.trim();
          assert(gitCorePath.startsWith("/") && !gitCorePath.includes("\n") && !gitCorePath.includes("\r"));
          const gitCoreCanonicalPath = realpathSync(gitCorePath);
          const gitCoreEntry = lstatSync(gitCorePath);
          const gitCore = statSync(gitCoreCanonicalPath);
          assert(gitCore.isDirectory());
          const git = {
            status: "OBSERVED_UNREVIEWED",
            resolution: gitResolution,
            ...gitIdentity,
            regularFile: true,
            execPath: gitExecPath,
            gitCore: {
              path: gitCorePath, canonicalPath: gitCoreCanonicalPath,
              symbolicLink: gitCoreEntry.isSymbolicLink(), directory: true,
              mode: gitCore.mode, size: gitCore.size
            },
            codeSignature: execute("/usr/bin/codesign", ["--display", "--verbose=4", gitIdentity.canonicalPath]),
            codeSignatureVerification: execute("/usr/bin/codesign", ["--verify", "--strict", "--verbose=2", gitIdentity.canonicalPath])
          };
          assert.equal(createHash("sha256").update(readFileSync(gitIdentity.canonicalPath)).digest("hex"), gitIdentity.sha256);
          const gnu = ["gtar", "gdiff", "gpatch", "gexpr", "gstat", "gtouch"].map(name => {
            const located = spawnSync("/bin/bash", ["--noprofile", "--norc", "-c", 'command -v "$1"', "native-metadata", name], {
              encoding: "utf8", shell: false, timeout: 3000, killSignal: "SIGKILL", maxBuffer: 4096,
              env: { PATH: process.env.PATH, LANG: "C", LC_ALL: "C" }
            });
            if (located.error || located.signal) throw located.error ?? new Error(`Lookup terminated: ${name}`);
            if (located.status !== 0) return { name, status: "ABSENT_NOT_QUALIFIED" };
            const executable = located.stdout.trim();
            assert(executable.startsWith("/") && !executable.includes("\n"));
            return { name, status: "OBSERVED_UNREVIEWED", ...executableIdentity(executable) };
          });
          const metadata = {
            status: "UNREVIEWED_PROFILE",
            meaning: "Read-only identity observations; no calibration, admission, product or release clearance",
            sourceSha: process.env.GITHUB_SHA,
            workflowRef: process.env.GITHUB_WORKFLOW_REF,
            runId: process.env.GITHUB_RUN_ID,
            imageOS: process.env.ImageOS ?? null,
            imageVersion: process.env.ImageVersion ?? null,
            officialImageReference: "actions/runner-images@abac76dc78cf571e72be5c0296c061ee7ae594fb",
            officialReferenceIsAssignedImageProof: false,
            historicalProfile: { osVersion: "26.4.1", buildVersion: "25E253", kernel: "25.4.0" },
            actual: {
              platform: platform(), architecture: arch(), kernel: release(), node: process.version,
              nodeExecutable: process.execPath,
              swVers: execute("/usr/bin/sw_vers", []),
              xcode: execute("/usr/bin/xcodebuild", ["-version"]),
              clang: execute("/usr/bin/xcrun", ["clang", "--version"])
            },
            apple, git, gnu
          };
          const output = JSON.stringify(metadata, null, 2);
          assert(Buffer.byteLength(output) <= 524288, "Metadata output bound exceeded");
          console.log("DARWIN_NATIVE_METADATA_BEGIN");
          console.log(output);
          console.log("DARWIN_NATIVE_METADATA_END");
          const required = [metadata.actual.swVers, metadata.actual.xcode, metadata.actual.clang,
            git.resolution, git.file, git.version, git.execPath, git.codeSignature, git.codeSignatureVerification,
            ...apple.flatMap(item => [item.file, item.version, item.codeSignature, item.codeSignatureVerification])];
          if (required.some(result => result.error || result.signal || result.status !== 0)) process.exitCode = 1;
          DARWIN_NATIVE_METADATA
  darwin-gnu-build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification == 'darwin-gnu-build' }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Build authenticated GNU observations without admission
        id: native_build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node_bin="$(command -v node)"
          [[ "$RUNNER_TEMP" = /* && "$node_bin" = /* ]]
          job_root="$(mktemp -d "${RUNNER_TEMP:?}/darwin-gnu.XXXXXX")"
          chmod 700 "$job_root"
          printf 'archive=%s\n' "$job_root/build/native-darwin-evidence.tar" >> "$GITHUB_OUTPUT"
          env -i PATH="$(dirname "$node_bin"):/usr/bin:/bin:/usr/sbin:/sbin" \
            HOME="$job_root" TMPDIR="$job_root" LC_ALL=C LANG=C TZ=UTC \
            RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_OUTPUT="$GITHUB_OUTPUT" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            "$node_bin" packages/safe-bash/scripts/provision-test-native-oracles.mjs \
            --qualify-darwin-build --parent "$job_root" --destination "$job_root/build"
      - name: Retain bounded qualification evidence
        if: ${{ always() && !cancelled() && steps.native_build.outputs.sealed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: darwin-gnu-${{ github.sha }}-${{ github.run_id }}
          path: |-
            ${{ steps.native_build.outputs.archive }}
            ${{ steps.native_build.outputs.archive }}.sha256
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          compression-level: 0
  native-darwin:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.qualification != 'darwin-native-metadata' && inputs.qualification != 'darwin-gnu-build' && inputs.qualification != 'linux-native-diagnostic') }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SKIP_SYNC_SKILLS: "1"
      TSX_DISABLE_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Isolate native lane lifecycle
        shell: bash
        run: |-
          set -euo pipefail
          umask 077
          job_root="$(mktemp -d "${RUNNER_TEMP:?}/native-darwin.XXXXXX")"
          job_root="$(cd "$job_root" && pwd -P)"
          mkdir -m 700 "$job_root/home" "$job_root/tmp" "$job_root/sources"
          printf 'NATIVE_JOB_ROOT=%s\nHOME=%s\nTMPDIR=%s\nnpm_config_cache=%s\n' "$job_root" "$job_root/home" "$job_root/tmp" "$job_root/cache" >> "$GITHUB_ENV"
      - run: npm clean-install
      - run: npm run build
      - name: Provision reviewed Darwin native prerequisites
        shell: bash
        run: |-
          set -euo pipefail
          umask 077
          node_bin="$(command -v node)"
          env -i PATH="$(dirname "$node_bin"):/usr/bin:/bin" HOME="$HOME" TMPDIR="$TMPDIR" LC_ALL=C LANG=C TZ=UTC \
            "$node_bin" packages/safe-bash/scripts/provision-test-inputs.mjs \
            --parent "$NATIVE_JOB_ROOT/sources" --source-mode gzip --stage-metadata
          env -i PATH="$(dirname "$node_bin"):/usr/bin:/bin:/usr/sbin:/sbin" \
            HOME="$HOME" TMPDIR="$TMPDIR" LC_ALL=C LANG=C TZ=UTC \
            RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            "$node_bin" packages/safe-bash/scripts/provision-test-native-oracles.mjs \
            --stage-darwin --parent "$NATIVE_JOB_ROOT" --destination "$GITHUB_WORKSPACE/packages/safe-bash/tmp/native-gnu"
      - name: Run required Darwin native semantic cohort
        run: npm run test:unit --workspace=virtual-bash
        env:
          SAFE_BASH_NATIVE_LANE: darwin
          ARCHIVE_LONG_LINK_NATIVE: "1"

  linux-native-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification == 'linux-native-diagnostic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Guard source and collect read-only Linux observations
        id: diagnostic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" = "poe-platform/poe-code" && "$GITHUB_REF" = "refs/heads/main" && "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]]
          [[ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]]
          root="${RUNNER_TEMP:?}/poe-native-diagnostic"
          mkdir -m 700 "$root" "$root/evidence" "$root/home" "$root/tmp" "$root/npm-cache"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'METADATA'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          const root = path.join(process.env.RUNNER_TEMP, 'poe-native-diagnostic', 'evidence');
          const execute = (command, args) => {
            const result = spawnSync(command, args, { encoding: 'utf8', shell: false, timeout: 10000, killSignal: 'SIGKILL', maxBuffer: 1024 * 1024, env: { PATH: '/usr/bin:/bin', HOME: path.dirname(root) + '/home', LANG: 'C', LC_ALL: 'C' } });
            return { command, args, status: result.status, signal: result.signal, error: result.error?.message, stdout: result.stdout, stderr: result.stderr };
          };
          const read = file => { try { return fs.readFileSync(file, 'utf8'); } catch (error) { return { unavailable: error.code }; } };
          const sha = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'x64');
          assert(process.version.startsWith('v22.'));
          const files = ['scripts/lint-eslint.test.ts', 'scripts/lint-input-guard.mjs', 'vitest.config.ts', 'package-lock.json'];
          const source = Object.fromEntries(files.map(file => [file, sha(file)]));
          assert.equal(source['scripts/lint-eslint.test.ts'], '534538808adb6641fb7ae821e97972c11fc5e55e52d376b4e4de191022e751d1');
          assert.equal(source['scripts/lint-input-guard.mjs'], 'b8d773efdb987b08b93e81dc5d31bec1cebb443f7029715a0cb130734a5ca286');
          fs.writeFileSync(path.join(root, 'source-before.json'), JSON.stringify(source, null, 2));
          const observations = { purpose: 'DIAGNOSTIC_NOT_RELEASE_ACCEPTANCE', sha: process.env.GITHUB_SHA, node: process.version, arch: process.arch, parallelism: os.availableParallelism(), os: read('/etc/os-release'), cpuMax: read('/sys/fs/cgroup/cpu.max'), cpuStat: read('/sys/fs/cgroup/cpu.stat'), git: [] };
          for (const [command, args] of [
            ['/usr/bin/git', ['--version']], ['/usr/bin/git', ['--exec-path']],
            ['/usr/bin/dpkg-query', ['-S', '/usr/bin/git']],
            ['/usr/bin/dpkg-query', ['-W', '-f=${Package} ${Version} ${Architecture} ${Source}\n', 'git', 'git-man', 'ubuntu-keyring']],
            ['/usr/bin/apt-cache', ['policy', 'git']], ['/usr/bin/apt-cache', ['show', 'git']],
          ]) observations.git.push(execute(command, args));
          try {
            const canonical = fs.realpathSync('/usr/bin/git'), stat = fs.lstatSync('/usr/bin/git');
            const execution = execute('/usr/bin/git', ['--exec-path']);
            const execPath = execution.status === 0 ? execution.stdout.trim() : null;
            const core = execPath ? fs.lstatSync(execPath) : null;
            observations.gitIdentity = { path: '/usr/bin/git', canonical, regular: stat.isFile(), symlink: stat.isSymbolicLink(), size: stat.size, mode: stat.mode & 511, sha256: sha(canonical), execPath, canonicalExecPath: execPath ? fs.realpathSync(execPath) : null, execPathDirectory: core?.isDirectory(), execPathSymlink: core?.isSymbolicLink(), status: 'OBSERVATION_NOT_ADMISSION' };
          } catch (error) { observations.gitIdentity = { unavailable: error.code }; }
          const authorities = [
            '/var/lib/apt/lists/archive.ubuntu.com_ubuntu_dists_noble_InRelease',
            '/var/lib/apt/lists/archive.ubuntu.com_ubuntu_dists_noble-updates_InRelease',
            '/var/lib/apt/lists/security.ubuntu.com_ubuntu_dists_noble-security_InRelease',
          ];
          observations.distributionSignatures = authorities.map(file => {
            if (!fs.existsSync(file)) return { file, unavailable: true };
            const stat = fs.lstatSync(file); assert(stat.isFile() && !stat.isSymbolicLink() && stat.size <= 1024 * 1024);
            fs.copyFileSync(file, path.join(root, path.basename(file)));
            const signature = execute('/usr/bin/gpgv', ['--status-fd', '1', '--keyring', '/usr/share/keyrings/ubuntu-archive-keyring.gpg', file]);
            const prefix = file.slice(0, -'InRelease'.length) + 'main_binary-amd64_Packages';
            const indexPath = [prefix, prefix + '.lz4'].find(candidate => fs.existsSync(candidate));
            if (!indexPath) return { signature, indexUnavailable: true };
            const indexStat = fs.lstatSync(indexPath);
            assert(indexStat.isFile() && !indexStat.isSymbolicLink() && indexStat.size <= 16 * 1024 * 1024);
            const result = spawnSync('/usr/lib/apt/apt-helper', ['cat-file', indexPath], { shell: false, timeout: 10000, killSignal: 'SIGKILL', maxBuffer: 16 * 1024 * 1024, env: { PATH: '/usr/bin:/bin', LANG: 'C', LC_ALL: 'C' } });
            if (result.error || result.status !== 0 || result.signal !== null) return { signature, indexError: result.error?.message, status: result.status, signal: result.signal };
            const section = fs.readFileSync(file, 'utf8').split('SHA256:\n')[1];
            const entry = section?.split('\n').find(line => line.trim().endsWith(' main/binary-amd64/Packages'))?.trim().split(' ').filter(Boolean);
            const indexSha256 = createHash('sha256').update(result.stdout).digest('hex');
            const signedIndexMatches = signature.status === 0 && signature.stdout.includes('[GNUPG:] VALIDSIG F6ECB3762474EDA9D21B7022871920D1991BC93C ') && entry?.[0] === indexSha256 && Number(entry?.[1]) === result.stdout.length;
            const records = result.stdout.toString().split('\n\n').filter(record => record.startsWith('Package: git\n'));
            fs.writeFileSync(path.join(root, path.basename(prefix)), result.stdout);
            return { signature, indexPath, indexSha256, indexSize: result.stdout.length, signedIndexMatches, records, status: 'DISTRIBUTION_RECORD_ONLY_NOT_INSTALLED_BINARY_ADMISSION' };
          });
          fs.writeFileSync(path.join(root, 'context-before.json'), JSON.stringify(observations, null, 2));
          console.log(JSON.stringify({ sha: observations.sha, node: observations.node, git: observations.gitIdentity, scope: observations.purpose }));
          METADATA
      - name: Install the unchanged locked dependency graph
        env:
          HOME: ${{ runner.temp }}/poe-native-diagnostic/home
          TMPDIR: ${{ runner.temp }}/poe-native-diagnostic/tmp
          NPM_CONFIG_PREFIX: ${{ github.workspace }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/poe-native-diagnostic/npm-cache
        run: npm clean-install --prefix "$GITHUB_WORKSPACE"
      - name: Profile the two unchanged configured fixture bodies
        shell: bash
        env:
          HOME: ${{ runner.temp }}/poe-native-diagnostic/home
          TMPDIR: ${{ runner.temp }}/poe-native-diagnostic/tmp
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP:?}/poe-native-diagnostic"
          titles=(
            'captures the actual metadata cap in inventory phase and clears a fresh initialization'
            'completes an owned mixed traversal under the authorized eight-million metadata cap'
          )
          index=0
          failed=0
          for title in "${titles[@]}"; do
            index=$((index + 1))
            output="$root/evidence/case-$index"
            mkdir -m 700 "$output"
            printf '%s\n' "$title" > "$output/title.txt"
            set +e
            timeout --signal=TERM --kill-after=10s 300s node --cpu-prof --cpu-prof-dir="$output" \
              node_modules/vitest/vitest.mjs run scripts/lint-eslint.test.ts -t "$title" \
              --reporter=json --outputFile="$output/result.json" > "$output/stdout.log" 2> "$output/stderr.log"
            code=$?
            set -e
            printf '%s\n' "$code" > "$output/exit-code.txt"
            if [[ "$code" -ne 0 ]]; then failed=1; fi
            printf 'Diagnostic case %s exit %s; not an ordinary release gate\n' "$index" "$code"
          done
          printf '%s\n' "$failed" > "$root/evidence/selected-tests-failed.txt"
          exit "$failed"
      - name: Seal source conservation and actual worker profiles
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'SEAL'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const root = path.join(process.env.RUNNER_TEMP, 'poe-native-diagnostic', 'evidence');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const before = JSON.parse(fs.readFileSync(path.join(root, 'source-before.json'), 'utf8'));
          const after = Object.fromEntries(Object.keys(before).map(file => [file, hash(fs.readFileSync(file))]));
          const sourceUnchanged = Object.keys(before).every(file => before[file] === after[file]);
          const resource = {};
          for (const file of ['/sys/fs/cgroup/cpu.max', '/sys/fs/cgroup/cpu.stat']) {
            try { resource[file] = fs.readFileSync(file, 'utf8'); } catch (error) { resource[file] = { unavailable: error.code }; }
          }
          fs.writeFileSync(path.join(root, 'source-after.json'), JSON.stringify(after, null, 2));
          fs.writeFileSync(path.join(root, 'context-after.json'), JSON.stringify(resource, null, 2));
          let size = 0;
          const files = [], frames = [];
          function visit(directory) {
            for (const name of fs.readdirSync(directory)) {
              const file = path.join(directory, name), stat = fs.lstatSync(file);
              assert(!stat.isSymbolicLink(), 'artifact symlink refused');
              if (stat.isDirectory()) { visit(file); continue; }
              assert(stat.isFile() && stat.size <= 32 * 1024 * 1024);
              assert(['.json', '.log', '.txt', '.cpuprofile'].includes(path.extname(name)) || name.endsWith('_InRelease') || name.endsWith('_Packages'));
              size += stat.size; assert(size <= 127 * 1024 * 1024 && files.length < 127);
              const bytes = fs.readFileSync(file);
              files.push({ path: path.relative(root, file), size: stat.size, sha256: hash(bytes) });
              if (name.endsWith('.cpuprofile')) {
                const profile = JSON.parse(bytes.toString());
                const matches = profile.nodes.filter(node => ['scripts/lint-eslint.test.ts', 'scripts/lint-input-guard.mjs'].some(suffix => node.callFrame.url.endsWith(suffix)));
                frames.push({ path: path.relative(root, file), matchingFrames: matches.map(node => node.callFrame), samples: profile.samples?.length ?? 0 });
              }
            }
          }
          visit(root);
          const manifest = JSON.stringify({ sha: process.env.GITHUB_SHA, size, files, frames, sourceUnchanged, scope: 'SELECTED_DIAGNOSTIC_NOT_RELEASE_GATE' }, null, 2);
          assert(Buffer.byteLength(manifest) <= 1024 * 1024);
          fs.writeFileSync(path.join(root, 'manifest.json'), manifest);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'bounded=true\n');
          assert(sourceUnchanged, 'diagnostic source changed');
          assert(frames.some(profile => profile.matchingFrames.some(frame => frame.url.endsWith('scripts/lint-input-guard.mjs'))), 'no actual guard worker profile; coordinator profile is insufficient');
          assert(frames.some(profile => profile.matchingFrames.some(frame => frame.url.endsWith('scripts/lint-eslint.test.ts'))), 'no actual test worker profile');
          SEAL
        id: seal
      - name: Retain bounded diagnostic evidence
        if: ${{ always() && steps.seal.outputs.bounded == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/poe-native-diagnostic/evidence
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
