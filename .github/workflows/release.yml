name: Release
# Note: workflow_dispatch is needed because pushes made with GitHub App tokens
# don't trigger other workflows (to prevent infinite loops). Workflows like
# bump-version uses `gh workflow run` to trigger this.
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm clean-install
      - run: npm run build
      - run: npm audit signatures
      - run: npm run lint:packages
      - name: Provision virtual-bash native test inputs
        id: virtual_bash_inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node_bin="$(command -v node)"
          [[ "$RUNNER_TEMP" = /* && "$node_bin" = /* ]]
          node_dir="$(dirname "$node_bin")"
          job_root="$(mktemp -d "${RUNNER_TEMP:?}/virtual-bash-inputs.XXXXXX")"
          mkdir -m 700 "$job_root/home" "$job_root/tmp" "$job_root/sources"
          env -i PATH="$node_dir:/usr/bin:/bin" HOME="$job_root/home" TMPDIR="$job_root/tmp" LC_ALL=C LANG=C TZ=UTC \
            "$node_bin" packages/safe-bash/scripts/provision-test-inputs.mjs \
            --parent "$job_root/sources" --source-mode gzip --stage-metadata
          env -i PATH="$node_dir:/usr/bin:/bin" HOME="$job_root/home" TMPDIR="$job_root/tmp" LC_ALL=C LANG=C TZ=UTC \
            "$node_bin" packages/safe-bash/scripts/provision-test-rg.mjs --destination "$job_root/rg"
          printf 'rg=%s\n' "$job_root/rg/bin/rg" >> "$GITHUB_OUTPUT"
      - run: npm test -- --concurrency=4
        env:
          SAFE_BASH_TEST_RG: ${{ steps.virtual_bash_inputs.outputs.rg }}
      - run: npm run smoke
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.POE_CODE_AGENT_APP_ID }}
          private-key: ${{ secrets.POE_CODE_AGENT_PRIVATE_KEY }}
      - name: Release Stable
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HUSKY: "0"
        run: npx semantic-release
