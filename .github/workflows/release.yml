name: Release
# Note: workflow_dispatch is needed because pushes made with GitHub App tokens
# don't trigger other workflows (to prevent infinite loops). Workflows like
# bump-version uses `gh workflow run` to trigger this.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Ignore restored Turbo results to measure cold test execution
        type: boolean
        default: false
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release-stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm clean-install
      - name: Download freshly verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "build-$GITHUB_SHA" --dir "$RUNNER_TEMP/poe-build"
      - name: Restore freshly verified build
        env:
          BUILD_SHA256: ${{ needs.validate.outputs.archive-sha256 }}
        run: |
          printf '%s  %s\n' "$BUILD_SHA256" "$RUNNER_TEMP/poe-build/build.tar" | sha256sum --check --status
          tar -xf "$RUNNER_TEMP/poe-build/build.tar"
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3.0.0
        with:
          app-id: ${{ secrets.POE_CODE_AGENT_APP_ID }}
          private-key: ${{ secrets.POE_CODE_AGENT_PRIVATE_KEY }}
      - name: Release Stable
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HUSKY: "0"
          NPM_CONFIG_LOGLEVEL: warn
          # The same-run build above was digest-verified and passed all gates.
          # Preserve it instead of rebuilding through npm's prepack lifecycle.
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm exec --no -- semantic-release
    needs:
      - validate
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
  validate:
    uses: ./.github/workflows/release-validation.yml
    permissions:
      actions: read
      contents: read
    with:
      cold_cache: ${{ inputs.cold_cache || false }}
    concurrency:
      group: release-validation-${{ github.ref }}
      cancel-in-progress: true
