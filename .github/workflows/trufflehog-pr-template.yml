name: TruffleHog PR Scan Template
on:
  workflow_call:
    inputs:
      trufflehog_image:
        required: false
        type: string
        default: ghcr.io/trufflesecurity/trufflehog:latest
      results:
        required: false
        type: string
        default: verified,unverified,unknown
      max_findings:
        required: false
        type: number
        default: 10
      helper_repository:
        required: false
        type: string
        default: poe-platform/poe-code
      helper_ref:
        required: false
        type: string
        default: main

jobs:
  trufflehog:
    name: TruffleHog Advisory Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Validate pull request context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error title=Unsupported event::This reusable workflow must be called from a pull_request workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout workflow helpers
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.helper_repository }}
          ref: ${{ inputs.helper_ref }}
          path: .trufflehog-pr-template
          persist-credentials: false

      - name: Scan for secrets
        id: trufflehog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULTS: ${{ inputs.results }}
          TRUFFLEHOG_IMAGE: ${{ inputs.trufflehog_image }}
        run: |
          bash .trufflehog-pr-template/.github/scripts/trufflehog-pr-scan.sh scan-for-secrets

      - name: Report advisory result
        if: ${{ steps.trufflehog.outputs.findings_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_FINDINGS: ${{ inputs.max_findings }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash .trufflehog-pr-template/.github/scripts/trufflehog-pr-scan.sh report-advisory-result

      - name: Clear stale advisory result
        if: ${{ steps.trufflehog.outputs.findings_count == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash .trufflehog-pr-template/.github/scripts/trufflehog-pr-scan.sh clear-stale-advisory-result

      - name: Mark advisory finding as failed
        if: ${{ steps.trufflehog.outputs.findings_count != '0' }}
        run: exit 1
