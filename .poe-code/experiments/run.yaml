# Edit this file to control the prompt sent to the agent each experiment iteration.
# Available variables:
#   {{body}}             — experiment doc body (markdown below the frontmatter)
#   {{journal}}          — formatted journal of prior attempts (TSV)
#   {{metrics}}          — metric definitions with direction and baseline scores
#   {{crash_output}}     — last crash stdout+stderr, or empty if no crash
#   {{experiment_index}} — current experiment number (1-based)
#   {{baseline}}         — current baseline scores as JSON, or empty
#
# The agent receives the result of replacing variables in the prompt template below.

prompt: |
  {{body}}

  ## Metrics

  {{metrics}}

  ## Journal

  {{journal}}

  {{crash_output}}

  You are autonomous, do not stop or ask for input.
  
  Do not write to the journal file or commit changes. 
  Both are managed automatically after your run completes.

  Make sure lint and tests pass
