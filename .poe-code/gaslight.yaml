prompt: "Implement"
followups:
  - "Is this best you can do? Look for messy design, missing edge cases, or unnecessary complexity and fix it."
  - "Be a user and test the real workflow end to end, not just the happy path."
  - "Make sure tests run, speed of tests is important, no excuses, it's your job to fix tests."
  - "Did you forget something? Check docs, exports, CLI/SDK parity, config, and issue state where relevant."
  - "Commit all changes."
  - "Push and wait for release to go green"
