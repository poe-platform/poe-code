      `AsyncIterable<AcpEvent>`.

      The event stream is a **public API** — the contract between the runtime and all
      consumers. It must be versioned and kept stable.

      Event ordering for a full run:
      ```
      message.delta* → tool.intent → tool.result → message.delta* → ... → session.complete
      ```
      - Zero or more `message.delta` per model response
      - `tool.intent`/`tool.result` pairs for each tool call
      - `progress` events can appear at any point
      - Exactly one terminal: `session.complete` or `session.error`

      The stream must be consumable via `for await...of` and must end after the terminal event.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "ACP event stream".
    status:
      implement: done
      refactor: done
      test: done

