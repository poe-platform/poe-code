  - id: acp-session-impl
    title: Implement .acp() execution mode
    prompt: |
      Add `.acp()` to `AgentBuilder`. This exposes the ACP core directly — the caller
      **is** the host. No built-in tool execution happens.

      ```ts
      type AcpSession = {
        events: AsyncIterable<AcpEvent>;
        acknowledge(intentId: string, result: ToolAckResult): void;
        dispose(): Promise<void>;
      };
      ```

      Every `tool.intent` event flows outward to the caller. The caller must call
      `acknowledge()` for each intent — the core suspends until acknowledged.

      Like `.run()` and `.stream()`, `.acp()` is async because plugin `setup()` runs
      before the model loop starts.

      `.acp()` is single-turn. For continuation, use `resume`:
      ```ts
      const session2 = await agent().use(memory()).acp("Now fix it", { resume: previousResult });
      ```

      This is what the provider uses — the host controls all side effects.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section ".acp()".
    status:
      implement: done
      refactor: done
      test: done

  - id: resume-support
    title: Implement resume for continuation across runs
    prompt: |
      Add `resume` option to all execution modes:

      ```ts
      type RunOptions = { signal?: AbortSignal; skills?: string[]; resume?: RunResult };
      ```

      Resume injects the previous run's message history into the prompt pipeline before
      the model loop starts. The runtime does not hold persistent state between runs —
      the caller owns the result and passes it back explicitly.

      This keeps runs stateless and composable while still supporting iterative workflows.
      It avoids the complexity of long-lived mutable sessions.

      ```ts
      const r1 = await agent().use(memory()).run("Read the test file");
      const r2 = await agent().use(memory()).run("Now fix it", { resume: r1 });
      ```

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Single-turn execution
      with resume".
    status:
      implement: done
      refactor: done
      test: done

  - id: abort-propagation
    title: Implement cancellation and abort propagation
    prompt: |
      Each run owns an `AbortController`. The signal propagates to:
      - Every tool invocation via `ctx.signal`
      - MCP client calls (passed as fetch/transport abort signal)
      - Child runs via `ctx.fork()` (each child gets a derived controller —
        aborting parent aborts all children)
      - Async-generator tools via `.return()` on the generator when signal fires

      Callers abort from outside:
      ```ts
      const controller = new AbortController();
      agent().use(memory()).run("Fix tests", { signal: controller.signal });
      controller.abort();
      ```

      When aborted:
      1. Model loop stops after current iteration
      2. In-flight tool calls receive the abort signal
      3. Async-generator tools are returned (`.return()`)
      4. Disposal hooks run in reverse registration order
      5. Run rejects with `AbortError`

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Cancellation and abort".
    status:
      implement: done
      refactor: done
      test: done

