  - id: e2e-hook-token-budget
    title: E2E test - token budget abort via hooks
    prompt: |
      Write an e2e test for the token budget hook pattern:

      A `PostModelCall` hook tracks cumulative token usage and aborts the run when the
      budget is exceeded.

      ```ts
      const tokenBudget = (max: number): AgentPlugin => ({
        name: "token-budget",
        setup(api) {
          let total = 0;
          api.addHook({
            event: "PostModelCall",
            handler(ctx) {
              total += ctx.tokenCount;
              if (total > max) return "abort";
            },
          });
        },
      });
      ```

      Verify: run aborts when budget exceeded, disposal runs, error is AbortError or
      similar, runs within budget complete normally.
    status:
