  - id: session-adapter
    title: Wire createAgentSession as adapter over new runtime
    prompt: |
      Refactor `packages/poe-agent/src/agent-session.ts` so `createAgentSession(...)`
      becomes a thin adapter over the new fluent builder/runtime:

      ```ts
      export async function createAgentSession(options: CreateAgentSessionOptions) {
        const builder = agent()
          .model(resolveModel(options))
          .use(systemPromptPlugin())
          .use(fileTools())
          .use(shellTools())
          .use(webTools())
          .use(mcpPluginFromOptions(options));
        return adaptAcpToLegacySession(builder);
      }
      ```

      The public API must not change. Two repo surfaces depend on it:
      - `src/providers/poe-agent.ts` — adapts session into ACP lifecycle
      - `src/cli/commands/agent.ts` — CLI agent command

      The provider should use `.acp()` internally so it can act as host. The safest
      migration: add new builder/runtime internally, implement `createAgentSession(...)` as
      adapter, keep provider and CLI stable.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Compatibility Plan".
    status:
