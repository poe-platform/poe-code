      The tool is a plugin; the fork operation is core.

      ```ts
      export const delegate = (): AgentPlugin => ({
        name: "poe-agent-plugin-delegate",
        setup(api) {
          api.addTool({
            name: "delegate",
            description: "Delegate a sub-task to a child agent run",
            inputSchema: {
              type: "object",
              properties: { task: { type: "string", description: "The sub-task to delegate" } },
              required: ["task"],
