  - id: acp-core-intent-emission
    title: Implement ACP core intent emission for tool calls
    prompt: |
      Create `packages/poe-agent/src/runtime/acp-core.ts`.

      The ACP core is the execution engine. It always operates in intent mode — it never
      executes tools directly. The core only proposes, the host decides.

      For each tool call from the model:
      1. Run `PreToolCall` hooks — if skip/reject, handle accordingly
      2. Emit `tool.intent` to host via `AcpHost.handle(intent)`
      3. Suspend — wait for host acknowledgment (`ToolAckResult`)
      4. Run `PostToolCall` hooks
      5. Inject result into conversation history as tool result message

      Each tool call produces exactly this event sequence:
      `tool.intent → (host processes) → tool.result | tool.error`

      There is always exactly one `tool.result` or `tool.error` for each `tool.intent`.
      The `intentId` links them.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md sections "Layer 2: ACP core",
      "Event lifecycle for a single tool call".
    status:
      implement: done
      refactor: done
      test: done

  - id: acp-core-iteration-loop
    title: Implement ACP core iteration loop with hooks
    prompt: |
      In `packages/poe-agent/src/runtime/acp-core.ts`, implement the full iteration loop:

      ```
      while not done:
        PreIteration hooks
        compile prompt from PromptRegistry
        PreModelCall hooks (if not skipped → skip means no model call this iteration)
        send to model
        PostModelCall hooks
        for each tool call in model response:
          PreToolCall → emit intent → wait for ack → PostToolCall
        PostIteration hooks
        if model produced final response (no tool calls) → session.complete
      ```

      Emit `message.delta` events as model tokens stream in. Emit `session.complete` when
      the model produces a final response with no tool calls. Emit `session.error` on
      unrecoverable errors.

      The loop must respect the run's `AbortSignal` — check between iterations and tool calls.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md sections "Hook points in the
      model loop", "Event lifecycle for a full run".
    status:
      implement: done
      refactor: done
      test: done

