tasks:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: ACP Core Types and Contracts
  # ═══════════════════════════════════════════════════════════════════════

  - id: acp-event-types
    title: Define AcpEvent union type
    prompt: |
      Create `packages/poe-agent/src/runtime/acp-types.ts`.

      Define the `AcpEvent` discriminated union type with these variants:
      - `{ type: "message.delta"; content: string }` — streaming model token output
      - `{ type: "tool.intent"; intentId: string; tool: string; args: unknown }` — core proposes a tool call
      - `{ type: "tool.result"; intentId: string; result: unknown }` — host acknowledges success
      - `{ type: "tool.error"; intentId: string; error: string }` — host acknowledges failure
      - `{ type: "fork.start"; forkId: string; prompt: string }` — child run spawned
      - `{ type: "fork.complete"; forkId: string; result: ForkResult }` — child run finished
      - `{ type: "fork.error"; forkId: string; error: string }` — child run failed
      - `{ type: "progress"; message: string }` — informational status update
      - `{ type: "session.complete"; result: SessionResult }` — terminal success
      - `{ type: "session.error"; error: Error }` — terminal failure

      Every tool call produces exactly one `tool.intent` followed by exactly one `tool.result`
      or `tool.error`, linked by `intentId`. Every run emits exactly one terminal event.

      Define `SessionResult = { output: string; messages: ChatMessage[]; toolCalls: ToolCallRecord[] }`.

      These are internal contracts — export from a runtime barrel, not from package public API yet.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "ACP event stream".
    status:
      implement: done
      refactor: done
      test: done

  - id: acp-host-interface
    title: Define AcpHost interface and intent types
    prompt: |
      In `packages/poe-agent/src/runtime/acp-types.ts`, add the host interface.

      `AcpHost` is the single extension point between the ACP core and execution modes.
      The core emits intents; the host decides how to handle them. This is the fundamental
      design rule: the core only proposes, the host decides.

      ```ts
      type AcpHost = {
        handle(intent: ToolIntent): Promise<ToolAckResult>;
      };
      ```

      `ToolIntent` represents the core requesting that a tool be executed:
      ```ts
      type ToolIntent = { intentId: string; tool: string; args: unknown };
      ```

      `ToolAckResult` is the host's response — either success with a result or error:
      ```ts
      type ToolAckResult = { status: "success" | "error"; result: unknown };
      ```

      Every execution mode (`.run()`, `.stream()`, `.acp()`) provides its own `AcpHost`
      implementation. That is the only thing that varies between them.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Host interface".
    status:
      implement: done
      refactor: done
      test: done

  - id: fork-types
    title: Define ForkRequest, ForkResult, and RunContextSnapshot types
    prompt: |
      In `packages/poe-agent/src/runtime/acp-types.ts`, add fork-related types.

      Fork is a core runtime primitive, not a plugin. It clones the entire live run
      context and starts a new turn with a new prompt. The fork mechanism lives in
      the core because only the core has access to the live run context mid-execution.

      `ForkRequest` captures what the core sends to the host:
      ```ts
      type ForkRequest = { forkId: string; prompt: string; context: RunContextSnapshot };
      ```

      `ForkResult` is what comes back:
      ```ts
      type ForkResult = { output: string; messages: ChatMessage[] };
      ```

      `RunContextSnapshot` captures cloneable run state: conversation history, registered
      tools, capabilities, prompt pipeline. Keep it minimal — expand later as needed.

      Fork vs resume: fork is mid-run (parent-child concurrent, abort cascades), resume
      is after run completes (sequential, independent).

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Fork is a core
      runtime primitive" and "Fork vs resume".
    status:
      implement: done
      refactor: done
      test: done

  - id: tool-context-type
    title: Define ToolContext type
    prompt: |
      In `packages/poe-agent/src/runtime/acp-types.ts`, add `ToolContext`.

      Every tool `call()` receives a `ToolContext` providing:
      - `require<T>(key)` — typed capability lookup (same as `PluginApi.require`)
      - `fork(prompt)` — core fork primitive to spawn a child run
      - `signal` — the run's `AbortSignal` for cancellation

      ```ts
      type ToolContext = {
        require<T>(key: CapabilityKey<T>): T;
        fork(prompt: string): Promise<ForkResult>;
        signal: AbortSignal;
      };
      ```

      Forward-reference `CapabilityKey<T>` — defined in the plugin types task.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Capabilities" (ToolContext).
    status:
      implement: done
      refactor: done
      test: done

  - id: tool-type
    title: Define Tool and NormalizedTool types
    prompt: |
      In `packages/poe-agent/src/runtime/acp-types.ts`, add tool types.

      Plugin authors should be free to expose tools as sync, async, or async-generator
      functions. Internally, the runtime normalizes everything to async-generator so
      progress events and cancellation work uniformly.

      Author-facing `Tool`:
      ```ts
      type Tool = {
        name: string;
        description?: string;
        inputSchema?: unknown;
        visibility?: "model" | "skill" | "internal";
        call(args: unknown, ctx: ToolContext): unknown | Promise<unknown> | AsyncGenerator<ToolEvent, unknown, void>;
      };
      ```

      Internal `NormalizedTool` (all handlers are async-generator):
      ```ts
      type NormalizedTool = {
        name: string;
        description?: string;
        inputSchema?: unknown;
        visibility: "model" | "skill" | "internal";
        invoke(args: unknown, ctx: ToolContext): AsyncGenerator<ToolEvent, unknown, void>;
      };
      ```

      There is no `mediation` property — ACP core always emits intents. The host decides
      whether to call `tool.call()` (local) or execute externally (ACP host).

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Tool shape".
    status:
      implement: done
      refactor: done
      test: done

  - id: runtime-barrel
    title: Create runtime barrel export
    prompt: |
      Create `packages/poe-agent/src/runtime/index.ts` as a barrel export for all
      runtime types from `acp-types.ts`.

      This barrel is internal — do not re-export from the package's main `index.ts` yet.
      Verify all types compile without errors.
    status:
      implement: done
      refactor: done
      test: done

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: Plugin Types and Capability System
  # ═══════════════════════════════════════════════════════════════════════

  - id: capability-key-type
    title: Define CapabilityKey branded type and factory
    prompt: |
      Create `packages/poe-agent/src/runtime/capabilities.ts`.

      Plugins should depend on capability tokens, not plugin name strings. This decouples
      plugins from specific implementations — any plugin that provides `MemoryCapability`
      satisfies the dependency.

      ```ts
      type CapabilityKey<T> = symbol & { __capabilityType: T };
      function createCapabilityKey<T>(name: string): CapabilityKey<T>;
      ```

      Bad: `dependsOn: ["@poe-code/poe-agent-plugin-memory"]`
      Good: `dependsOn: [MemoryCapability]`

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Capabilities, not
      plugin-to-plugin calls".
    status:
      implement: done
      refactor: done
      test: done

  - id: capability-registry
    title: Implement CapabilityRegistry class
    prompt: |
      In `packages/poe-agent/src/runtime/capabilities.ts`, add `CapabilityRegistry`.

      The registry stores provided capabilities by key. It enforces:
      - `provide(key, value)` — registers a capability; throws on duplicate (no silent overwrite)
      - `require(key)` — returns the capability or throws `MissingCapabilityError`
      - `tryRequire(key)` — returns the capability or `undefined`

      The builder validates at `.run()` time — before any `setup()` executes — that every
      declared capability dependency is satisfiable by a registered plugin. Missing capabilities
      produce a clear error at composition time, not a runtime crash mid-execution.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Capabilities".
    status:
      implement: done
      refactor: done
      test: done

  - id: plugin-type
    title: Define AgentPlugin type
    prompt: |
      Create `packages/poe-agent/src/runtime/plugin-types.ts`.

      `AgentPlugin` is the main extension mechanism. Plugins may contribute tools, prompt
      fragments, prompt transforms, hooks, capabilities, async setup, and teardown.

      ```ts
      type AgentPlugin = {
        name: string;
        provides?: CapabilityKey[];
        dependsOn?: CapabilityKey[];
        tools?: Tool[];
        prompts?: { system?: string[]; prefix?: string[]; suffix?: string[] };
        prompt?: (ctx: PromptContext) => PromptContext | Promise<PromptContext>;
        setup?: (api: PluginApi) => void | Promise<void>;
      };
      ```

      Most plugins should be declarative (just `tools` and `prompts`). The `setup()` hook
      is for imperative async work like MCP connections, capability provision, and dynamic
      tool registration.

      Builder registration stays synchronous. Runtime setup is asynchronous — async work
      happens only when `.run()` starts.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Plugin shape" and
      "Async all the way down at run start".
    status:
      implement: done
      refactor: done
      test: done

  - id: plugin-api-type
    title: Define PluginApi interface
    prompt: |
      In `packages/poe-agent/src/runtime/plugin-types.ts`, add `PluginApi`.

      `PluginApi` is the run-scoped API that plugins receive in their `setup()` call.
      Each `.run()` creates a fresh `PluginApi` instance — plugins never get builder-scoped
      access.

      ```ts
      type PluginApi = {
        provide<T>(key: CapabilityKey<T>, value: T): void;
        require<T>(key: CapabilityKey<T>): T;
        tryRequire<T>(key: CapabilityKey<T>): T | undefined;
        addTool(tool: Tool): void;
        addPromptTransform(fn: PromptTransform): void;
        addHook(hook: Hook): void;
        onDispose(fn: () => void | Promise<void>): void;
      };
      ```

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Capabilities" (PluginApi).
    status:
      implement: done
      refactor: done
      test: done

  - id: hook-types
    title: Define Hook, HookEvent, HookContext, and HookDecision types
    prompt: |
      In `packages/poe-agent/src/runtime/plugin-types.ts`, add hook types.

      Hooks follow the same model as Claude Code hooks — one hook system, not two. Every
      hook can observe, modify state, and control flow.

      Hook points in the model loop:
      ```
      PreIteration → PreModelCall → model call → PostModelCall →
        for each tool: PreToolCall → intent → PostToolCall →
      PostIteration
      ```
      Plus `PreFork`/`PostFork` when a tool calls `ctx.fork()`.

      `HookDecision` controls flow:
      - `"continue"` — proceed normally (default when returning void)
      - `"skip"` — skip this operation (Pre hooks only)
      - `"abort"` — abort the entire run, trigger disposal
      - `{ reject: string }` — PreToolCall returns error to model as tool error so it can
        recover; other hooks abort the run
      - `{ modify: Partial<HookContext> }` — apply changes to context

      Multiple hooks on the same event run in registration order. If any returns a non-continue
      decision, later hooks still run (observe), but the first non-continue decision wins.

      `HookContext` is mutable — hooks can modify messages, args, results directly.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Hooks" with all subsections.
    status:
      implement: done
      refactor: done
      test: done

  - id: prompt-context-type
    title: Define PromptContext type
    prompt: |
      In `packages/poe-agent/src/runtime/plugin-types.ts`, add `PromptContext`.

      The runtime must model the initial task prompt explicitly rather than collapsing
      everything into one opaque merged string too early. This enables reasoning about
      prompt provenance — whether an instruction came from the built-in default, a plugin,
      a skill, or the caller.

      ```ts
      type PromptContext = {
        baseSystemPrompt?: string;   // explicit content from SYSTEM_PROMPT.md
        system?: string;             // composed result after plugin contributions + transforms
        userPrompt: string;          // caller's actual task input — never merged early
        metadata?: Record<string, unknown>;
      };
      ```

      The built-in `SYSTEM_PROMPT.md` is tracked as `baseSystemPrompt`. Plugin contributions
      are composed into `system`. The task input stays in `userPrompt`. Final chat messages
      are compiled from these explicit fields late in the pipeline.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md sections "Prompt context",
      "Initial prompt should be explicit".
    status:
      implement: done
      refactor: done
      test: done

  - id: error-types
    title: Define runtime error types
    prompt: |
      Create `packages/poe-agent/src/runtime/errors.ts`.

      Errors are categorized by where they occur in the runtime lifecycle:

      **Composition time** (at `.run()`, before any `setup()` executes):
      - `MissingCapabilityError` — lists unsatisfied `CapabilityKey` and which plugin declared it
      - `DuplicateToolError` — names both existing and conflicting plugin
      - `CircularDependencyError` — includes the cycle path

      **Plugin setup time** (during async `setup()` execution):
      - `PluginSetupError` — wraps original error, identifies failing plugin

      **Run time** (during model loop):
      - `PromptTransformError` — wraps original error, identifies failing plugin

      All errors extend `Error` with descriptive messages containing the relevant context.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Error model".
    status:
      implement: done
      refactor: done
      test: done

  # ═══════════════════════════════════════════════════════════════════════
  # COMMIT MILESTONE: ACP types, plugin types, capability system
  # ═══════════════════════════════════════════════════════════════════════

  - id: commit-types-and-capabilities
    title: Commit all runtime types, plugin types, and capability system
    prompt: |
      Commit all work from Phase 1 and Phase 2:
      - ACP event types, host interface, fork types, tool context, tool/normalized-tool types
      - Runtime barrel export
      - CapabilityKey, CapabilityRegistry
      - AgentPlugin, PluginApi, Hook types, PromptContext
      - Runtime error types

      All types should compile. All tests should pass.
    status:
      commit: done

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Tool Registry
  # ═══════════════════════════════════════════════════════════════════════

  - id: tool-normalizer
    title: Implement tool handler normalization
    prompt: |
      Create `packages/poe-agent/src/runtime/tools.ts`.

      Plugin authors can expose tools as sync functions, async functions, or async
      generators. The runtime must normalize everything to one execution contract
      (async-generator) so progress events and cancellation work uniformly.

      Implement `normalizeTool(tool: Tool): NormalizedTool` that wraps:
      - Sync `call()` → async generator yielding nothing, returning the result
      - Async `call()` → async generator yielding nothing, returning the awaited result
      - Async generator `call()` → used directly as the invoke implementation

      Errors in the original `call()` must propagate through the normalized generator.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Tool authoring should
      be flexible, runtime execution should be uniform".
    status:
      implement: done
      refactor: done
      test: done

  - id: tool-registry-core
    title: Implement ToolRegistry register and lookup
    prompt: |
      In `packages/poe-agent/src/runtime/tools.ts`, add `ToolRegistry`.

      The registry normalizes tools on registration and stores them by name. It enforces
      strict name uniqueness — no silent overwrite, no last-write-wins. This applies equally
      to built-in tools, plugin-contributed tools, and MCP tools. MCP tools retain their
      namespace prefix (`server_name.tool_name`) which naturally avoids collisions with
      non-MCP tools.

      ```ts
      class ToolRegistry {
        register(tool: Tool): void;     // normalizes, stores, throws DuplicateToolError on collision
        get(name: string): NormalizedTool | undefined;
        getAll(): NormalizedTool[];
      }
      ```

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Tool name collisions throw".
    status:
      implement: done
      refactor: done
      test: done

  - id: tool-visibility
    title: Add visibility-aware active tool computation
    prompt: |
      In `packages/poe-agent/src/runtime/tools.ts`, add to `ToolRegistry`:

      ```ts
      getActiveTools(activeSkills?: string[]): NormalizedTool[];
      ```

      The runtime registers tools first, then computes which are visible to the model for
      a particular run. This separation is what makes hidden MCP viable.

      Visibility levels:
      - `model` (default when unspecified): always visible to the model
      - `skill`: hidden by default, visible only when a matching skill activates it
      - `internal`: never visible to the model, but still callable by plugins via `get()`

      The active tool view is computed per run and never mutated permanently.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Tool registration is
      separate from tool visibility".
    status:
      implement: done
      refactor: done
      test: done

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4: Prompt Pipeline
  # ═══════════════════════════════════════════════════════════════════════

  - id: prompt-fragment-collection
    title: Implement prompt fragment collection phase
    prompt: |
      Create `packages/poe-agent/src/runtime/prompts.ts`.

      Prompt composition is a two-phase pipeline. This task implements phase 1: fragment
      collection.

      All `prompts.system`, `prompts.prefix`, and `prompts.suffix` arrays from registered
      plugins are concatenated in registration order with newline separators. This produces
      the initial `system` string before any transforms run.

      Fragments are pure data — they build up. Ordering is deterministic: always registration
      order, regardless of plugin dependency topology.

      ```ts
      class PromptRegistry {
        addFragments(prompts: { system?: string[]; prefix?: string[]; suffix?: string[] }): void;
        collectFragments(): { system: string; prefix: string; suffix: string };
      }
      ```

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Prompt composition
      is a two-phase pipeline" — phase 1.
    status:
      implement: done
      refactor: done
      test: done

  - id: prompt-transform-execution
    title: Implement prompt transform execution phase
    prompt: |
      In `packages/poe-agent/src/runtime/prompts.ts`, add transform execution — phase 2.

      All `prompt()` transforms run in registration order over the assembled `PromptContext`.
      Each transform receives the output of the previous one. A transform that needs to
      fully replace the system prompt can overwrite `system` — but it always sees the fully
      assembled fragment result, never a partial one.

      ```ts
      addTransform(fn: PromptTransform): void;
      async compile(userPrompt: string, baseSystemPrompt?: string): Promise<PromptContext>;
      ```

      The `compile` method: (1) collects fragments into initial system/prefix/suffix,
      (2) builds `PromptContext` with `baseSystemPrompt`, assembled `system`, and `userPrompt`,
      (3) chains all transforms in registration order.

      The important rule: `userPrompt` must stay explicit through the entire pipeline.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Prompt composition
      is a two-phase pipeline" — phase 2.
    status:
      implement: done
      refactor: done
      test: done

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 5: Plugin Dependency Resolution
  # ═══════════════════════════════════════════════════════════════════════

  - id: topo-sort
    title: Implement topological sort for plugin setup order
    prompt: |
      Create `packages/poe-agent/src/runtime/plugin-resolver.ts`.

      Plugin `setup()` functions run in topological order derived from `dependsOn`
      declarations. If plugin B depends on a capability provided by plugin A, A's setup
      runs first. Within the same topological tier (no dependencies between them), plugins
      run in registration order.

      This is distinct from fragment and transform ordering, which always follows registration
      order regardless of dependencies. The rule is:
      - `setup()` — topological order (dependency-safe)
      - `prompts.system` / `prompts.prefix` / `prompts.suffix` — registration order
      - `prompt()` transforms — registration order

      Use `provides` field on `AgentPlugin` to determine what each plugin offers.
      Throw `CircularDependencyError` with the cycle path if cycles detected.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Plugin setup runs
      in dependency-topological order".
    status:
      implement: done
      refactor: done
      test: done

  - id: dependency-validation
    title: Implement pre-setup dependency validation
    prompt: |
      In `packages/poe-agent/src/runtime/plugin-resolver.ts`, add composition-time validation.

      At `.run()` time, before any `setup()` executes, validate that every `dependsOn`
      capability key is satisfiable by a registered plugin's `provides` list. Missing
      capabilities produce a clear `MissingCapabilityError` at composition time, not a
      runtime crash mid-execution.

      This is important for user experience: when a server plugin like `filesystemMcp()`
      is used without the `mcp()` plugin, the error should clearly say "McpCapability is
      required by filesystem-mcp but not provided by any registered plugin."

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Error model" —
      composition time errors.
    status:
      implement: done
      refactor: done
      test: done

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 6: Hook System
  # ═══════════════════════════════════════════════════════════════════════

  - id: hook-registry
    title: Implement hook registry and execution engine
    prompt: |
      Create `packages/poe-agent/src/runtime/hooks.ts`.

      The hook system is how plugins observe, modify state, and control flow at each point
      in the model loop. There is one hook system, not two.

      ```ts
      class HookRegistry {
        add(hook: Hook): void;
        async run(event: HookEvent, ctx: HookContext): Promise<HookDecision>;
      }
      ```

      Execution semantics:
      - Multiple hooks on the same event run in registration order
      - All hooks run even after a non-continue decision (they can observe)
      - The first non-continue decision wins — later non-continue decisions are ignored
      - Returning `void`/`undefined` means `"continue"`

      Hook context is mutable — hooks can modify `messages`, `args`, `forkPrompt` directly.
      The `{ modify }` decision is an alternative to direct mutation.

      Decision behavior differs between Pre and Post hooks:
      - `"skip"` on Pre hooks skips the operation; on Post hooks it's a no-op (already ran)
      - `{ reject }` on PreToolCall returns error to model as tool error so it can recover

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Hooks".
    status:
      implement: done
      refactor: done
      test: done

  - id: hook-context-builder
    title: Implement HookContext construction for each hook point
    prompt: |
      In `packages/poe-agent/src/runtime/hooks.ts`, add factory functions that build
      `HookContext` for each hook point.

      Each hook point has different fields available:
      - Always available: `event`, `iterationNumber`, `signal`, `messages`, `tokenCount`, `fork()`
      - PreModelCall/PostModelCall add: `tools` (read-only), `response` (Post only)
      - PreToolCall/PostToolCall add: `tool`, `args` (mutable on Pre), `intentId`, `result`/`error` (Post only)
      - PreFork/PostFork add: `forkId`, `forkPrompt` (mutable on Pre), `forkResult` (Post only)

      This gives plugin authors a consistent but context-aware API at each hook point.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Hook context".
    status:
      implement: done
      refactor: done
      test: done

  - id: hook-decision-application
    title: Implement hook decision dispatch logic
    prompt: |
      Implement `applyHookDecision(event, decision, ctx)` that applies decisions correctly
      at each hook point.

      Key behavioral rules:
      - `PreToolCall` + `skip` → tool not executed, no intent emitted to host
      - `PreToolCall` + `{ reject: msg }` → error returned to model as tool error result,
        model can recover with an alternative approach
      - `PreModelCall` + `skip` → model call skipped entirely for this iteration
      - `PreFork` + `skip` → fork not created
      - `abort` at any point → triggers run disposal and `AbortError`
      - `{ modify }` → shallow-merge changes into the mutable `HookContext`

      This dispatch table is the contract between hooks and the model loop.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Hook decisions" —
      decision behavior table.
    status:
      implement: done
      refactor: done
      test: done

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 7: Run Context and Disposal
  # ═══════════════════════════════════════════════════════════════════════

  - id: run-context
    title: Implement RunContext with mutable run state
    prompt: |
      Create `packages/poe-agent/src/runtime/run-context.ts`.

      The builder is immutable. `RunContext` is where mutation happens — it holds all
      mutable state for a single run:
      - Conversation history (messages array)
      - ToolRegistry, CapabilityRegistry, PromptRegistry, HookRegistry (all populated during setup)
      - Active skills list
      - AbortController (owned, with derived signal)
      - Child-run bookkeeping for fork tracking

      A fresh `RunContext` is created per `.run()` call. It is never shared between runs.
      Two `.run()` calls on the same builder produce completely independent contexts.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Immutable builder,
      mutable run state".
    status:
      implement: done
      refactor: done
      test: done

  - id: disposal-registry
    title: Implement disposal registry with reverse-order cleanup
    prompt: |
      In `packages/poe-agent/src/runtime/run-context.ts`, add disposal management.

      Disposal hooks registered via `onDispose()` run in reverse registration order during
      cleanup. This ensures resources are torn down in the opposite order they were created.

      Critical rules:
      - If a disposal hook throws, log the error and continue — never abort disposal midway
      - After all hooks run, if any threw, throw `AggregateError` with all failures
      - Plugin `setup()` failure triggers disposal for already-setup plugins only (reverse order)
      - Dispose must be idempotent — calling twice is safe

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Error model" — disposal time.
    status:
