    title: Implement fork in local host
    prompt: |
      In `packages/poe-agent/src/runtime/local-host.ts`, implement `fork()` on `ToolContext`.

      What gets cloned per fork:
      - Full conversation history up to the fork point
      - All registered tools and their current state
      - Capabilities and their values
      - Prompt pipeline (fragments + transforms)
      - The host binding (child uses the same host as parent)

      What is new per fork:
      - A new prompt (the child's task)
      - A derived `AbortController` (aborting parent aborts all children)
      - A new event stream (child events are separate)
      - A new model loop turn

      The child run executes using the same local host. The fork emits `fork.start`
      and `fork.complete`/`fork.error` ACP events on the parent's event stream.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section "Fork is a core
      runtime primitive" — "What gets cloned" and "What is new per fork".
