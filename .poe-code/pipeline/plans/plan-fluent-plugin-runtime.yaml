  - id: e2e-hook-guardrails
    title: E2E test - hook-based guardrails
    prompt: |
      Write an e2e test for the guardrails hook pattern from the plan:

      A `PreToolCall` hook blocks forbidden commands and returns a rejection to the model.
      The model receives the rejection as a tool error and can try a different approach.

      ```ts
      const guardrails = (): AgentPlugin => ({
        name: "guardrails",
        setup(api) {
          api.addHook({
            event: "PreToolCall",
            handler(ctx) {
              if (ctx.tool === "run_command" && isForbidden(ctx.args)) {
                return { reject: `Blocked forbidden command` };
              }
            },
          });
        },
      });
      ```

      Verify: forbidden command rejected, model receives error as tool result, model
      recovers with alternative, non-forbidden commands execute normally.
