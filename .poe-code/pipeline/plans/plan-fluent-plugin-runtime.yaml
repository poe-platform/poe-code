  - id: local-host-impl
    title: Implement local AcpHost for direct tool execution
    prompt: |
      Create `packages/poe-agent/src/runtime/local-host.ts`.

      The local host is the simplest `AcpHost` — it executes tool `call()` functions
      directly in-process. Both `.run()` and `.stream()` use this host.

      When receiving a `ToolIntent`:
      1. Look up the `NormalizedTool` from the registry by name
      2. If not found → return `{ status: "error", result: "Unknown tool: <name>" }`
      3. Execute `tool.invoke(args, ctx)` consuming the async generator
      4. Catch errors → return `{ status: "error", result: errorMessage }`
      5. Return `{ status: "success", result }`

      Pass the run's `AbortSignal` through the `ToolContext`.

      Reference: docs/plans/poe-agent/fluent-plugin-runtime.md section ".run()" — local host.
    status:
