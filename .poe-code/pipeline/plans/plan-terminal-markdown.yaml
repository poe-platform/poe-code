tasks:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: AST types + Block parser
  # ═══════════════════════════════════════════════════════════════════════

  - id: ast-types
    title: Define MdNode AST union type
    prompt: |
      Create `packages/design-system/src/terminal-markdown/ast.ts`.

      Define the `MdNode` discriminated union type exactly as specified in the plan at
      `docs/plans/cli-markdown-renderer.md` (section "AST Node Types"). The type must cover:

      - root, heading (depth 1-6), paragraph, blockquote, code (with lang/meta), list (ordered/unordered with start),
        listItem (with checked for task lists), thematicBreak
      - table, tableRow, tableCell
      - html, text, emphasis, strong, strikethrough, inlineCode
      - link (url, title, children), image (url, alt, title), break
      - frontmatter (data: Record<string, unknown>)
      - GFM extensions: alert (kind: NOTE|TIP|IMPORTANT|WARNING|CAUTION), footnoteDefinition (label), footnoteReference (label)

      Export `MdNode` as a named export. This is a types-only file — no runtime code.

      Also create `packages/design-system/src/terminal-markdown/index.ts` as a barrel with
      placeholder exports (just re-export `MdNode` for now, the `parse`/`render`/`renderMarkdown`
      functions will be added in later tasks).
    status:
      implement: open
      refactor: open
      test: open
      commit: open

  - id: block-parser-core
    title: Implement block parser with fenced code, headings, thematic breaks, paragraphs
    prompt: |
      Create `packages/design-system/src/terminal-markdown/parser/block.ts`.

      Implement a block-level parser that takes a markdown string and returns an array of `MdNode` children
      for a root node. Use a line-by-line rule chain approach (inspired by markdown-it's architecture).
      No regex for core parsing — use string scanning with position tracking.

      The block parser rules should be checked in this priority order (from `docs/plans/cli-markdown-renderer.md`):
      1. Fenced code blocks (``` and ~~~) — with language specifier and meta string support
      2. ATX headings (# through ######) — with closing hashes support, up to 3 leading spaces allowed
      3. Thematic breaks (---, ***, ___) — with spaces between characters
      4. Setext headings (= and - underlines)
      5. Paragraphs (fallback — consecutive non-blank lines)

      The parser must produce `MdNode[]`. It does NOT need to parse inline content yet —
      paragraph/heading children should contain a single `{ type: "text", value: "raw content" }` node
      for now. Inline parsing will be layered on in a later task.

      Important edge cases:
      - Fenced code blocks: unclosed fence treats rest of doc as code (test 115)
      - Code fence with trailing spaces still closes the block (test 152)
      - ATX heading with 7+ `#` signs → paragraph, not heading (test 126)
      - Heading with no text after `#` → empty heading node (test 125)
      - Indented heading (up to 3 spaces) still parses as heading (test 140)
      - Missing blank line before heading — heading wins (test 141)
      - Missing blank line before code block — code block wins (test 142)
      - Empty document / whitespace-only / newline-only → empty root (tests 79-81)
      - Multiple blank lines between blocks collapse (test 82)
      - CRLF line endings (test 94)
      - BOM at start of document — strip silently (test 148)
      - Fenced code block containing markdown-like content should NOT be parsed (test 13)
      - Indented code blocks (4 spaces) (test 14)
      - Empty fenced code block (test 15)

      Write tests in `packages/design-system/src/terminal-markdown/parser.test.ts` covering
      the block parsing test cases listed above (tests 1-19, 79-82, 94, 115, 125-126, 140-142, 148, 152
      from the plan).

      Import `MdNode` from `../ast.js`.
    status:
      implement: open
      refactor: open
      test: open
      commit: open

  - id: block-parser-blockquotes-lists
    title: Add blockquotes, lists (incl. task lists), and nested structures
    prompt: |
      Extend `packages/design-system/src/terminal-markdown/parser/block.ts` to add
      blockquote and list parsing rules.

      Insert these rules into the existing priority chain (after thematic breaks, before setext headings):

      **Blockquotes** (> prefix):
      - Single-line and multi-line blockquotes
      - Nested blockquotes (`> > nested`)
      - Blockquotes with other block elements inside (headings, lists, code blocks)
      - Deeply nested blockquotes (4+ levels) (test 89)
      - Trailing `>` on empty lines → empty blockquote (test 132)

      **Lists** (-, *, +, 1.):
      - Unordered lists with all three markers
      - Ordered lists starting at 1 or arbitrary numbers
      - Nested lists (unordered inside unordered, mixed)
      - Task lists: `- [x] done` and `- [ ] todo` with `checked` property on listItem
      - Nested task lists
      - Task list items with inline formatting (leave as raw text for now)
      - List item with multiple paragraphs (blank line between) (test 85)
      - List item continuation (indented text) (test 86)
      - Code block inside blockquote (test 87)
      - Empty list items from `- \n- \n` (test 133)
      - Non-sequential ordered list numbers preserved (test 134)
      - Missing blank line before list — list wins (test 143)
      - Tabs mixed with spaces in list indentation — normalize tabs to 4 spaces (test 145)
      - List item with sub-item that looks like thematic break (test 153)

      Add tests to `packages/design-system/src/terminal-markdown/parser.test.ts` covering
      tests 20-30, 74-78, 85-87, 89, 132-135, 143, 145, 153 from the plan.
    status:
      implement: open
      refactor: open
      test: open
      commit: open

  - id: block-parser-tables-alerts-footnotes-html
    title: Add tables, alerts, footnotes, and HTML block parsing
    prompt: |
      Extend `packages/design-system/src/terminal-markdown/parser/block.ts` to add
      the remaining block-level rules.

      Insert these rules into the existing priority chain:

      **HTML blocks**:
      - Block-level HTML content
      - HTML-like content that isn't valid HTML (`<not a tag>`) — render as text (test 136)

      **GitHub Alerts / Admonitions** (`> [!NOTE]`, `> [!TIP]`, `> [!IMPORTANT]`, `> [!WARNING]`, `> [!CAUTION]`):
      - All five alert types (tests 95-99)
      - Alert with multi-line content (test 100)
      - Alert with inline formatting inside (test 101) — leave as raw text for now
      - Alert with nested block elements like lists inside (test 102)
      - Alert with unknown type (`> [!UNKNOWN]`) → treat as regular blockquote (test 137)
      - Alerts are detected BEFORE regular blockquotes in the rule chain: when a blockquote
        starts with `[!TYPE]` on the first line, parse it as an alert instead

      **GFM Pipe Tables**:
      - Simple 2-column table (test 56)
      - Table with left/center/right alignment from separator row (test 57)
      - Table with inline formatting in cells (leave as raw text for now) (test 58)
      - Table with empty cells (test 59)
      - Table with varying column counts — short rows padded (test 60)
      - Table with escaped pipes in cells `\|` (test 61)
      - Table with no alignment row → should NOT parse as table (test 62)
      - Minimal table: header + separator + 1 row (test 63)
      - Table with and without leading/trailing pipes (tests 64-65)
      - Table separator row with wrong format → don't parse as table (test 129)
      - Table with only header row (no data rows) → render header only (test 128)
      - Table with inconsistent column counts across rows → pad/truncate gracefully (test 127)

      **Footnote Definitions** (`[^label]: content`):
      - Simple footnote definition (test 103)
      - Footnote with multi-line content (test 104)
      - Multiple footnotes (test 105)
      - Footnote with alphanumeric label `[^note1]` (test 109)

      Add tests to `packages/design-system/src/terminal-markdown/parser.test.ts` covering
      tests 56-65, 95-102, 103-105, 109, 127-129, 136-137 from the plan.
    status:
      implement: open
      refactor: open
      test: open
      commit: open

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: Inline parser
  # ═══════════════════════════════════════════════════════════════════════

  - id: inline-parser
    title: Implement inline parser with emphasis, code, links, images, escapes
    prompt: |
      Create `packages/design-system/src/terminal-markdown/parser/inline.ts`.

      Implement an inline-level parser that takes a raw text string and returns `MdNode[]`.
      Use character-by-character scanning with a delimiter stack for emphasis/strong.
      No regex for core parsing.

      Inline rules in priority order:
      1. **Escapes** (`\` + special character) — tests 48-49
      2. **Inline code** (single/double backtick) — tests 38-40
      3. **Links** `[text](url "title")` and **images** `![alt](url "title")` — tests 41-47
         - Link with empty text `[](url)` (test 43)
         - Nested emphasis inside link `[**bold** link](url)` (test 47)
         - Link URL with spaces — preserve (test 149)
         - Link URL with parentheses — match parens correctly (test 150)
      4. **Autolinks** `<url>` — test 44
      5. **HTML inline tags** — test 53
      6. **Emphasis/strong** (* and _) using delimiter stack algorithm — tests 31-37, 54-55
         - Emphasis with asterisks and underscores
         - Strong with asterisks and underscores
         - Strong emphasis (`***both***`)
         - Emphasis inside a word (`foo*bar*baz`)
         - Underscore in middle of word is NOT emphasis (`foo_bar_baz`) (test 37)
         - Emphasis across line boundaries (test 54)
         - Nested strong inside emphasis (test 55)
         - Emphasis marker adjacent to punctuation `"*hello*"` (test 151)
         - Spaces inside emphasis markers (`* spaced *`) → NOT emphasis per CommonMark (test 144)
      7. **Strikethrough** (`~~deleted~~`) — test 52
      8. **Footnote references** (`[^label]`) — tests 103, 106, 108, 138
         - Reference without matching definition → render as literal text
      9. **Autolink literals** (bare URLs: `www.example.com`, `https://...`, `user@example.com`) — tests 110-114
         - Not triggered inside code span or link (test 114)
      10. **Line breaks** (trailing two spaces or backslash) — tests 50-51
      11. **Plain text** (fallback)

      Malformed input edge cases:
      - Unclosed emphasis → render marker as literal (tests 116-117)
      - Unclosed strikethrough → render `~~` as literal (test 118)
      - Unclosed link bracket → render as literal (tests 119, 121)
      - Link with missing URL `[text]()` → empty link (test 120)
      - Image with missing alt/url `![]()` → graceful empty image (test 122)
      - Nested unclosed emphasis (test 123)
      - Mismatched emphasis markers `*hello_` → literal (test 124)

      Then **integrate** the inline parser into the block parser: after block parsing completes,
      walk the AST and run inline parsing on all text content within paragraphs, headings,
      blockquote children, list item children, table cells, alert children, and footnote definitions.
      Code blocks and frontmatter should NOT have inline parsing applied.

      Write tests in `packages/design-system/src/terminal-markdown/parser.test.ts` covering
      all inline tests listed above.
    status:
      implement: open
      refactor: open
      test: open
      commit: open

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Frontmatter parser
  # ═══════════════════════════════════════════════════════════════════════

  - id: frontmatter-parser
    title: Implement custom YAML-subset frontmatter parser
    prompt: |
      Create `packages/design-system/src/terminal-markdown/parser/frontmatter.ts`.

      Implement a custom YAML-subset parser that extracts frontmatter from the top of a markdown
      document. **Zero external dependencies** — no `yaml` or `gray-matter` libraries.

      The parser must handle:
      - Simple key-value pairs: `key: value` (test 66)
      - Nested objects via indentation (test 67)
      - Arrays via `- item` syntax (test 68)
      - Value types: strings (quoted and unquoted), numbers, booleans (`true`/`false`), null
      - Special characters in values (test 73)
      - Empty frontmatter body `---\n---` (test 71)
      - Frontmatter-like content NOT at document start → treated as thematic break (test 72)
      - Frontmatter with unclosed `---` (no closing fence) → treat `---` as thematic break (test 130)
      - Invalid YAML (bad indentation, `: ` in values) → return raw string as data (test 131)

      The exported function signature:
      ```typescript
      function extractFrontmatter(markdown: string): {
        frontmatter?: Record<string, unknown>;
        body: string;
      }
      ```

      Integrate into the block parser: call `extractFrontmatter` first, then parse the `body`.
      If frontmatter was found, prepend a `{ type: "frontmatter", data }` node to the root's children.

      Also update `packages/design-system/src/terminal-markdown/index.ts` to export the public API:
      ```typescript
      export function parse(markdown: string): { frontmatter?: Record<string, unknown>; ast: MdNode };
      ```

      Write tests covering tests 66-73, 130-131 from the plan.
    status:
      implement: open
      refactor: open
      test: open
      commit: open

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4: Renderer
  # ═══════════════════════════════════════════════════════════════════════

  - id: renderer
    title: Implement AST-to-ANSI renderer using design-system tokens
    prompt: |
      Create `packages/design-system/src/terminal-markdown/renderer.ts`.

      Implement a renderer that walks the `MdNode` AST and produces an ANSI-styled string
      using the existing design-system tokens. **No direct chalk usage** — use only the
      design-system primitives via relative imports.

      Required imports (from sibling modules):
      - `../tokens/colors.js` → `getTheme()` is from `../internal/theme-detect.js`, use dark/light palettes
      - `../tokens/typography.js` → `typography.bold()`, `.dim()`, `.italic()`, `.underline()`, `.strikethrough()`
      - `../tokens/spacing.js` → `spacing.sm` for indentation
      - `../tokens/widths.js` → `widths.maxLine` for default width
      - `../components/symbols.js` → `symbols.bar`, `.active`, `.inactive`, `.warning`
      - `../internal/theme-detect.js` → `getTheme()` for theme palette

      Rendering rules (from `docs/plans/cli-markdown-renderer.md` Renderer section):
      | Element | Rendering |
      |---------|-----------|
      | H1 | `theme.header()` + `typography.bold()` + underline via `─` repeat |
      | H2 | `theme.header()` + `typography.bold()` |
      | H3-H4 | `typography.bold()` |
      | H5-H6 | `typography.bold()` + `theme.muted()` |
      | Bold | `typography.bold()` |
      | Italic | `typography.italic()` |
      | Strikethrough | `typography.strikethrough()` |
      | Code span | `theme.accent()` |
      | Code block | `theme.muted()` border, `spacing.sm` indent |
      | Blockquote | `symbols.bar` prefix + `typography.dim()` |
      | Link | children text + `theme.accent()` on `(url)` |
      | Image | `theme.muted("[image: alt]")` |
      | Unordered list | `spacing.sm` indent + `•` bullet |
      | Ordered list | `spacing.sm` indent + `n.` numbering |
      | Task list | `symbols.active` / `symbols.inactive` |
      | Table | `symbols.bar` separators, `spacing.sm` cell padding, aligned columns |
      | HR | `theme.divider()` on `─` repeated to width |
      | Alert NOTE | `symbols.bar` prefix + `theme.info()` "Note" label |
      | Alert TIP | `symbols.bar` prefix + `theme.success()` "Tip" label |
      | Alert IMPORTANT | `symbols.bar` prefix + `theme.info()` "Important" label |
      | Alert WARNING | `symbols.bar` prefix + `theme.warning()` "Warning" label |
      | Alert CAUTION | `symbols.bar` prefix + `theme.error()` "Caution" label |
      | Footnote ref | `typography.dim("[n]")` |
      | Footnote def | Rendered at bottom, numbered, `spacing.sm` indent |
      | Autolink | `theme.accent()` |
      | Frontmatter | `typography.dim()` key-value pairs, or hidden (configurable) |
      | HTML | Rendered as plain text (strip tags or pass through) |
      | Empty nodes | No output — no phantom newlines |

      The renderer accepts `RenderOptions`:
      ```typescript
      interface RenderOptions {
        width?: number;           // terminal width (default: process.stdout.columns or 80)
        showFrontmatter?: boolean; // render frontmatter section (default: false)
      }
      ```

      The `render` function signature:
      ```typescript
      function render(ast: MdNode, options?: RenderOptions): string;
      ```

      Renderer-specific test cases (from the plan):
      - Respects `width` option for line wrapping (test 170)
      - Hides frontmatter by default (test 171)
      - Shows frontmatter when `showFrontmatter: true` (test 172)
      - Indents nested blockquotes correctly (test 173)
      - Aligns table columns (test 174)
      - Numbers ordered lists correctly (test 175)
      - Code block renders with visible boundaries (test 176)
      - Link renders as `text (url)` with color (test 177)
      - Heading renders with appropriate visual weight per level (test 178)
      - Empty nodes produce no output (test 179)

      Write tests in `packages/design-system/src/terminal-markdown/renderer.test.ts`.
    status:
      implement: open
      refactor: open
      test: open
      commit: open

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 5: Integration + public API + exports
  # ═══════════════════════════════════════════════════════════════════════

  - id: public-api-integration
    title: Wire up public API, integration tests, and design-system exports
    prompt: |
      Finalize `packages/design-system/src/terminal-markdown/index.ts` with the full public API:

      ```typescript
      export type { MdNode } from "./ast.js";
      export { parse } from "./parser/...";  // adjust to actual module
      export { render } from "./renderer.js";
      export type { RenderOptions } from "./renderer.js";

      // Convenience: parse + render
      export function renderMarkdown(markdown: string, options?: RenderOptions): string {
        const { ast } = parse(markdown);
        return render(ast, options);
      }
      ```

      Then add exports to the design-system root `packages/design-system/src/index.ts`:
      ```typescript
      // Terminal markdown
      export { parse, render, renderMarkdown } from "./terminal-markdown/index.js";
      export type { MdNode, RenderOptions } from "./terminal-markdown/index.js";
      ```

      Create integration tests in `packages/design-system/src/terminal-markdown/integration.test.ts`
      covering the "Real-World Document Patterns" (tests 155-169 from the plan):

      - README with badges, headings, code blocks, and links (test 155)
      - API documentation: headings + parameter tables + code examples (test 156)
      - Changelog format (test 157)
      - Blog post: frontmatter + headings + paragraphs + images + code + blockquotes (test 158)
      - GitHub issue template: frontmatter + headings + task list + code (test 159)
      - CLI --help output pasted as indented code (test 160)
      - LLM-generated markdown with inconsistencies (test 161)
      - Pipeline plan YAML frontmatter + structured body (test 162)
      - Mixed inline: `**bold _italic_** [link](url) \`code\` ~~strike~~` (test 163)
      - Long code block (50+ lines) with language tag (test 164)
      - Document with 10+ footnotes (test 165)
      - Deeply nested blockquote conversation (test 166)
      - Table-heavy document (5+ tables) (test 167)
      - Document mixing all GitHub alert types (test 168)
      - Large document (1000+ lines) — performance: should parse in <50ms (test 169)

      Also cover the remaining edge cases and common user mistakes not yet tested:
      - Paragraph continuation (test 83)
      - Block-level content interrupts paragraph (test 84)
      - Mixed block types in sequence (test 91)
      - Unicode content — emoji, CJK, RTL (test 92)
      - Tab characters in indentation (test 93)
      - Trailing whitespace on every line (test 146)
      - Double-spaced lines (test 147)
      - Deeply nested broken structure (test 135)
      - Bare `---` ambiguity (test 139)
      - Angle brackets that aren't autolinks (test 154)
      - Link reference definitions `[id]: url "title"` (test 88)

      Ensure all tests pass. The `renderMarkdown` convenience function should work end-to-end.
    status:
      implement: open
      refactor: open
      test: open
      commit: open
