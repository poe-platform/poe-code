id: task
title: Metrics fixture
target:
  repo: fixture
  ref: main
  plan_dest: docs/plans/eval-task.md
scorer:
  command: node "$ORACLE_DIR/score.mjs"
  result_path: score.json
  timeout_ms: 5000
oracle:
  path: oracle
budget:
  max_iterations: 10
  max_tokens: 100000
  wall_clock_ms: 60000
judge:
  agent: codex
  model: openai/gpt-5
  rubric:
    - completeness
weights:
  tests: 1
  judge: 0
metrics:
  - id: task_completion
    enabled: true
    required: true
    weight: 1
    threshold: 1
    evaluator:
      kind: deterministic
  - id: plan_adherence
    enabled: false
    required: false
    weight: 1
    threshold: 0.8
    evaluator:
      kind: judge
  - id: tool_correctness
    enabled: true
    required: false
    weight: 1
    threshold: 1
    evaluator:
      kind: deterministic
  - id: step_efficiency
    enabled: true
    required: false
    weight: 1
    threshold: 1
    evaluator:
      kind: deterministic
      config:
        max_steps: 1
