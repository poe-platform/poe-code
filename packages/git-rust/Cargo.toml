[package]
name = "git-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Full-featured Rust Git implementation with virtual filesystem support for safe-bash"

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
gix-date = "0.17.0"
jiff = { version = "0.2", default-features = false, features = ["std"] }
glob = "0.3.4"
mcp-protocol-rust = { path = "../mcp-protocol-rust" }
regex = "1.13.1"

[[bin]]
name = "git-rust"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sequoia-openpgp = { version = "2.4.1", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
