[package]
name = "git-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Full-featured Rust Git implementation with virtual filesystem support for safe-bash"

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
glob = "0.3.4"
mcp-protocol-rust = { path = "../mcp-protocol-rust" }
regex = "1.13.1"

[[bin]]
name = "git-rust"
path = "src/main.rs"
