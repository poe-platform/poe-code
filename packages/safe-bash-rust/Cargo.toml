[package]
name = "safe-bash-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT AND MPL-2.0 AND LGPL-2.1-or-later AND GPL-2.0-or-later AND Apache-2.0 AND BSL-1.0 AND BSD-3-Clause"
description = "Zero-dependency Rust @poe-platform/safe-bash runtime with Wasm and poe-agent-rust integration"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = ["shell-wasm"]
shell-wasm = []

[dependencies]
diagram-renderer-rust = { path = "../diagram-renderer-rust" }
document-converter-rust = { path = "../document-converter-rust", default-features = false }
mcp-protocol-rust = { path = "../mcp-protocol-rust" }
poe-agent-rust = { path = "../poe-agent-rust" }
config-mutations-rust = { path = "../config-mutations-rust" }
terminal-png-rust = { path = "../terminal-png-rust" }
document-ast-rust = { path = "../document-ast-rust" }
docx-ast-rust = { path = "../docx-ast-rust" }
pdf-ast-rust = { path = "../pdf-ast-rust" }
office-package-rust = { path = "../office-package-rust" }
lua-rust = { path = "../lua-rust" }
safe-bash-command-trash = { path = "../safe-bash-command-trash" }
