[package]
name = "tiny-http-mcp-oauth-test-server-rust-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
mcp-protocol-rust-napi-core = { path = "../../mcp-protocol-rust/bindings/shared" }
mcp-oauth-rust = { path = "../../mcp-oauth-rust" }
auth-store-rust = { path = "../../auth-store-rust" }
tiny-mcp-client-rust = { path = "../../tiny-mcp-client-rust" }
tiny-http-mcp-server-rust = { path = "../../tiny-http-mcp-server-rust" }
tiny-oauth-test-server-rust = { path = "../../tiny-oauth-test-server-rust" }
tiny-http-mcp-oauth-test-server-rust = { path = ".." }
tiny-stdio-mcp-server-rust = { path = "../../tiny-stdio-mcp-server-rust" }
mcp-protocol-rust = { path = "../../mcp-protocol-rust" }
napi = { version = "=3.12.6", default-features = false, features = ["napi6"] }
napi-derive = "=3.6.7"
[build-dependencies]
napi-build = "=2.4.3"
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
